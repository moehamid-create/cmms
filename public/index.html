<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نظام أملاكي — إدارة صيانة المجمعات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;600;700;800&family=Readex+Pro:wght@300;400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@dawod/thmanyah-font-web/index.css">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%230e7490"/><text x="32" y="45" font-size="34" font-weight="bold" text-anchor="middle" fill="white" font-family="Tahoma">أ</text></svg>'>
<style>
@font-face {
  font-family: 'Greta Arabic';
  font-weight: 300;
  src: local('Greta Arabic Light'), local('GretaArabic-Light'), local('Greta Light');
  font-display: swap;
}
@font-face {
  font-family: 'Greta Arabic';
  font-weight: 400;
  src: local('Greta Arabic Regular'), local('GretaArabic-Regular'), local('Greta Arabic'), local('Greta Regular');
  font-display: swap;
}
@font-face {
  font-family: 'Greta Arabic';
  font-weight: 500;
  src: local('Greta Arabic Medium'), local('GretaArabic-Medium'), local('Greta Medium');
  font-display: swap;
}
@font-face {
  font-family: 'Greta Arabic';
  font-weight: 700;
  src: local('Greta Arabic Bold'), local('GretaArabic-Bold'), local('Greta Bold');
  font-display: swap;
}
@font-face {
  font-family: 'Greta Arabic';
  font-weight: 800;
  src: local('Greta Arabic Heavy'), local('GretaArabic-Heavy'), local('Greta Arabic Black'), local('Greta Heavy');
  font-display: swap;
}
:root{
  --font-greta: "Greta Arabic", "Greta", "GretaArabic", "IBM Plex Sans Arabic", "Readex Pro", "Noto Kufi Arabic", "Segoe UI", sans-serif;
  --font-display: "Thmanyah Serif Display", "Greta Arabic", "Reem Kufi", "Noto Kufi Arabic", sans-serif;
  --ink:#132430;--muted:#5f7484;--brand:#0e7490;--dark:#155e75;
  --line:rgba(255,255,255,.65);
  --red:#dc2626;--redbg:rgba(254,226,226,.85);
  --green:#159957;--greenbg:rgba(209,250,229,.85);
  --amber:#d97706;--amberbg:rgba(254,243,199,.85);
  --blue:#2563eb;--bluebg:rgba(219,234,254,.85);
  --purple:#7c3aed;--purplebg:rgba(237,233,254,.85);
  --glass-hi:rgba(255,255,255,.72);--glass-lo:rgba(255,255,255,.34);
  --shadow:0 12px 34px -14px rgba(2,44,66,.22),inset 0 1px 0 rgba(255,255,255,.75);
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-greta);
  color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;background:#e9eff5;min-height:100vh;
}
p, .sub, .auth-sub, .quote-text, .feature-text p, .form-desc, .hint, label, input, select, textarea, .card p, .modal-sub, .tbl-cell, .stat .lbl{
  font-family:var(--font-greta);
}
h1,h2,h3,.brand-t,.topbar .ttl,.stat .num{font-family:var(--font-display)}
button{font-family:var(--font-greta)}
body::before{
  content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(42% 34% at 82% 8%, rgba(14,116,144,.30), transparent 62%),
    radial-gradient(36% 30% at 8% 22%, rgba(124,58,237,.17), transparent 62%),
    radial-gradient(46% 40% at 55% 105%, rgba(37,99,235,.16), transparent 62%),
    radial-gradient(30% 26% at 30% 60%, rgba(8,145,178,.12), transparent 60%),
    linear-gradient(165deg,#f0f5fa 0%,#e6edf4 55%,#e9eff5 100%);
  filter:saturate(120%);
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(100,130,150,.35);border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(100,130,150,.55);border:2px solid transparent;background-clip:content-box}
.layout{display:flex;min-height:100vh;align-items:stretch}
.side{
  position:sticky;top:0;height:100vh;flex:0 0 236px;margin:14px;border-radius:20px;
  padding:16px 12px 12px;display:flex;flex-direction:column;gap:4px;
  background:linear-gradient(160deg,var(--glass-hi),var(--glass-lo));
  backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);
  border:1px solid var(--line);box-shadow:var(--shadow);
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.brand .logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;
  background:linear-gradient(135deg,#0e7490,#0891b2);color:#fff;box-shadow:0 8px 20px -6px rgba(14,116,144,.55)}
.brand-t{line-height:1.25;font-weight:800;font-size:13.5px}
.brand-t small{display:block;font-weight:600;color:var(--muted);font-size:10.5px}
.cmpsel{font-size:12.5px;font-weight:700}
.cmpchip{margin:0 6px 6px;padding:7px 10px;border-radius:10px;background:rgba(255,255,255,.5);
  border:1px solid var(--line);font-size:11.5px;font-weight:800;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidediv{height:1px;background:rgba(255,255,255,.6);margin:8px 6px;box-shadow:0 1px 0 rgba(2,44,66,.05)}
.slabel{font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);padding:6px 10px 2px}
.nbtn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:12px;
  border:1px solid transparent;background:none;color:#39505f;font-weight:700;font-size:13.5px;
  cursor:pointer;transition:.18s;text-align:start;white-space:nowrap}
.nbtn .ic{font-size:16px;width:22px;text-align:center;filter:saturate(.9)}
.nbtn:hover{background:rgba(255,255,255,.55);border-color:rgba(255,255,255,.7)}
.nbtn.active{background:linear-gradient(135deg,#0e7490,#0891b2);color:#fff;border-color:transparent;
  box-shadow:0 10px 22px -8px rgba(14,116,144,.55)}
.nbtn.active .ic{filter:none}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.ucard{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:13px;
  background:rgba(255,255,255,.55);border:1px solid var(--line)}
.ucard .av{width:34px;height:34px;border-radius:99px;display:grid;place-items:center;font-weight:800;color:#fff;
  background:linear-gradient(135deg,#155e75,#0e7490);flex:0 0 auto}
.ucard .nm{font-weight:800;font-size:12.5px;line-height:1.3}
.ucard .rl{color:var(--muted);font-size:11px;font-weight:600}
.sideacts{display:flex;gap:6px}
.sideacts button{flex:1}
.content{flex:1;min-width:0;display:flex;flex-direction:column;padding:14px 18px 26px}
.topbar{
  position:sticky;top:0;z-index:6;margin-bottom:14px;padding:10px 16px;border-radius:16px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  background:linear-gradient(160deg,var(--glass-hi),var(--glass-lo));
  backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--line);box-shadow:var(--shadow);
}
.topbar .ttl{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px}
.topbar .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:600}
.bell{position:relative;background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:11px;
  font-size:16px;cursor:pointer;padding:5px 9px;transition:.18s}
.bell:hover{background:#fff;transform:translateY(-1px)}
.bellb{position:absolute;top:-6px;inset-inline-end:-6px;background:var(--red);color:#fff;border-radius:99px;
  font-size:10px;padding:1px 5px;font-weight:800;box-shadow:0 4px 10px -2px rgba(220,38,38,.5)}
main{flex:1}
footer{text-align:center;color:#8aa0ae;font-size:11px;padding:16px 0 4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:12px;margin-bottom:16px}
.stat{border-radius:var(--r);padding:14px 14px 12px;transition:.2s;
  background:linear-gradient(160deg,var(--glass-hi),var(--glass-lo));
  backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  border:1px solid var(--line);box-shadow:var(--shadow)}
.stat:hover{transform:translateY(-2px);box-shadow:0 16px 38px -14px rgba(2,44,66,.28),inset 0 1px 0 rgba(255,255,255,.8)}
.stat .num{font-size:26px;font-weight:800;line-height:1.15;letter-spacing:-.5px}
.stat .lbl{font-size:11px;color:var(--muted);font-weight:700;margin-top:3px}
.stat.warn .num{color:var(--red)}.stat.ok .num{color:var(--green)}
.card{border-radius:var(--r);padding:16px;margin-bottom:14px;
  background:linear-gradient(160deg,var(--glass-hi),var(--glass-lo));
  backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  border:1px solid var(--line);box-shadow:var(--shadow)}
.card h2{font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:start;color:var(--muted);font-size:10.5px;padding:8px;border-bottom:1.5px solid rgba(2,44,66,.12);
  white-space:nowrap;text-transform:uppercase;letter-spacing:.5px}
td{padding:8px;border-bottom:1px solid rgba(2,44,66,.07);vertical-align:top}
tr:hover td{background:rgba(255,255,255,.45)}
.tbl-wrap{overflow-x:auto;border-radius:10px}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap;
  border:1px solid rgba(255,255,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.b-open{background:var(--bluebg);color:var(--blue)}.b-prog{background:var(--amberbg);color:var(--amber)}
.b-wait{background:var(--purplebg);color:var(--purple)}.b-done{background:var(--greenbg);color:var(--green)}
.b-urgent{background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;border-color:transparent;box-shadow:0 4px 12px -3px rgba(220,38,38,.5)}
.b-high{background:var(--redbg);color:var(--red)}
.b-normal{background:rgba(226,232,240,.8);color:var(--muted)}.b-low{background:var(--redbg);color:var(--red)}
.b-ok{background:var(--greenbg);color:var(--green)}.b-down{background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;border-color:transparent}
.b-maint{background:var(--amberbg);color:var(--amber)}
button.btn{padding:8px 15px;border:none;border-radius:11px;font-weight:700;font-size:13px;cursor:pointer;
  color:#fff;background:linear-gradient(135deg,#0e7490,#0891b2);
  box-shadow:0 8px 18px -6px rgba(14,116,144,.55);transition:.18s}
button.btn:hover{transform:translateY(-1px);box-shadow:0 12px 24px -6px rgba(14,116,144,.6);filter:brightness(1.05)}
button.btn:active{transform:translateY(0)}
button.btn.ghost{background:rgba(255,255,255,.6);color:var(--ink);border:1px solid var(--line);box-shadow:0 4px 12px -6px rgba(2,44,66,.15)}
button.btn.ghost:hover{background:#fff;border-color:rgba(14,116,144,.4);color:var(--brand)}
button.btn.danger{background:rgba(255,255,255,.6);color:var(--red);border:1px solid rgba(254,202,202,.9);box-shadow:none}
button.btn.danger:hover{background:var(--redbg)}
button.btn.sm{padding:3px 9px;font-size:12px;border-radius:9px}
input,select,textarea{padding:8px 11px;border:1px solid rgba(2,44,66,.14);border-radius:10px;font-size:14px;
  width:100%;font-family:inherit;color:var(--ink);
  background:rgba(255,255,255,.65);transition:.18s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);
  background:#fff;box-shadow:0 0 0 3px rgba(14,116,144,.15)}
input:disabled,select:disabled{opacity:.55;cursor:not-allowed}
input[type=checkbox]{width:auto;accent-color:#0e7490;transform:scale(1.15);cursor:pointer}
select option{background:#fff}
textarea{resize:vertical}
label{font-size:11px;font-weight:800;color:var(--muted);display:block;margin:9px 0 4px;letter-spacing:.3px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 12px}
.modal-bg{position:fixed;inset:0;background:rgba(10,30,45,.42);display:none;z-index:50;overflow-y:auto;
  padding:26px 12px;animation:fade .18s ease;backdrop-filter:blur(6px) saturate(120%);-webkit-backdrop-filter:blur(6px) saturate(120%)}
.modal{max-width:680px;margin:0 auto;border-radius:18px;padding:22px;animation:pop .2s cubic-bezier(.2,.9,.3,1.2);
  background:linear-gradient(160deg,rgba(255,255,255,.92),rgba(255,255,255,.78));
  backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);
  border:1px solid rgba(255,255,255,.8);box-shadow:0 30px 70px -20px rgba(2,44,66,.45)}
@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}}
@keyframes fade{from{opacity:0}}
.modal h3{margin-bottom:4px;font-size:16.5px}
.ma{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.searchbar{margin-bottom:10px;max-width:300px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.empty{color:var(--muted);text-align:center;padding:22px;font-style:italic}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(8px);z-index:99;
  background:rgba(19,36,48,.88);color:#fff;padding:11px 20px;border-radius:99px;font-size:13.5px;font-weight:700;
  opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;max-width:92vw;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.18);box-shadow:0 14px 34px -8px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:rgba(21,153,87,.92)}.toast.err{background:rgba(220,38,38,.92)}
.muted{color:var(--muted);font-size:12.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:5px 13px;border-radius:99px;border:1px solid var(--line);cursor:pointer;font-size:12.5px;
  font-weight:700;color:var(--muted);transition:.18s;
  background:rgba(255,255,255,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chip:hover{background:#fff;color:var(--brand)}
.chip.on{background:linear-gradient(135deg,#0e7490,#0891b2);color:#fff;border-color:transparent;
  box-shadow:0 6px 16px -5px rgba(14,116,144,.55)}
.chip.mini{padding:2px 9px;font-size:11.5px}
.alert-li{padding:7px 0;border-bottom:1px dashed rgba(2,44,66,.12);line-height:1.7}
.tl{list-style:none;margin:8px 0}
.tl li{padding:6px 0;border-bottom:1px dashed rgba(2,44,66,.12);font-size:13px}
.partrow{display:grid;grid-template-columns:1fr 90px 40px;gap:6px;margin-bottom:6px;align-items:center}
.itrow{display:grid;grid-template-columns:1fr 130px 70px 90px 36px;gap:6px;margin-bottom:6px;align-items:center}
.certrow{display:grid;grid-template-columns:1fr 150px 36px;gap:6px;margin-bottom:6px;align-items:center}
.taskrow{display:grid;grid-template-columns:auto 1fr 130px 130px 36px;gap:8px;align-items:center;padding:7px;
  border:1px solid var(--line);border-radius:11px;margin-bottom:6px;background:rgba(255,255,255,.45)}
.ckrow{display:grid;grid-template-columns:auto 1fr 150px;gap:8px;align-items:center;padding:7px;
  border:1px solid var(--line);border-radius:11px;margin-bottom:6px;background:rgba(255,255,255,.45)}
.overdue td{background:rgba(254,226,226,.55)!important}
.bar{height:9px;border-radius:5px;min-width:2px;transition:width .35s;
  background:linear-gradient(90deg,#0e7490,#0891b2);box-shadow:0 2px 8px -2px rgba(14,116,144,.5)}
.bar.red{background:linear-gradient(90deg,#dc2626,#ef4444);box-shadow:0 2px 8px -2px rgba(220,38,38,.5)}
.bar.grn{background:linear-gradient(90deg,#159957,#22c55e);box-shadow:0 2px 8px -2px rgba(21,153,87,.5)}
.qline{font-size:12px;color:var(--muted);margin-top:3px}
.dayhdr{font-weight:800;font-size:13px;margin:12px 0 6px;color:var(--brand)}
.dash-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.dg-12{grid-column:span 12}.dg-8{grid-column:span 8}.dg-7{grid-column:span 7}
.dg-6{grid-column:span 6}.dg-5{grid-column:span 5}.dg-4{grid-column:span 4}
@media(max-width:1080px){.dg-8,.dg-7,.dg-6,.dg-5,.dg-4{grid-column:span 12}}
.kpi{cursor:pointer}
.kpi .khead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2px}
.kpi .kico{font-size:19px;opacity:.9}
.trend{font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;white-space:nowrap}
.trend.up{background:var(--greenbg);color:var(--green)}
.trend.down{background:var(--redbg);color:var(--red)}
.trend.flat{background:rgba(226,232,240,.8);color:var(--muted)}
.donut-wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}
.legend{display:flex;flex-direction:column;gap:4px;min-width:150px;flex:1}
.legend .li{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;cursor:pointer;
  padding:4px 9px;border-radius:9px;transition:.15s;justify-content:space-between}
.legend .li:hover{background:rgba(255,255,255,.65)}
.legend .li b{font-size:13.5px}
.legend .lft{display:flex;align-items:center;gap:8px}
.legend .dot{width:10px;height:10px;border-radius:99px;box-shadow:0 0 0 2px rgba(255,255,255,.6)}
.hbar-row{display:grid;grid-template-columns:118px 1fr 64px;gap:8px;align-items:center;margin-bottom:9px;
  font-size:12.5px;font-weight:700}
.hbar-row.click{cursor:pointer}
.mini-bar{border-radius:8px;color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;
  padding-inline:7px;height:100%;min-width:2px;transition:width .5s;white-space:nowrap}
.pdot{display:inline-block;width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.pmrow{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:11px;
  background:rgba(255,255,255,.5);border:1px solid var(--line);margin-bottom:7px}
.pmrow.overdue{background:var(--redbg);border-color:rgba(254,202,202,.9)}
.alrow{cursor:pointer;border-radius:9px;padding:7px 8px;transition:.13s}
.alrow:hover{background:rgba(255,255,255,.6)}
.qa{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.mchart{display:flex;gap:10px;align-items:flex-end;height:172px}
.mcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;cursor:pointer}
.mcol:hover .mbar{filter:brightness(1.12);transform:translateY(-2px)}
.mbar{width:70%;max-width:44px;display:flex;flex-direction:column;border-radius:9px;overflow:hidden;
  box-shadow:0 4px 10px -4px rgba(2,44,66,.35);transition:.2s}
.mval{font-size:10.5px;font-weight:800;color:var(--ink)}
.mx{font-size:10px;font-weight:700;color:var(--muted)}
.pgrid{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;margin:6px 0}
.phwrap{position:relative;display:inline-block}
.pthumb{width:88px;height:88px;object-fit:cover;border-radius:11px;border:1px solid var(--line);
  cursor:zoom-in;box-shadow:0 4px 12px -4px rgba(2,44,66,.25);transition:.15s;background:#fff}
.pthumb:hover{transform:translateY(-2px);box-shadow:0 8px 18px -6px rgba(2,44,66,.35)}
.phdel{position:absolute;top:-7px;inset-inline-end:-7px;width:22px;height:22px;border-radius:99px;border:none;
  background:var(--red);color:#fff;font-size:11px;font-weight:800;cursor:pointer;box-shadow:0 4px 10px -2px rgba(220,38,38,.5)}
.phtag{position:absolute;bottom:4px;inset-inline-start:4px;background:rgba(19,36,48,.75);color:#fff;
  font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:99px}
.sigbox{width:100%;max-width:560px;height:150px;border:1.5px dashed rgba(2,44,66,.3);border-radius:12px;
  background:rgba(255,255,255,.85);touch-action:none;cursor:crosshair;display:block}
.sigimg{max-width:280px;background:#fff;border:1px solid var(--line);border-radius:11px;
  box-shadow:0 4px 12px -4px rgba(2,44,66,.2)}
/* ===== MODERN SPLIT-SCREEN AUTH STYLES ===== */
.auth-wrapper{min-height:100vh;display:flex;background:#f1f5f9;position:relative;overflow-x:hidden}
.auth-form-side{
  flex:1 1 48%;display:flex;align-items:center;justify-content:center;
  padding:36px 24px;
  background:radial-gradient(circle at 10% 20%,rgba(14,116,144,.07) 0%,transparent 60%),
             radial-gradient(circle at 90% 80%,rgba(8,145,178,.06) 0%,transparent 60%),
             #f8fafc;
  position:relative;z-index:2;
}
.auth-card{
  width:100%;max-width:440px;background:#ffffff;border-radius:26px;
  padding:38px 32px 30px;
  box-shadow:0 22px 50px -12px rgba(15,23,42,.1),0 1px 3px 0 rgba(0,0,0,.04),0 0 0 1px rgba(226,232,240,.8);
  animation:authPop .35s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column;
}
@keyframes authPop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.auth-header{text-align:center;margin-bottom:20px}
.auth-title{font-family:var(--font-display);font-size:25px;font-weight:800;color:#0f172a;margin-bottom:6px;letter-spacing:-.3px}
.auth-sub{font-size:13px;color:#64748b;font-weight:400;line-height:1.5}
.btn-google{
  width:100%;display:flex;align-items:center;justify-content:center;gap:12px;
  padding:10px 16px;background:#ffffff;border:1.5px solid #e2e8f0;border-radius:13px;
  color:#1e293b;font-size:13.5px;font-weight:600;font-family:var(--font-greta);
  cursor:pointer;transition:all .18s ease;box-shadow:0 1px 3px rgba(0,0,0,.03);
}
.btn-google:hover{background:#f8fafc;border-color:#cbd5e1;transform:translateY(-1px);box-shadow:0 4px 12px -2px rgba(15,23,42,.08)}
.btn-google:active{transform:translateY(0)}
.auth-divider{display:flex;align-items:center;margin:18px 0;color:#94a3b8;font-size:12px;font-weight:600}
.auth-divider::before,.auth-divider::after{content:"";flex:1;height:1px;background:#e2e8f0}
.auth-divider span{padding:0 14px;font-family:var(--font-greta)}
.auth-form{display:flex;flex-direction:column;gap:14px}
.form-group{display:flex;flex-direction:column;gap:6px}
.label-row{display:flex;justify-content:space-between;align-items:center}
.form-group label{font-size:12px;font-weight:600;color:#334155;margin:0}
.forgot-link{font-size:11.5px;color:#0e7490;text-decoration:none;font-weight:600;transition:color .15s}
.forgot-link:hover{color:#0891b2;text-decoration:underline}
.input-icon-wrap{position:relative;display:flex;align-items:center}
.input-icon-wrap input{
  width:100%;padding:10px 38px 10px 14px;background:#ffffff;
  border:1.5px solid #cbd5e1;border-radius:12px;font-size:13.5px;color:#0f172a;
  transition:all .18s ease;font-family:var(--font-greta);font-weight:500;
}
html[dir="ltr"] .input-icon-wrap input{padding:10px 14px 10px 38px}
.input-icon-wrap input:focus{border-color:#0e7490;box-shadow:0 0 0 3.5px rgba(14,116,144,.15);background:#fff}
.input-icon-wrap .input-icon{
  position:absolute;inset-inline-end:12px;display:flex;align-items:center;
  color:#94a3b8;pointer-events:none;
}
.password-wrap input{padding-inline-start:54px}
.btn-toggle-pw{
  position:absolute;inset-inline-start:8px;background:none;border:none;
  color:#0e7490;font-size:11.5px;font-weight:700;font-family:var(--font-greta);
  cursor:pointer;padding:4px 6px;border-radius:6px;transition:background .15s;
}
.btn-toggle-pw:hover{background:rgba(14,116,144,.08)}
.btn-login{
  width:100%;margin-top:6px;padding:11px 18px;border:none;border-radius:13px;

.demo-accounts{margin-top:16px;padding:10px 12px;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:13px}

}

.auth-card-footer{text-align:center;margin-top:14px;font-size:12.5px;color:#64748b;font-family:var(--font-greta)}

/* Right Side - Hero & Branding */

.hero-content{position:relative;z-index:2;max-width:500px;display:flex;flex-direction:column;gap:20px}

.hero-headline{

}
.hero-quote-card{
  position:relative;background:rgba(255,255,255,.12);backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.22);
  border-radius:16px;padding:16px 20px;box-shadow:0 12px 30px -10px rgba(0,0,0,.15);
}
.quote-mark{
  position:absolute;top:-6px;inset-inline-start:12px;font-size:30px;font-family:Georgia,serif;
  color:rgba(255,255,255,.35);line-height:1;pointer-events:none;
}
.quote-text{font-family:var(--font-greta);font-size:13.5px;font-weight:500;line-height:1.75;color:rgba(255,255,255,.95);margin:0}
.hero-features{display:flex;flex-direction:column;gap:12px}
.feature-item{
  display:flex;align-items:flex-start;gap:12px;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:11px 14px;

.feature-icon{

}
.feature-text{display:flex;flex-direction:column;gap:2px}

.hero-trust-footer{margin-top:4px}
.trust-badge{
  display:inline-flex;align-items:center;gap:8px;padding:6px 14px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);

@media (max-width:960px){
  .auth-wrapper{flex-direction:column-reverse}
  .auth-form-side{padding:24px 16px 40px}
  .auth-hero-side{padding:32px 18px}
  .hero-headline{font-size:23px}
}
.cmpgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
@media(max-width:600px){.cmpgrid{grid-template-columns:1fr}}
.cmpcard{border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:.18s;
  background:rgba(255,255,255,.6);text-align:start}
.cmpcard:hover{transform:translateY(-2px);background:#fff;box-shadow:0 12px 26px -10px rgba(14,116,144,.4);border-color:rgba(14,116,144,.4)}
.cmpcard .cc-t{font-weight:800;font-size:14px;margin-bottom:2px}
.cmpcard .cc-s{display:flex;gap:12px;margin:8px 0;font-size:12px;font-weight:700;color:var(--muted)}
.cmpcard .cc-go{font-size:12px;font-weight:800;color:var(--brand)}
.property-picker{width:min(920px,calc(100vw - 32px))!important}
.property-actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 14px}
.property-actions .btn{min-height:42px}
.property-actions .property-action{flex:1 1 220px}
.property-section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 10px;font-size:14px;font-weight:800}
@media(max-width:600px){.property-actions{flex-direction:column}.property-actions .property-action{width:100%}}
.vfade{animation:vfade .22s ease}
@keyframes vfade{from{opacity:0;transform:translateY(6px)}}
:focus-visible{outline:2.5px solid #0891b2;outline-offset:2px;border-radius:6px}
.nbtn:active{transform:scale(.97)}
.chip:active{transform:scale(.95)}

  .brand-t,.sidediv,.slabel,.nbtn .nt,.ucard .uinfo{display:none}
  .nbtn{justify-content:center;padding:10px}
  .ucard{justify-content:center;padding:6px}
  .sideacts{flex-direction:column}
}
@media print{
  body::before,.side,.topbar,.btn,.toolbar,.searchbar,.chips,.qa,footer,.sideacts{display:none!important}
  body{background:#fff}
  .card,.stat{background:#fff!important;backdrop-filter:none!important;box-shadow:none!important;border:1px solid #ddd;break-inside:avoid}
  .printhead{display:block!important;text-align:center;font-weight:800;font-size:15px;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid #333}
}
.printhead{display:none}

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ===== SERVER API (WEB EDITION) ===== */
/* Production: same-origin /api on any hosted domain. Local file:// falls back to localhost. */
const API_BASE = (window.location.protocol === 'file:') ? 'http://localhost:3000/api' : '/api';
let AUTH={token:'',ver:0};
async function api(pathname,opts){
  const r=await fetch(API_BASE+pathname,Object.assign(
    {headers:Object.assign({'Content-Type':'application/json'},AUTH.token?{'Authorization':'Bearer '+AUTH.token}:{})},
    opts||{}));
  return r;
}

let db=null,me=null,TAB='dash',PICK=false;
let FILT={assets:'',wos:'',inv:'',woStatus:'all',procTab:'pr',units:''};
let PRIO,WSTAT,ASTAT,ROLES,VILLA_FLOORS,PRSTAT,POSTAT,FREQUNIT,PRJSTAT,SHIFTK,BTYPES,UNITKIND,CTRSC,CYCLEK;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Math.random().toString(36).slice(2,7)+Date.now().toString(36).slice(-3);
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};

function lb(s){const p=s.split('||');return (!db||db.lang==='ar')?p[0]:(p[1]||p[0]);}
function fmtD(iso){if(!iso)return '—';try{return new Date(iso+'T00:00:00').toLocaleDateString(db.lang==='ar'?'ar-EG-u-ca-gregory':'en-GB',{day:'numeric',month:'short',year:'numeric'})}catch(e){return iso}}
function fmtDT(ms){if(!ms)return '—';try{return new Date(ms).toLocaleString(db.lang==='ar'?'ar-EG-u-ca-gregory':'en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
function money(n){n=Number(n||0);return n.toLocaleString(undefined,{maximumFractionDigits:2})+' '+lb('ر.س||SAR');}
function toast(m,t){const el=$('toast');el.textContent=m;el.className='toast show'+(t?' '+t:'');setTimeout(()=>el.classList.remove('show'),2600);}
function daysUntil(iso){if(!iso)return 9999;return Math.round((new Date(iso)-new Date(todayISO()))/86400000);}
function addDays(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

/* ===== WHATSAPP ===== */
function normPhone(p){let d=String(p||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('0'))d='966'+d.slice(1);return d;}
function woMsg(w){
  const L=db.lang==='ar';
  const cmp=db.compounds.find(c=>c.id===w.compoundId)||{};
  return (L?'🔧 *بلاغ صيانة جديد*\n':'🔧 *New Maintenance Report*\n')
   +(L?'الرقم: ':'No.: ')+w.no+'\n'
   +(L?'المجمع: ':'Compound: ')+(cmp.name||'—')+'\n'
   +(L?'الموقع: ':'Location: ')+(w.bname||'—')+'\n'
   +(w.assetName?((L?'الأصل: ':'Asset: ')+w.assetName+'\n'):'')
   +(L?'العطل: ':'Issue: ')+w.title+'\n'
   +(L?'الأولوية: ':'Priority: ')+(PRIO[w.priority]||w.priority)+'\n'
   +(L?'موعد الاستحقاق: ':'Due: ')+fmtD(w.dueDate)+'\n'
   +(L?'الرجاء التوجه لتنفيذ البلاغ في أقرب وقت. شكراً.':'Please attend to this report at your earliest convenience. Thank you.');
}
function openWhatsApp(w){
  const u=db.users.find(x=>x.id===w.assigneeId);
  const ph=normPhone(u&&u.phone);
  if(!ph||ph.length<10){toast(lb('⚠ لا يوجد رقم جوال صحيح للفني — أضفه من شاشة المستخدمين||⚠ No valid mobile for the technician — add it in Users'),'err');return;}
  const url='https://wa.me/'+ph+'?text='+encodeURIComponent(woMsg(w));
  window.open(url,'_blank');
  toast(lb('✔ فُتح واتساب — الرسالة جاهزة، اضغط إرسال||✔ WhatsApp opened — message ready, press send'),'ok');
}
function waBtn(i){const w=db.wos[i];
  if(!w.assigneeId)return toast(lb('⚠ أسند البلاغ لفني أولاً||⚠ Assign a technician first'),'err');
  openWhatsApp(w);}

/* ===== PHOTOS & SIGNATURE ===== */
const PH={};let _phSeq=0;
function phReg(d){const k='K'+(++_phSeq);PH[k]=d;return k;}
function lbShow(k){if(!PH[k])return;
  modal(`<img src="${PH[k]}" style="width:100%;max-height:78vh;object-fit:contain;border-radius:12px;background:#fff">`);}
function compressImg(file){return new Promise(res=>{
  const r=new FileReader();
  r.onload=e=>{const img=new Image();
    img.onload=()=>{const max=1000;let w=img.width,h=img.height;
      if(w>max||h>max){const k=Math.min(max/w,max/h);w=Math.round(w*k);h=Math.round(h*k);}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      res(cv.toDataURL('image/jpeg',0.72));};
    img.onerror=()=>res(null);
    img.src=e.target.result;};
  r.readAsDataURL(file);});}
function pickImages(cb){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.multiple=true;
  inp.onchange=async()=>{const out=[];toast(lb('⏳ جارٍ معالجة الصور…||⏳ Processing photos…'));
    for(const f of inp.files){const d=await compressImg(f);if(d)out.push({d,n:''});}
    if(out.length)cb(out);};
  inp.click();}
function demoImg(txt,c1,c2){const cv=document.createElement('canvas');cv.width=640;cv.height=420;
  const g=cv.getContext('2d');const gr=g.createLinearGradient(0,0,640,420);
  gr.addColorStop(0,c1);gr.addColorStop(1,c2);g.fillStyle=gr;g.fillRect(0,0,640,420);
  g.fillStyle='rgba(255,255,255,.93)';g.font='bold 32px Segoe UI';g.textAlign='center';
  g.fillText(txt,320,218);return cv.toDataURL('image/jpeg',.8);}
function initSig(){
  const cv=$('sigpad');if(!cv||cv._init||typeof cv.getContext!=='function')return;cv._init=true;
  const ctx=cv.getContext('2d');ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#132430';
  let dr=false;
  const pos=e=>{const r=cv.getBoundingClientRect();
    return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height];};
  cv.addEventListener('pointerdown',e=>{dr=true;const p=pos(e);
    ctx.beginPath();ctx.moveTo(p[0],p[1]);
    if(cv.setPointerCapture)try{cv.setPointerCapture(e.pointerId);}catch(x){}e.preventDefault();});
  cv.addEventListener('pointermove',e=>{if(!dr)return;const p=pos(e);ctx.lineTo(p[0],p[1]);ctx.stroke();});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>cv.addEventListener(ev,()=>{dr=false;}));}
function sigClear(){const cv=$('sigpad');if(cv&&typeof cv.getContext==='function')cv.getContext('2d').clearRect(0,0,cv.width,cv.height);}
function sigHasInk(){const cv=$('sigpad');if(!cv)return false;
  try{const d=cv.getContext('2d').getImageData(0,0,cv.width,cv.height).data;
    for(let i=3;i<d.length;i+=4)if(d[i]>0)return true;}catch(e){}
  return false;}
function phTmpHTML(arr,key){return arr.map((p,i)=>
  `<span class="phwrap"><img class="pthumb" src="${p.d}" onclick="lbShow('${phReg(p.d)}')">
  <button type="button" class="phdel" onclick="phTmpDel('${key}',${i})">✕</button></span>`).join('')
  ||`<span class="muted">${lb('لا صور بعد||No photos yet')}</span>`;}
function phTmpDel(key,i){const arr=key==='b'?window._woPhB:key==='a'?window._woPhA:window._faPh;
  if(arr){arr.splice(i,1);}
  if(key==='b'||key==='a')renderWoPhGrids();else renderFaPhotos();}
function renderWoPhGrids(){
  if($('wpg_b'))$('wpg_b').innerHTML=phTmpHTML(window._woPhB,'b');
  if($('wpg_a'))$('wpg_a').innerHTML=phTmpHTML(window._woPhA,'a');}
function woAddPhotos(tag){pickImages(imgs=>{
  (tag==='b'?window._woPhB:window._woPhA).push(...imgs);renderWoPhGrids();});}
function renderFaPhotos(){if($('fa_photos'))$('fa_photos').innerHTML=phTmpHTML(window._faPh,'f');}
function faAddPhotos(){pickImages(imgs=>{window._faPh.push(...imgs);renderFaPhotos();});}

function initLangMaps(){
  PRIO={urgent:lb('طارئ||Urgent'),high:lb('عاجل||High'),normal:lb('عادي||Normal')};
  WSTAT={open:[lb('مفتوح||Open'),'b-open'],inprog:[lb('قيد التنفيذ||In Progress'),'b-prog'],
    wait:[lb('بانتظار قطعة غيار||Waiting Parts'),'b-wait'],closed:[lb('مغلق||Closed'),'b-done']};
  ASTAT={ok:[lb('يعمل||Operational'),'b-ok'],down:[lb('متوقف||Down'),'b-down'],maint:[lb('تحت الصيانة||Under Maintenance'),'b-maint']};
  ROLES={admin:lb('مدير النظام||System Admin'),engineer:lb('مهندس / مدير عمليات||Engineer'),

/* ===== PERSIST (HYBRID: LOCAL + SERVER) ===== */
function persist(){
  try{if(db)localStorage.setItem('cmms_data',JSON.stringify(db));}catch(e){}
  clearTimeout(persist._t);persist._t=setTimeout(async()=>{
    try{
      const r=await api('/state',{method:'POST',body:JSON.stringify({baseVer:AUTH.ver,data:db})});
      if(r.status===409){
        const s=await(await api('/state')).json();
        AUTH.ver=s.ver;db=s.data;
        try{localStorage.setItem('cmms_data',JSON.stringify(db));}catch(e){}
        toast(lb('⚠ حدّث مستخدم آخر البيانات — حُمّلت النسخة الأحدث||⚠ Data updated by another user — latest loaded'),'err');
        render();return;
      }
      const j=await r.json();AUTH.ver=j.ver;
    }catch(e){}
  },400);
}

function migrate(d){
  if(!d.ver||d.ver<2){
    d.ver=2;
    ['pms','suppliers','prs','pos'].forEach(k=>{if(!d[k])d[k]=[];});
    if(d.prSeq==null)d.prSeq=0;if(d.poSeq==null)d.poSeq=0;if(d.rnSeq==null)d.rnSeq=0;
    d.users.forEach(u=>{if(u.role==='manager'){u.role=(u.u==='admin')?'admin':'engineer';}});
    [['eng','مهندس العمليات','engineer'],['sitemgr','مدير الموقع','sitemgr'],
     ['store','مسؤول المخزون','store'],['proc','مسؤول المشتريات','proc']]
     .forEach(a=>{if(!d.users.some(x=>x.u===a[0]))d.users.push({id:uid('U'),u:a[0],p:'1234',name:a[1],role:a[2]});});
  }
  if(d.ver<3){
    d.ver=3;
    ['projects','employees','shifts','notifs'].forEach(k=>{if(!d[k])d[k]=[];});
    if(d.prjSeq==null)d.prjSeq=0;
    d.wos.forEach(w=>{if(w.projectId==null)w.projectId='';});
    d.pos.forEach(po=>{if(po.projectId==null)po.projectId='';});
  }
  if(d.ver<4){
    d.ver=4;
    ['units','tenants','contracts'].forEach(k=>{if(!d[k])d[k]=[];});
    if(d.ctSeq==null)d.ctSeq=0;
    d.buildings.forEach(b=>{if(!b.type)b.type='villa';});
    d.wos.forEach(w=>{if(w.unitId==null)w.unitId='';if(w.unitCode==null)w.unitCode='';if(w.tenantName==null)w.tenantName='';});
  }
  if(d.ver<5){
    d.ver=5;
    d.assets.forEach(a=>{if(!a.photos)a.photos=[];});
    d.wos.forEach(w=>{if(!w.photos)w.photos=[];if(w.sig==null)w.sig='';});
  }
  if(d.ver<6){
    d.ver=6;
    if(!d.compounds)d.compounds=[];
    if(!d.compounds.length)
      d.compounds.push({id:uid('C'),name:'مجمع الخير السكني - حي الروضة',loc:'',notes:'',createdAt:Date.now()});
    const def=d.compounds[0].id;
    d.buildings.forEach(b=>{if(!b.compoundId)b.compoundId=def;});
    d.assets.forEach(a=>{if(!a.compoundId){
      const b=d.buildings.find(x=>x.id===a.building);
      a.compoundId=b?b.compoundId:def;}});
    d.wos.forEach(w=>{if(!w.compoundId){
      const a=d.assets.find(x=>x.id===w.assetId);
      const b=a?d.buildings.find(x=>x.id===a.building):null;
      w.compoundId=b?b.compoundId:def;}});
    d.pms.forEach(p=>{if(!p.compoundId){
      const a=d.assets.find(x=>x.id===p.assetId);
      p.compoundId=a?a.compoundId:def;}});
    d.projects.forEach(p=>{if(!p.compoundId)p.compoundId=def;});
    d.contracts.forEach(c=>{if(!c.compoundId)c.compoundId=def;});
    d.employees.forEach(e=>{if(!e.compoundId)e.compoundId=def;});
    d.users.forEach(u=>{
      if(u.phone==null)u.phone='';
      if(!u.cmpIds)u.cmpIds=(u.role==='admin')?[]:[def];
      if(u.activeCmp==null)u.activeCmp='';
    });
  }
  /* ---- شبكة أمان تُنفَّذ دائماً (حتى مع ver=6) لضمان بيانات قابلة للاستخدام ---- */
  ['compounds','buildings','units','tenants','contracts','assets','wos','inv','moves','pms',
   'suppliers','prs','pos','projects','employees','shifts','notifs']
   .forEach(k=>{if(!Array.isArray(d[k]))d[k]=[];});
  ['seq','prSeq','poSeq','rnSeq','prjSeq','ctSeq'].forEach(k=>{if(d[k]==null)d[k]=0;});
  if(typeof d.lang!=='string')d.lang='ar';
  if(!d.compounds.length)
    d.compounds.push({id:uid('C'),name:'مجمع الخير السكني - حي الروضة',loc:'',notes:'',createdAt:Date.now()});
  const defC=d.compounds[0].id;
  d.users.forEach(u=>{
    if(u.phone==null)u.phone='';
    if(u.email==null)u.email='';
    if(!Array.isArray(u.cmpIds))u.cmpIds=(u.role==='admin')?[]:[defC];
    if(u.role!=='admin'&&!u.cmpIds.some(x=>d.compounds.some(c=>c.id===x)))
      u.cmpIds=d.compounds.map(c=>c.id);
    if(u.activeCmp==null)u.activeCmp='';
  });
  return d;
}

/* ===== BOOT (SERVER) ===== */
async function boot(){
  try{
    try{const saved=JSON.parse(localStorage.getItem('cmms_auth')||'null');
      if(saved&&saved.token)AUTH.token=saved.token;}catch(e){}
    const r=await api('/state');
    if(r.status===401){AUTH.token='';try{localStorage.removeItem('cmms_auth');}catch(e){}
      db=freshDb();db=migrate(db);return;}
    const j=await r.json();
    if(j.data){db=j.data;AUTH.ver=j.ver;db=migrate(db);
      try{const saved=JSON.parse(localStorage.getItem('cmms_auth')||'null');
        if(saved&&saved.userId){me=db.users.find(x=>x.id===saved.userId)||null;
          if(me){const L=myCmps();
            if(!L.length)me=null;
            else if(!me.activeCmp||!L.some(c=>c.id===me.activeCmp))me.activeCmp=L[0].id;}}}catch(e){}
    } else {db=freshDb();db=migrate(db);}
  }catch(e){db=freshDb();db=migrate(db);}
}

function notify(icon,text,tab,key){
  if(key&&db.notifs.some(n=>n.key===key&&!n.read))return;
  db.notifs.unshift({id:uid('N'),icon,text,tab:tab||'dash',key:key||'',at:Date.now(),read:false});
  if(db.notifs.length>200)db.notifs.length=200;
}
async function doLogin(e){
  e.preventDefault();
  const rawU = ($('lu').value||'').trim();
  const u = rawU.includes('@') ? rawU.split('@')[0].toLowerCase() : rawU.toLowerCase();
  const p = $('lp').value;
  let serverOk = false;

  try{
    const r = await fetch(API_BASE + '/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ u: rawU, p })
    });
    if(r.ok){
      const j = await r.json();
      AUTH.token = j.token; AUTH.ver = j.ver;
      const s = await(await api('/state')).json();
      db = s.data; AUTH.ver = s.ver; db = migrate(db);
      me = db.users.find(x => x.id === j.userId) || null;
      serverOk = true;
    } else if(r.status === 401){
      return toast(lb('⚠ اسم المستخدم أو كلمة المرور غير صحيحة||⚠ Wrong username or password'), 'err');
    }
  }catch(netErr){
    console.warn('Backend server not reachable, using local database mode.');
  }

    if(!serverOk){
    if(!db){ db = loadLocalDb(); db = migrate(db); }
    const rl = rawU.toLowerCase();
    const localUser = (db.users || []).find(x => (String(x.u||'').toLowerCase() === rl || String(x.u||'').toLowerCase() === u || (x.email && String(x.email).toLowerCase() === rl)) && String(x.p) === String(p));
    if(!localUser){
      return toast(lb('⚠ اسم المستخدم أو كلمة المرور غير صحيحة||⚠ Wrong username or password'), 'err');
    }
    me = localUser;
    AUTH.token = 'local_session_' + Date.now();
  }

  if(!me){ AUTH.token = ''; return toast(lb('⚠ حساب غير موجود||⚠ Account not found'), 'err'); }
  TAB = 'dash'; FILT = { assets: '', wos: '', inv: '', woStatus: 'all', procTab: 'pr', units: '' };
  const L = myCmps();
  if(!L.length){
    toast(lb('⚠ لا توجد مجمعات مسندة لحسابك — راجع مدير النظام||⚠ No compounds assigned — contact admin'), 'err');
    me = null; AUTH.token = ''; return;
  }
  /* ابدأ دائماً من شاشة العقارات، حتى لو كان للمستخدم عقار واحد فقط. */
  if(!me.activeCmp || !L.some(c=>c.id===me.activeCmp)) me.activeCmp = L[0].id;
  PICK = true;
  try{ localStorage.setItem('cmms_auth', JSON.stringify({ token: AUTH.token, userId: me.id })); }catch(e){}
  persist(); pmGen(); genSysNotifs(); render();
}
function genSysNotifs(){
  const act=activeCmp();
  db.wos.filter(w=>w.status!=='closed'&&w.priority==='urgent'&&w.compoundId===act&&(isTech()?w.assigneeId===me.id:true))
    .forEach(w=>notify('🔴',lb('طارئ مفتوح: ||Open urgent: ')+w.title,'wos','urg-'+w.no));
  db.pms.filter(p=>p.compoundId===act).forEach(p=>{
    const d=daysUntil(nextDueOf(p));
    if(d<=0)notify('🗓',lb('صيانة دورية متأخرة: ||Overdue PM: ')+p.name,'pm','pm-'+p.id+'-late');
    else if(d<=3)notify('🗓',lb('صيانة قريبة: ||PM soon: ')+p.name+' ('+fmtD(nextDueOf(p))+')','pm','pm-'+p.id+'-soon');
  });
  db.inv.filter(it=>it.qty<=it.minQty).forEach(it=>
    notify('📦',lb('مخزون تحت الحد: ||Low stock: ')+it.name+' ('+it.qty+' '+it.unit+')','inv','low-'+it.id));
  if(canAppr())db.prs.filter(pr=>pr.status==='pending').forEach(pr=>
    notify('🛒',lb('طلب شراء بانتظار الموافقة: ||PR awaiting approval: ')+pr.title+' ('+pr.no+')','proc','pr-'+pr.no));
  if(canAppr()){
    db.contracts.filter(c=>c.compoundId===act).forEach(c=>{const dd=daysUntil(c.end);
      if(dd<=30)notify('📜',(dd<0?lb('عقد منتهٍ: ||Expired contract: '):lb('عقد ينتهي قريباً: ||Contract expiring: '))+c.vendor+' ('+fmtD(c.end)+')','contracts','ctre-'+c.id+'-'+c.end);});
    db.tenants.forEach(x=>{const u=db.units.find(y=>y.id===x.unitId);
      const b=u?db.buildings.find(y=>y.id===u.buildingId):null;
      if(!b||b.compoundId!==act)return;
      const dd=daysUntil(x.leaseEnd);
      if(dd<=45)notify('🔑',(dd<0?lb('عقد إيجار منتهٍ: ||Expired lease: '):lb('إيجار ينتهي قريباً: ||Lease expiring: '))+x.name+' ('+fmtD(x.leaseEnd)+')','units','lea-'+x.id+'-'+x.leaseEnd);});
  }
  persist();
}

      <div class="sidefoot">
        <div class="ucard"><span class="av">${esc(initials)}</span>

function paintTab(){
  const v=$('view');
  if(TAB==='dash')v.innerHTML=vDash();
  else if(TAB==='cmps')v.innerHTML=vCmps();
  else if(TAB==='assets'){v.innerHTML=vAssets();drawAssetsTable();}
  else if(TAB==='wos')v.innerHTML=vWOs();
  else if(TAB==='pm')v.innerHTML=vPM();
  else if(TAB==='proj')v.innerHTML=vProj();
  else if(TAB==='units')v.innerHTML=vUnits();
  else if(TAB==='contracts')v.innerHTML=vContracts();
  else if(TAB==='hr')v.innerHTML=vHr();
  else if(TAB==='inv')v.innerHTML=vInv();
  else if(TAB==='proc'){v.innerHTML=vProc();paintProc();}
  else if(TAB==='rep')v.innerHTML=vRep();
  else if(TAB==='users')v.innerHTML=vUsers();
  v.classList.remove('vfade');void v.offsetWidth;v.classList.add('vfade');
}

function cmpForm(i,kind){
  const c=i!=null?db.compounds[i]:{};
  const isResidential=kind==='residentialBuilding';
  const newTitle=isResidential?lb('إضافة مبنى سكني||Add residential building'):lb('إضافة عقار||Add property');
  const nameLabel=isResidential?lb('اسم المبنى السكني *||Residential building name *'):lb('اسم العقار *||Property name *');
  const nameHint=isResidential?lb('مثال: عمارة النخيل السكنية||e.g. Al-Nakheel Residential Building'):lb('مثال: مجمع الخير السكني - حي الروضة||e.g. Al-Khair Property');
  modal(`<h3>${i!=null?lb('تعديل العقار||Edit property'):newTitle}</h3>
  <label>${i!=null?lb('اسم العقار *||Property name *'):nameLabel}</label><input id="fcpx_n" value="${esc(c.name||'')}" placeholder="${nameHint}">
  <div class="fg"><div><label>${lb('الموقع / الحي||Location / District')}</label><input id="fcpx_l" value="${esc(c.loc||'')}"></div></div>
  <label>${lb('ملاحظات||Notes')}</label><textarea id="fcpx_no" rows="2">${esc(c.notes||'')}</textarea>
  <div class="ma"><button class="btn ghost" onclick="closeModal()">${lb('إلغاء||Cancel')}</button>
  <button class="btn" onclick="saveCmp(${i??'null'},'${kind||''}')">${lb('حفظ||Save')}</button></div>`);
}
function saveCmp(iStr,kind){
  const isNew=(iStr==null||iStr==='null'||iStr==='');
  const n=$('fcpx_n').value.trim();if(!n)return toast(lb('⚠ الاسم مطلوب||⚠ Name required'),'err');
  const o={name:n,loc:$('fcpx_l').value.trim(),notes:$('fcpx_no').value.trim()};
  if(isNew){const c=Object.assign({id:uid('C'),createdAt:Date.now(),kind:kind||'property'},o);db.compounds.push(c);
    if(me.role!=='admin'){me.cmpIds=[...(me.cmpIds||[]),c.id];}
    me.activeCmp=c.id;}
  else Object.assign(db.compounds[iStr],o);
  persist();closeModal();paintTab();toast(lb('✔ تم حفظ المجمع||✔ Compound saved'),'ok');
}
function delCmp(i){const c=db.compounds[i];
  if(db.compounds.length<=1)return toast(lb('⚠ لا يمكن حذف آخر مجمع — أنشئ مجمعاً جديداً أولاً||⚠ Cannot delete the last compound — create another first'),'err');
  const used=db.buildings.some(b=>b.compoundId===c.id)||db.assets.some(a=>a.compoundId===c.id)||db.wos.some(w=>w.compoundId===c.id);
  if(used)return toast(lb('⚠ لا يمكن الحذف — توجد بيانات مرتبطة بهذا المجمع||⚠ Cannot delete — data is linked to this compound'),'err');
  if(!confirm(lb('حذف هذا المجمع؟||Delete this compound?')))return;
  db.compounds.splice(i,1);
  db.users.forEach(u=>{u.cmpIds=(u.cmpIds||[]).filter(x=>x!==c.id);if(u.activeCmp===c.id)u.activeCmp='';});
  if(me.activeCmp===c.id)me.activeCmp='';
  persist();paintTab();toast(lb('✔ حُذف||Deleted'),'ok');}

/* ===== PREVENTIVE MAINTENANCE ===== */
function intervalDays(p){const n=Math.max(1,+p.freqVal||1);return p.freqUnit==='days'?n:p.freqUnit==='weeks'?n*7:n*30;}
function nextDueOf(p){return p.nextDue||(p.lastDone?addDays(p.lastDone,intervalDays(p)):todayISO());}
function pmGen(){
  let created=0;
  db.pms.forEach(p=>{
    if(daysUntil(nextDueOf(p))<=0){
      const hasOpen=db.wos.some(w=>w.pmId===p.id&&w.status!=='closed');
      if(!hasOpen){
        db.seq++;const y=new Date().getFullYear();
        const ast=db.assets.find(a=>a.id===p.assetId)||{};
        db.wos.unshift({no:'WO-'+y+'-'+String(db.seq).padStart(4,'0'),type:'pm',pmId:p.id,compoundId:p.compoundId||activeCmp(),
          title:(db.lang==='ar'?'[صيانة دورية] ':'[PM] ')+p.name,
          desc:p.tasks||'',assetId:p.assetId||'',assetName:ast?ast.name:'',
          bname:ast?bName(ast.building):'',
          priority:'normal',status:'open',createdAt:Date.now(),startedAt:null,closedAt:null,projectId:'',
          unitId:'',unitCode:'',tenantName:'',
          dueDate:nextDueOf(p),assigneeId:p.assigneeId||'',assigneeName:p.assigneeName||'',
          cost:0,closeNotes:'',parts:[],photos:[],sig:'',
          reportedBy:lb('الجدولة التلقائية||Auto-scheduler'),
          checklist:(p.tasks||'').split('\n').map(s=>s.trim()).filter(Boolean).map(t=>({t,done:false,v:''}))});
        created++;
      }
    }
  });
  if(created)persist();
  return created;
}
function runScheduler(){const c=pmGen();paintTab();
  toast(c?(lb('✔ أُصدرت أوامر شغل دورية: ||PM work orders issued: ')+c):lb('لا صيانة مستحقة حالياً||Nothing due yet'),'ok');}
function vPM(){
  const act=activeCmp();
  let rows='';
  [...db.pms].filter(p=>p.compoundId===act).sort((a,b)=>daysUntil(nextDueOf(a))-daysUntil(nextDueOf(b))).forEach((p,i)=>{
    const nd=nextDueOf(p),du=daysUntil(nd);
    const ast=db.assets.find(a=>a.id===p.assetId)||null;
    rows+=`<tr class="${du<0?'overdue':''}"><td><b>${esc(p.name)}</b><br><span class="muted">${esc((p.tasks||'').split('\n')[0]||'')}…</span></td>
    <td>${esc(ast?ast.name:'—')}</td><td>${p.freqVal} ${FREQUNIT[p.freqUnit]}</td>
    <td>${fmtD(p.lastDone)}</td>
    <td>${du<0?`<span class="badge b-urgent">${lb('متأخرة||OVERDUE')} ${-du} ${lb('يوم||d')}</span> `:''}${fmtD(nd)}</td>
    <td>${esc(p.assigneeName||'—')}</td>
    <td nowrap>${isEng()?`<button class="btn sm ghost" onclick="pmDone(${i})">✅ ${lb('سجّل إنجاز||Log Done')}</button>
    <button class="btn sm ghost" onclick="pmForm(${i})">✏</button>
    <button class="btn sm danger" onclick="delPm(${i})">🗑</button>`:''}</td></tr>`;
  });
  return `<div class="toolbar">
    ${isEng()?`<button class="btn" onclick="pmForm()">＋ ${lb('خطة صيانة جديدة||New PM Plan')}</button>
    <button class="btn ghost" onclick="runScheduler()">⚡ ${lb('تشغيل الجدولة الآن||Run Scheduler Now')}</button>`:''}
    <button class="btn ghost" onclick="window.print()">🖨 ${lb('طباعة||Print')}</button></div>
  <p class="muted">${lb('عند استحقاق أي خطة، يُصدر النظام أمر شغل تلقائياً بقائمة الفحص للفني المسؤول.||When a plan is due, the system auto-issues a work order with its checklist.')}</p>
  <div class="card"><h2>${lb('خطط الصيانة الدورية||PM Plans')} (${db.pms.filter(p=>p.compoundId===act).length})</h2><div class="tbl-wrap"><table>
  <tr><th>${lb('الخطة||Plan')}</th><th>${lb('الأصل||Asset')}</th><th>${lb('التكرار||Frequency')}</th><th>${lb('آخر تنفيذ||Last Done')}</th><th>${lb('الاستحقاق القادم||Next Due')}</th><th>${lb('المسؤول||Assignee')}</th><th></th></tr>
  ${rows||`<tr><td colspan="7"><div class="empty">${lb('لا خطط بعد||No plans yet')}</div></td></tr>`}</table></div></div>`;
}

  const p=i!=null?db.pms[i]:{};

  const act=activeCmp();
  const techs=db.users.filter(u=>u.role==='tech'&&(u.cmpIds||[]).includes(act));
  modal(`<h3>${i!=null?lb('تعديل خطة||Edit Plan'):lb('خطة صيانة جديدة||New PM Plan')}</h3>
  <label>${lb('اسم الخطة *||Plan Name *')}</label><input id="fp_n" value="${esc(p.name||'')}">
  <div class="fg">
    <div><label>${lb('الأصل||Asset')}</label><select id="fp_a"><option value="">—</option>${opts}</select></div>
    <div><label>${lb('كرر كل||Repeat Every')}</label>
      <div style="display:flex;gap:6px"><input type="number" min="1" id="fp_fv" value="${p.freqVal||2}" style="width:80px">
      <select id="fp_fu">${Object.keys(FREQUNIT).map(k=>`<option value="${k}" ${(p.freqUnit||'weeks')===k?'selected':''}>${FREQUNIT[k]}</option>`).join('')}</select></div></div>
    <div><label>${lb('آخر تنفيذ (فارغ = اليوم)||Last Done (blank = today)')}</label><input type="date" id="fp_l" value="${p.lastDone||''}"></div>
    <div><label>${lb('الفني المسؤول||Technician')}</label><select id="fp_as"><option value="">—</option>${techs.map(t=>`<option value="${t.id}" ${p.assigneeId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>
  </div>
  <label>${lb('قائمة الفحص (سطر لكل بند)||Checklist (one per line)')}</label>
  <textarea id="fp_t" rows="4">${esc(p.tasks||'')}</textarea>
  <div class="ma"><button class="btn ghost" onclick="closeModal()">${lb('إلغاء||Cancel')}</button>
  <button class="btn" onclick="savePM(${i??'null'})">${lb('حفظ||Save')}</button></div>`);
}
function savePM(i){
  const n=$('fp_n').value.trim();if(!n)return toast(lb('⚠ الاسم مطلوب||⚠ Name required'),'err');
  const tech=db.users.find(u=>u.id===$('fp_as').value);
  const o={name:n,assetId:$('fp_a').value,compoundId:activeCmp(),freqVal:Math.max(1,+$('fp_fv').value||1),freqUnit:$('fp_fu').value,
    lastDone:$('fp_l').value||todayISO(),assigneeId:$('fp_as').value||'',assigneeName:tech?tech.name:'',tasks:$('fp_t').value};
  if(i!=null){Object.assign(db.pms[i],o);delete db.pms[i].nextDue;}
  else db.pms.push(Object.assign({id:uid('P')},o));
  persist();closeModal();paintTab();toast(lb('✔ حُفظت الخطة||✔ Plan saved'),'ok');
}
function pmDone(i){const p=db.pms[i];p.lastDone=todayISO();
  p.nextDue=addDays(todayISO(),intervalDays(p));
  persist();paintTab();toast(lb('✔ سُجل الإنجاز. القادم: ||✔ Logged. Next: ')+fmtD(p.nextDue),'ok');}
function delPm(i){if(!confirm(lb('حذف الخطة؟||Delete plan?')))return;db.pms.splice(i,1);persist();paintTab();}

/* ===== DASHBOARD ===== */
function monthKey(msOrIso){const d=(typeof msOrIso==='string'&&msOrIso.length===10)?new Date(msOrIso+'T00:00:00'):new Date(msOrIso);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function pmSoonCard(pmSoon){
  if(!pmSoon.length)return `<div class="empty">👍 ${lb('لا صيانة مستحقة قريباً||Nothing due soon')}</div>`;
  return pmSoon.slice(0,5).map(p=>{
    const du=daysUntil(nextDueOf(p)),i=db.pms.indexOf(p);
    return `<div class="pmrow ${du<0?'overdue':''}">
      <div style="flex:1;min-width:0"><b>${esc(p.name)}</b><br>
      <span class="muted">${du<0?`<span class="badge b-urgent">${lb('متأخرة||OVERDUE')} ${-du} ${lb('يوم||d')}</span>`
        :du<=3?`<span class="badge b-maint">${lb('بعد||in')} ${du} ${lb('يوم||d')}</span>`:fmtD(nextDueOf(p))}</span>
      ${p.assigneeName?` <span class="muted">· 👤 ${esc(p.assigneeName)}</span>`:''}</div>
      ${isEng()?`<button class="btn sm" style="background:linear-gradient(135deg,#159957,#22c55e)" title="${lb('تسجيل إنجاز||Log done')}" onclick="pmDone(${i})">✅</button>`:''}
    </div>`;}).join('');
}
function kpi(ic,num,lbl,tab,warn,extra){
  return `<div class="stat ${tab?'kpi':''} ${warn?'warn':''}" ${tab?`onclick="goTab('${tab}')"`:''} title="${lbl}">
    <div class="khead"><span class="kico">${ic}</span>${extra||''}</div>
    <div class="num">${num}</div><div class="lbl">${lbl}</div></div>`;
}
function vDash(){
  const act=activeCmp();
  const scope=(isTech()?db.wos.filter(w=>w.assigneeId===me.id):db.wos).filter(w=>w.compoundId===act);
  const unclosed=scope.filter(w=>w.status!=='closed');
  const openN=unclosed.length;
  const urgN=unclosed.filter(w=>w.priority==='urgent').length;
  const down=db.assets.filter(a=>a.status==='down'&&a.compoundId===act);
  const low=db.inv.filter(i=>Number(i.qty)<=Number(i.minQty));
  const pmAll=isTech()?[]:db.pms.filter(p=>p.compoundId===act);
  const pmLateN=isTech()?0:pmAll.filter(p=>daysUntil(nextDueOf(p))<=0).length;
  const pmSoonList=isTech()?[]:pmAll.filter(p=>daysUntil(nextDueOf(p))<=14)
    .sort((a,b)=>daysUntil(nextDueOf(a))-daysUntil(nextDueOf(b)));

  /* --- التنبيهات المهمة والطارئة فقط --- */
  const alerts=[];
  unclosed.filter(w=>w.priority==='urgent')
   .forEach(w=>alerts.push({ic:'🔴',h:`<b>${PRIO[w.priority]}</b>: ${esc(w.title)} — ${esc(w.assetName||w.bname||'')}`,tab:'wos'}));
  pmAll.filter(p=>daysUntil(nextDueOf(p))<=0)
   .forEach(p=>alerts.push({ic:'🗓',h:`${lb('صيانة دورية متأخرة:||Overdue PM:')} <b>${esc(p.name)}</b>`,tab:'pm'}));
  pmAll.filter(p=>{const d=daysUntil(nextDueOf(p));return d>0&&d<=3;})
   .forEach(p=>alerts.push({ic:'🗓',h:`${lb('صيانة قريبة:||PM soon:')} <b>${esc(p.name)}</b> (${fmtD(nextDueOf(p))})`,tab:'pm'}));
  if(canAppr())db.prs.filter(pr=>pr.status==='pending'&&(!pr.compoundId||pr.compoundId===act))
   .forEach(pr=>alerts.push({ic:'🛒',h:`${lb('طلب شراء بانتظار الموافقة:||PR awaiting approval:')} <b>${esc(pr.title)}</b> (${pr.no})`,tab:'proc'}));
  if(!isTech()){
    db.contracts.filter(c=>c.compoundId===act).forEach(c=>{const dd=daysUntil(c.end);
      if(dd<=30)alerts.push({ic:'📜',h:`${dd<0?lb('عقد منتهٍ:||Expired contract:'):lb('عقد ينتهي قريباً:||Contract ending:')} <b>${esc(c.vendor)}</b> (${fmtD(c.end)})`,tab:'contracts'});});
    db.tenants.forEach(x=>{const u=db.units.find(y=>y.id===x.unitId);
      const b=u?db.buildings.find(y=>y.id===u.buildingId):null;
      if(!b||b.compoundId!==act)return;
      const dd=daysUntil(x.leaseEnd);
      if(dd<=45)alerts.push({ic:'🔑',h:`${dd<0?lb('إيجار منتهٍ:||Expired lease:'):lb('إيجار ينتهي قريباً:||Lease ending:')} <b>${esc(x.name)}</b> (${fmtD(x.leaseEnd)})`,tab:'units'});});
  }
  low.forEach(i=>alerts.push({ic:'📦',h:`${lb('مخزون تحت الحد:||Low stock:')} <b>${esc(i.name)}</b> (${i.qty} ${esc(i.unit)})`,tab:'inv'}));
  down.forEach(a=>alerts.push({ic:'⚙️',h:`${esc(a.name)} — ${lb('متوقف||Down')}`,tab:'assets'}));

  const qa=[];
  qa.push(`<button class="btn" onclick="woForm()">＋ ${lb('بلاغ عطل جديد||New Fault Report')}</button>`);
  if(isEng())qa.push(`<button class="btn ghost" onclick="runScheduler()">⚡ ${lb('تشغيل الجدولة||Run Scheduler')}</button>`);

function drawAssetsTable(){
  try{
    const act=activeCmp();
    const q=(FILT.assets||'').toLowerCase();
    const list=db.assets.filter(a=>a.compoundId===act)
     .filter(a=>!q||((a.name||'')+' '+(a.category||'')+' '+bName(a.building)).toLowerCase().includes(q))
     .slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ar'));
    const head=`<tr><th>${lb('الأصل||Asset')}</th><th>${lb('التصنيف||Category')}</th><th>${lb('المبنى/المنطقة||Building')}</th><th>${lb('الطابق/الجزء||Floor')}</th><th>${lb('الحالة||Status')}</th><th>${lb('الضمان||Warranty')}</th>${isEng()?`<th></th>`:''}</tr>`;
    let rows='';
    if(!list.length)rows=`<tr><td colspan="7"><div class="empty">${db.assets.filter(a=>a.compoundId===act).length?lb('لا نتائج مطابقة للبحث||No search matches'):lb('لا أصول بعد — اضغط «إضافة أصل»||No assets yet — click Add Asset')}</div></td></tr>`;
    list.forEach(a=>{
      const st=ASTAT[a.status]||ASTAT.ok;
      const wr=a.warrantyend&&daysUntil(a.warrantyend)>=0&&daysUntil(a.warrantyend)<90;
      rows+=`<tr><td><b>${esc(a.name)}</b>${(a.photos&&a.photos.length)?' 🖼':''}</td><td>${esc(a.category||'—')}</td>
      <td>${esc(bName(a.building))}</td><td>${esc(a.floor||'—')}</td>
      <td><span class="badge ${st[1]}">${st[0]}</span></td>
      <td>${wr?`<span class="badge b-prog">${fmtD(a.warrantyend)}</span>`:fmtD(a.warrantyend)}</td>
      ${isEng()?`<td nowrap><button class="btn sm ghost" title="${lb('صور ومستندات||Photos')}" onclick="assetPhotos('${a.id}')">🖼</button>
        <button class="btn sm ghost" onclick="woForm(null,'${a.id}')">🛠</button>
        <button class="btn sm ghost" onclick="assetForm('${a.id}')">✏</button>
        <button class="btn sm danger" onclick="delAsset('${a.id}')">🗑</button></td>`:''}</tr>`;
    });
    const h=$('atbl_head'),b=$('atbl');
    if(h)h.innerHTML=head;if(b)b.innerHTML=rows;
  }catch(e){
    const b=$('atbl');
    if(b)b.innerHTML=`<tr><td colspan="7"><div class="empty">⚠️ ${lb('خطأ في عرض الجدول: ||Table error: ')}${esc(e.message)}</div></td></tr>`;
  }
}
function modal(html){
  const old=$('mbg');if(old)old.remove();
  const d=document.createElement('div');d.className='modal-bg';d.id='mbg';
  d.innerHTML=`<div class="modal">${html}</div>`;
  d.addEventListener('click',ev=>{if(ev.target===d)d.remove();});
  document.body.appendChild(d);d.style.display='block';
}
function closeModal(){const m=$('mbg');if(!m)return;
  m.style.animation='fade .15s ease reverse forwards';
  const bx=m.querySelector('.modal');
  if(bx)bx.style.animation='pop .15s ease reverse forwards';
  setTimeout(()=>m.remove(),150);}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

function fillFloors(sel){

function saveAsset(id){
  const name=$('fa_n').value.trim();if(!name)return toast(lb('⚠ الاسم مطلوب||⚠ Name required'),'err');
  const o={name,category:$('fa_c').value,building:$('fa_b').value,floor:$('fa_f').value,detail:$('fa_d').value,
    model:$('fa_m').value,serial:$('fa_s').value,installdate:$('fa_i').value,warrantyend:$('fa_w').value,
    status:$('fa_st').value,notes:$('fa_no').value};
  o.compoundId=activeCmp();
  o.photos=(window._faPh||[]).slice();
  if(id)Object.assign(db.assets.find(x=>x.id===id),o);
  else db.assets.push(Object.assign({id:uid('A'),projectId:''},o));

function doVillaBulk(){
  const a=+$('vb_a').value,b=+$('vb_b').value;let c=0;
  for(let i=Math.min(a,b);i<=Math.max(a,b);i++){

  if(d<=30)return['b-maint',lb('تنتهي قريباً||Expiring Soon')];
  return['b-ok',lb('سارية||Active')];}

function doCloseWO(i){
  const w=db.wos[i],used=[];
  for(const r of [...document.querySelectorAll('#prows .partrow')]){
    const it=db.inv.find(x=>x.id===r.querySelector('.pr_i').value);
    const q=+r.querySelector('.pr_q').value||0;
    if(it&&q>0){
      if(q>it.qty){toast(lb('⚠ الكمية غير متوفرة من: ||⚠ Not enough stock: ')+it.name,'err');return;}
      used.push({it,q});
    }
  }
  if(w.checklist)w.checklist.forEach((c,j)=>{
    const cb=$('ck_'+j),vv=$('ckv_'+j);
    if(cb){c.done=cb.checked;c.v=vv?vv.value:'';}
  });
  used.forEach(u=>{u.it.qty-=u.q;
    db.moves.unshift({date:todayISO(),item:u.it.name,type:'out',qty:u.q,ref:w.no,by:me.name});});
  w.parts=used.map(u=>({name:u.it.name,qty:u.q}));
  const phs=[];
  (window._woPhB||[]).forEach(p=>phs.push({id:uid('PH'),tag:'before',d:p.d,n:p.n||'',at:Date.now()}));
  (window._woPhA||[]).forEach(p=>phs.push({id:uid('PH'),tag:'after',d:p.d,n:p.n||'',at:Date.now()}));

  w.status='closed';w.closedAt=Date.now();if(!w.startedAt)w.startedAt=w.closedAt;

  }

}
