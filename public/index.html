<script>try{if(localStorage.getItem('amlaki_theme')==='dark')document.documentElement.classList.add('dark');}catch(e){}</script>
<!-- System fonts keep the dashboard self-contained and avoid third-party runtime dependencies. -->
<link rel="icon" type="image/svg+xml" href="/logo-mark.svg">
<style>
@font-face {
  font-family: 'Greta Arabic';
  font-weight: 300;
  src: local('Greta Arabic Light'), local('GretaArabic-Light'), local('Greta Light');
  font-display: swap;
}
@font-face {
  font-family: 'Greta Arabic';
  font-weight: 400;
  src: local('Greta Arabic Regular'), local('GretaArabic-Regular'), local('Greta Arabic'), local('Greta Regular');
  font-display: swap;
}
@font-face {
  font-family: 'Greta Arabic';
  font-weight: 500;
  src: local('Greta Arabic Medium'), local('GretaArabic-Medium'), local('Greta Medium');
  font-display: swap;
}
@font-face {
  font-family: 'Greta Arabic';
  font-weight: 700;
  src: local('Greta Arabic Bold'), local('GretaArabic-Bold'), local('Greta Bold');
  font-display: swap;
}
@font-face {
  font-family: 'Greta Arabic';
  font-weight: 800;
  src: local('Greta Arabic Heavy'), local('GretaArabic-Heavy'), local('Greta Arabic Black'), local('Greta Heavy');
  font-display: swap;
}
:root{
  --font-greta: "Greta Arabic", "Greta", "GretaArabic", "IBM Plex Sans Arabic", "Readex Pro", "Noto Kufi Arabic", "Segoe UI", sans-serif;
  --font-display: "Thmanyah Serif Display", "Greta Arabic", "Reem Kufi", "Noto Kufi Arabic", sans-serif;
  --ink:#132430;--muted:#5f7484;--brand:#0e7490;--dark:#155e75;
  --line:rgba(255,255,255,.65);
  --red:#dc2626;--redbg:rgba(254,226,226,.85);
  --green:#159957;--greenbg:rgba(209,250,229,.85);
  --amber:#d97706;--amberbg:rgba(254,243,199,.85);
  --blue:#2563eb;--bluebg:rgba(219,234,254,.85);
  --purple:#7c3aed;--purplebg:rgba(237,233,254,.85);
  --glass-hi:rgba(255,255,255,.72);--glass-lo:rgba(255,255,255,.34);
  --shadow:0 12px 34px -14px rgba(2,44,66,.22),inset 0 1px 0 rgba(255,255,255,.75);
  --r:14px;
}
/* ===== DARK MODE (html.dark — saved per device) ===== */
:root.dark{
  --ink:#e9f1f6;--muted:#9db4c2;--brand:#22b8cf;--dark:#0e7490;
  --line:rgba(255,255,255,.13);
  --red:#f87171;--redbg:rgba(127,29,29,.45);
  --green:#34d399;--greenbg:rgba(6,78,59,.5);
  --amber:#fbbf24;--amberbg:rgba(120,53,15,.5);
  --blue:#60a5fa;--bluebg:rgba(30,58,138,.55);
  --purple:#a78bfa;--purplebg:rgba(76,29,149,.55);
  --glass-hi:rgba(23,38,52,.82);--glass-lo:rgba(13,24,35,.6);
  --shadow:0 12px 34px -14px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08);
}
.dark body{background:#0b1620;color-scheme:dark}
.dark body::before{background:
  radial-gradient(42% 34% at 82% 8%, rgba(34,184,207,.16), transparent 62%),
  radial-gradient(36% 30% at 8% 22%, rgba(124,58,237,.14), transparent 62%),
  radial-gradient(46% 40% at 55% 105%, rgba(37,99,235,.12), transparent 62%),
  linear-gradient(165deg,#0b1620 0%,#0e1e2c 55%,#0b1620 100%)}
.dark .nbtn{color:#c7d6e0}
.dark .nbtn:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14)}
.dark .ucard,.dark .bell,.dark .chip,.dark .cmpcard{background:rgba(255,255,255,.07)}
.dark button.btn.ghost{background:rgba(255,255,255,.08);color:var(--ink)}
.dark button.btn.danger{background:rgba(127,29,29,.35)}
.dark input,.dark select,.dark textarea{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16);color:var(--ink)}
.dark select option{background:#14242f;color:#e9f1f6}
.dark input::placeholder,.dark textarea::placeholder{color:#7d93a3}
/* ===== الوضع الليلي: قراءة نص الإدخال =====
   قاعدة input:focus العامة تخلفية بخلفية #fff وبنفس الأولوية لكنها لاحقة،
   فكان النص الفاتح يُرسم على خلفية بيضاء أثناء الكتابة. القواعد التالية أعلى أولوية. */
.dark input,.dark select,.dark textarea{color:#f1f7fa;caret-color:#f1f7fa}
.dark input:focus,.dark select:focus,.dark textarea:focus{background:#1c2f40;color:#f1f7fa;
  border-color:#22b8cf;box-shadow:0 0 0 3px rgba(34,184,207,.22)}
.dark input::placeholder,.dark textarea::placeholder{color:#93a9b8;opacity:1}
.dark select option{background:#14242f;color:#f1f7fa}
.dark input:disabled,.dark select:disabled,.dark textarea:disabled{color:#9db4c2;-webkit-text-fill-color:#9db4c2}
.dark input:-webkit-autofill,.dark input:-webkit-autofill:hover,.dark input:-webkit-autofill:focus,
.dark textarea:-webkit-autofill{-webkit-text-fill-color:#f1f7fa;caret-color:#f1f7fa;
  -webkit-box-shadow:0 0 0 1000px #1c2f40 inset;box-shadow:0 0 0 1000px #1c2f40 inset;
  transition:background-color 9999s ease-out 0s}
.dark .modal{background:linear-gradient(160deg,rgba(24,39,53,.97),rgba(15,27,39,.95))}
.dark table th{border-color:rgba(255,255,255,.14)}
.dark td{border-color:rgba(255,255,255,.07)}
.dark tr:hover td{background:rgba(255,255,255,.05)}
.dark .sidediv{background:rgba(255,255,255,.12);box-shadow:none}
.dark .auth-wrapper{background:#0b1620}
.dark .auth-form-side{background:radial-gradient(circle at 10% 20%,rgba(34,184,207,.08) 0%,transparent 60%),#0e1a26}
.dark .auth-card{background:#14242f;box-shadow:0 22px 50px -12px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.09)}
.dark .auth-title{color:#f1f5f9}
.dark .auth-sub{color:#9db4c2}
.dark .btn-google{background:#1c2f40;border-color:rgba(255,255,255,.14);color:#e9f1f6}
.dark .btn-google:hover{background:#24394d;border-color:rgba(255,255,255,.22)}
.dark .auth-divider{color:#7d93a3}
.dark .auth-divider::before,.dark .auth-divider::after{background:rgba(255,255,255,.14)}
.dark .form-group label{color:#c7d6e0}
.dark .input-icon-wrap input{background:#1c2f40;border-color:rgba(255,255,255,.14);color:#e9f1f6}
.dark .input-icon-wrap input:focus{background:#24394d;color:#f1f7fa}
.dark .input-icon-wrap .input-icon{color:#7d93a3}
.dark .forgot-link,.dark .signup-link{color:#22b8cf}
.dark .btn-lang{background:#1c2f40!important;color:#e9f1f6!important;border-color:rgba(255,255,255,.14)!important}
.dark .btn-toggle-pw{background:#24394d!important;color:#c7d6e0!important}
.dark .cmpchip{background:rgba(255,255,255,.07)}
.dark .cmpsel{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16);color:var(--ink)}
.dark .sigbox{background:rgba(255,255,255,.92)}
.dark footer{color:#7d93a3}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-greta);
  color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;background:#e9eff5;min-height:100vh;
}
p, .sub, .auth-sub, .quote-text, .feature-text p, .form-desc, .hint, label, input, select, textarea, .card p, .modal-sub, .tbl-cell, .stat .lbl{
  font-family:var(--font-greta);
}
h1,h2,h3,.brand-t,.topbar .ttl,.stat .num{font-family:var(--font-display)}
button{font-family:var(--font-greta)}
body::before{
  content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(42% 34% at 82% 8%, rgba(14,116,144,.30), transparent 62%),
    radial-gradient(36% 30% at 8% 22%, rgba(124,58,237,.17), transparent 62%),
    radial-gradient(46% 40% at 55% 105%, rgba(37,99,235,.16), transparent 62%),
    radial-gradient(30% 26% at 30% 60%, rgba(8,145,178,.12), transparent 60%),
    linear-gradient(165deg,#f0f5fa 0%,#e6edf4 55%,#e9eff5 100%);
  filter:saturate(120%);
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(100,130,150,.35);border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(100,130,150,.55);border:2px solid transparent;background-clip:content-box}
.layout{display:flex;min-height:100vh;align-items:stretch}
.side{
  position:sticky;top:14px;height:calc(100vh - 28px);flex:0 0 240px;margin:14px;border-radius:20px;
  padding:18px 14px 14px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;overflow-x:hidden;
  scrollbar-width:thin;
  background:linear-gradient(160deg,var(--glass-hi),var(--glass-lo));
  backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);
  border:1px solid var(--line);box-shadow:var(--shadow);
}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 12px}
.brand .logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;
  background:linear-gradient(135deg,#0e7490,#0891b2);color:#fff;box-shadow:0 8px 20px -6px rgba(14,116,144,.55)}
.brand .logo img{width:40px;height:40px;border-radius:12px;display:block}
.brand-t{line-height:1.25;font-weight:800;font-size:13.5px}
.brand-t small{display:block;font-weight:600;color:var(--muted);font-size:10.5px}
.cmpsel{font-size:12.5px;font-weight:700}
.cmpchip{margin:0 4px 4px;padding:9px 11px;border-radius:12px;background:rgba(255,255,255,.5);
  border:1px solid var(--line);font-size:12.5px;font-weight:800;color:var(--ink);line-height:1.6}
.cmpchip small{display:block;font-size:10px;color:var(--muted);font-weight:700;margin-bottom:1px}
.sidediv{height:1px;background:rgba(255,255,255,.6);margin:8px 6px;box-shadow:0 1px 0 rgba(2,44,66,.05)}
.slabel{font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);padding:8px 10px 2px}
.nbtn{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:8px 12px;border-radius:12px;
  border:1px solid transparent;background:none;color:#39505f;font-weight:700;font-size:13.5px;
  cursor:pointer;transition:.18s;text-align:start;white-space:nowrap;overflow:hidden}
.nbtn .nt{overflow:hidden;text-overflow:ellipsis;min-width:0}
.nbtn .ic{font-size:16px;width:22px;text-align:center;filter:saturate(.9)}
.nbtn .ic svg{width:20px;height:20px;vertical-align:-4px}
button.btn svg,.chip svg{width:14px;height:14px;vertical-align:-2px}
button.btn.sm svg{width:13px;height:13px}
.badge svg{width:11px;height:11px;vertical-align:-1px}
.bell svg{width:16px;height:16px;vertical-align:-3px}
.nbtn:hover{background:rgba(255,255,255,.55);border-color:rgba(255,255,255,.7)}
.nbtn.active{background:linear-gradient(135deg,#0e7490,#0891b2);color:#fff;border-color:transparent;
  box-shadow:0 10px 22px -8px rgba(14,116,144,.55)}
.nbtn.active .ic{filter:none}
/* ===== تفاعل القائمة الجانبية مع الماوس: مؤشر منزلق + حركة ديناميكية ===== */
.navglide{
  position:absolute;top:0;left:8px;right:8px;height:0;border-radius:12px;pointer-events:none;z-index:0;
  background:linear-gradient(135deg,rgba(14,116,144,.20),rgba(8,145,178,.12));
  border:1px solid rgba(14,116,144,.25);opacity:0;
  transition:transform .36s cubic-bezier(.22,1,.36,1),height .36s cubic-bezier(.22,1,.36,1),opacity .25s ease;
}
.dark .navglide{background:linear-gradient(135deg,rgba(34,184,207,.24),rgba(34,184,207,.12));border-color:rgba(34,184,207,.32)}
.nbtn{position:relative;z-index:1;
  transition:transform .22s cubic-bezier(.22,1,.36,1),background .18s,border-color .18s,box-shadow .18s,color .18s}
.nbtn::before{ /* لمعة تمرّ على العنصر عند المرور */
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
  transform:translateX(-130%);transition:transform .55s cubic-bezier(.22,1,.36,1);opacity:0;
}
.dark .nbtn::before{background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent)}
.nbtn:hover{transform:translateX(5px)}
.nbtn:hover::before{transform:translateX(130%);opacity:1}
.nbtn:hover .ic{transform:scale(1.14) rotate(-4deg)}
.nbtn .ic{transition:transform .26s cubic-bezier(.22,1,.36,1)}
body[dir="rtl"] .nbtn:hover{transform:translateX(-5px)}
body[dir="rtl"] .nbtn::before{transform:translateX(130%)} /* البداية من الطرف المقابل في RTL */
body[dir="rtl"] .nbtn:hover::before{transform:translateX(-130%)}
.nbtn.active::before{display:none}
@media (max-width:960px){.navglide{display:none}.nbtn:hover{transform:none}}
@media (prefers-reduced-motion:reduce){
  .navglide,.nbtn,.nbtn::before,.nbtn .ic{transition:none!important}
  .nbtn:hover{transform:none}
  .nbtn:hover .ic{transform:none}
}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:8px}
.ucard{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:13px;
  background:rgba(255,255,255,.55);border:1px solid var(--line)}
.ucard .av{width:34px;height:34px;border-radius:99px;display:grid;place-items:center;font-weight:800;color:#fff;
  background:linear-gradient(135deg,#155e75,#0e7490);flex:0 0 auto}
.ucard .nm{font-weight:800;font-size:12.5px;line-height:1.3}
.ucard .rl{color:var(--muted);font-size:11px;font-weight:600}
.sideacts{display:flex;gap:6px}
.sideacts button{flex:1}
.content{flex:1;min-width:0;display:flex;flex-direction:column;padding:14px 18px 26px}
.topbar{
  position:sticky;top:0;z-index:6;margin-bottom:14px;padding:10px 16px;border-radius:16px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  background:linear-gradient(160deg,var(--glass-hi),var(--glass-lo));
  backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--line);box-shadow:var(--shadow);
}
.topbar .ttl{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px}
.topbar .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:600}
.bell{position:relative;background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:11px;
  font-size:16px;cursor:pointer;padding:5px 9px;transition:.18s}
.bell:hover{background:#fff;transform:translateY(-1px)}
.bellb{position:absolute;top:-6px;inset-inline-end:-6px;background:var(--red);color:#fff;border-radius:99px;
  font-size:10px;padding:1px 5px;font-weight:800;box-shadow:0 4px 10px -2px rgba(220,38,38,.5)}
main{flex:1}
footer{text-align:center;color:#8aa0ae;font-size:11px;padding:16px 0 4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:12px;margin-bottom:16px}
.stat{border-radius:var(--r);padding:14px 14px 12px;transition:.2s;
  background:linear-gradient(160deg,var(--glass-hi),var(--glass-lo));
  backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  border:1px solid var(--line);box-shadow:var(--shadow)}
.stat:hover{transform:translateY(-2px);box-shadow:0 16px 38px -14px rgba(2,44,66,.28),inset 0 1px 0 rgba(255,255,255,.8)}
.stat .num{font-size:26px;font-weight:800;line-height:1.15;letter-spacing:-.5px}
.stat .lbl{font-size:11px;color:var(--muted);font-weight:700;margin-top:3px}
.stat.warn .num{color:var(--red)}.stat.ok .num{color:var(--green)}
.card{border-radius:var(--r);padding:16px;margin-bottom:14px;
  background:linear-gradient(160deg,var(--glass-hi),var(--glass-lo));
  backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  border:1px solid var(--line);box-shadow:var(--shadow)}
.card h2{font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:start;color:var(--muted);font-size:10.5px;padding:8px;border-bottom:1.5px solid rgba(2,44,66,.12);
  white-space:nowrap;text-transform:uppercase;letter-spacing:.5px}
td{padding:8px;border-bottom:1px solid rgba(2,44,66,.07);vertical-align:top}
tr:hover td{background:rgba(255,255,255,.45)}
.tbl-wrap{overflow-x:auto;border-radius:10px}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap;
  border:1px solid rgba(255,255,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.b-open{background:var(--bluebg);color:var(--blue)}.b-prog{background:var(--amberbg);color:var(--amber)}
.b-wait{background:var(--purplebg);color:var(--purple)}.b-done{background:var(--greenbg);color:var(--green)}
.b-urgent{background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;border-color:transparent;box-shadow:0 4px 12px -3px rgba(220,38,38,.5)}
.b-high{background:var(--redbg);color:var(--red)}
.b-normal{background:rgba(226,232,240,.8);color:var(--muted)}.b-low{background:var(--redbg);color:var(--red)}
.b-ok{background:var(--greenbg);color:var(--green)}.b-down{background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;border-color:transparent}
.b-maint{background:var(--amberbg);color:var(--amber)}
button.btn{padding:8px 15px;border:none;border-radius:11px;font-weight:700;font-size:13px;cursor:pointer;
  color:#fff;background:linear-gradient(135deg,#0e7490,#0891b2);
  box-shadow:0 8px 18px -6px rgba(14,116,144,.55);transition:.18s}
button.btn:hover{transform:translateY(-1px);box-shadow:0 12px 24px -6px rgba(14,116,144,.6);filter:brightness(1.05)}
button.btn:active{transform:translateY(0)}
button.btn.ghost{background:rgba(255,255,255,.6);color:var(--ink);border:1px solid var(--line);box-shadow:0 4px 12px -6px rgba(2,44,66,.15)}
button.btn.ghost:hover{background:#fff;border-color:rgba(14,116,144,.4);color:var(--brand)}
button.btn.danger{background:rgba(255,255,255,.6);color:var(--red);border:1px solid rgba(254,202,202,.9);box-shadow:none}
button.btn.danger:hover{background:var(--redbg)}
button.btn.sm{padding:3px 9px;font-size:12px;border-radius:9px}
input,select,textarea{padding:8px 11px;border:1px solid rgba(2,44,66,.14);border-radius:10px;font-size:14px;
  width:100%;font-family:inherit;color:var(--ink);
  background:rgba(255,255,255,.65);transition:.18s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);
  background:#fff;box-shadow:0 0 0 3px rgba(14,116,144,.15)}
input:disabled,select:disabled{opacity:.55;cursor:not-allowed}
input[type=checkbox]{width:auto;accent-color:#0e7490;transform:scale(1.15);cursor:pointer}
select option{background:#fff}
textarea{resize:vertical}
label{font-size:11px;font-weight:800;color:var(--muted);display:block;margin:9px 0 4px;letter-spacing:.3px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 12px}
.modal-bg{position:fixed;inset:0;background:rgba(10,30,45,.42);display:none;z-index:50;overflow-y:auto;
  padding:26px 12px;animation:fade .18s ease;backdrop-filter:blur(6px) saturate(120%);-webkit-backdrop-filter:blur(6px) saturate(120%)}
.modal{max-width:680px;margin:0 auto;border-radius:18px;padding:22px;animation:pop .2s cubic-bezier(.2,.9,.3,1.2);
  background:linear-gradient(160deg,rgba(255,255,255,.92),rgba(255,255,255,.78));
  backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);
  border:1px solid rgba(255,255,255,.8);box-shadow:0 30px 70px -20px rgba(2,44,66,.45)}
@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}}
@keyframes fade{from{opacity:0}}
.modal h3{margin-bottom:4px;font-size:16.5px}
.fsec{font-size:12.5px;font-weight:800;color:var(--brand);margin:14px 0 2px;padding-top:10px;border-top:1px dashed rgba(2,44,66,.15)}
.fsec:first-of-type{border-top:0;margin-top:6px;padding-top:0}
.ckline{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;margin:8px 0;cursor:pointer}
.ckline input{width:auto}
.ma{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.searchbar{margin-bottom:10px;max-width:300px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.empty{color:var(--muted);text-align:center;padding:22px;font-style:italic}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(8px);z-index:99;
  background:rgba(19,36,48,.88);color:#fff;padding:11px 20px;border-radius:99px;font-size:13.5px;font-weight:700;
  opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;max-width:92vw;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.18);box-shadow:0 14px 34px -8px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:rgba(21,153,87,.92)}.toast.err{background:rgba(220,38,38,.92)}
.muted{color:var(--muted);font-size:12.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:5px 13px;border-radius:99px;border:1px solid var(--line);cursor:pointer;font-size:12.5px;
  font-weight:700;color:var(--muted);transition:.18s;
  background:rgba(255,255,255,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chip:hover{background:#fff;color:var(--brand)}
.chip.on{background:linear-gradient(135deg,#0e7490,#0891b2);color:#fff;border-color:transparent;
  box-shadow:0 6px 16px -5px rgba(14,116,144,.55)}
.chip.mini{padding:2px 9px;font-size:11.5px}
.alert-li{padding:7px 0;border-bottom:1px dashed rgba(2,44,66,.12);line-height:1.7}
.tl{list-style:none;margin:8px 0}
.tl li{padding:6px 0;border-bottom:1px dashed rgba(2,44,66,.12);font-size:13px}
.partrow{display:grid;grid-template-columns:1fr 90px 40px;gap:6px;margin-bottom:6px;align-items:center}
.itrow{display:grid;grid-template-columns:1fr 130px 70px 90px 36px;gap:6px;margin-bottom:6px;align-items:center}
.certrow{display:grid;grid-template-columns:1fr 150px 36px;gap:6px;margin-bottom:6px;align-items:center}
.taskrow{display:grid;grid-template-columns:auto 1fr 130px 130px 36px;gap:8px;align-items:center;padding:7px;
  border:1px solid var(--line);border-radius:11px;margin-bottom:6px;background:rgba(255,255,255,.45)}
.ckrow{display:grid;grid-template-columns:auto 1fr 150px;gap:8px;align-items:center;padding:7px;
  border:1px solid var(--line);border-radius:11px;margin-bottom:6px;background:rgba(255,255,255,.45)}
.overdue td{background:rgba(254,226,226,.55)!important}
.bar{height:9px;border-radius:5px;min-width:2px;transition:width .35s;
  background:linear-gradient(90deg,#0e7490,#0891b2);box-shadow:0 2px 8px -2px rgba(14,116,144,.5)}
.bar.red{background:linear-gradient(90deg,#dc2626,#ef4444);box-shadow:0 2px 8px -2px rgba(220,38,38,.5)}
.bar.grn{background:linear-gradient(90deg,#159957,#22c55e);box-shadow:0 2px 8px -2px rgba(21,153,87,.5)}
.qline{font-size:12px;color:var(--muted);margin-top:3px}
.dayhdr{font-weight:800;font-size:13px;margin:12px 0 6px;color:var(--brand)}
.dash-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.dg-12{grid-column:span 12}.dg-8{grid-column:span 8}.dg-7{grid-column:span 7}
.dg-6{grid-column:span 6}.dg-5{grid-column:span 5}.dg-4{grid-column:span 4}
@media(max-width:1080px){.dg-8,.dg-7,.dg-6,.dg-5,.dg-4{grid-column:span 12}}
/* ===== AMLAKI MODULE HUB — محفظة العقارات · الصيانة والمقاولون · المتتبع المالي ===== */
.hub-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 10px}
.hub-head b{font-family:var(--font-display);font-size:15px;font-weight:800}
.hub-badge{font-size:10.5px;font-weight:800;color:var(--brand);background:rgba(14,116,144,.1);
  border:1px solid rgba(14,116,144,.22);padding:3px 10px;border-radius:99px}
.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-bottom:16px}
.pillar{border-radius:16px;padding:15px;display:flex;flex-direction:column;gap:11px;
  background:linear-gradient(160deg,var(--glass-hi),var(--glass-lo));
  backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  border:1px solid var(--line);box-shadow:var(--shadow);transition:.2s}
.pillar:hover{transform:translateY(-2px);box-shadow:0 18px 40px -16px rgba(2,44,66,.3),inset 0 1px 0 rgba(255,255,255,.8)}
.pillar-head{display:flex;align-items:center;gap:10px}
.pillar-ic{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto}
.pillar-head .pt{display:block;font-family:var(--font-display);font-size:14.5px;font-weight:800;line-height:1.25}
.pillar-head .ps{display:block;font-size:10.5px;color:var(--muted);font-weight:700}
.pillar-head .pgo{margin-inline-start:auto}
.psub{font-size:10.5px;color:var(--muted);font-weight:800;letter-spacing:.2px}
.ic-bldg{background:linear-gradient(135deg,#0e7490,#0891b2);box-shadow:0 8px 18px -8px rgba(14,116,144,.75)}
.ic-tool{background:linear-gradient(135deg,#b45309,#f59e0b);box-shadow:0 8px 18px -8px rgba(180,83,9,.75)}
.ic-fin{background:linear-gradient(135deg,#047857,#22c55e);box-shadow:0 8px 18px -8px rgba(4,120,87,.75)}
.pkpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px}
.pkpi{background:rgba(255,255,255,.5);border:1px solid var(--line);border-radius:11px;padding:7px 9px}
.pkpi .v{font-size:16px;font-weight:800;letter-spacing:-.4px;line-height:1.25}
.pkpi .v small{font-size:9.5px;font-weight:700;color:var(--muted);letter-spacing:0}
.pkpi .k{font-size:10px;color:var(--muted);font-weight:700;margin-top:2px}
.pkpi.warn .v{color:var(--red)}.pkpi.ok .v{color:var(--green)}
.donut{width:116px;height:116px;border-radius:50%;position:relative;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
.donut .hole{position:absolute;inset:15px;border-radius:50%;background:var(--glass-hi);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.donut .hole b{font-size:19px;font-weight:800;letter-spacing:-.5px;line-height:1}
.donut .hole small{font-size:9.5px;color:var(--muted);font-weight:700}
.hbar{display:grid;grid-template-columns:104px 1fr 66px;gap:8px;align-items:center;margin-bottom:8px;
  font-size:12px;font-weight:700}
.hbar>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .hb{height:20px;border-radius:7px;background:rgba(2,44,66,.09);overflow:hidden}
.hbar .hb i{display:block;height:100%;border-radius:7px;transition:width .5s}
.hbar .hv{font-size:11.5px;color:var(--muted);text-align:end;white-space:nowrap}
.hbar.click{cursor:pointer}
.hbar.click:hover .hb i{filter:brightness(1.12)}
.pillar-foot{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap;padding-top:2px}
.fchart{display:flex;gap:8px;align-items:flex-end;height:118px}
.fcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.fcol .fbars{display:flex;gap:3px;align-items:flex-end;justify-content:center;width:100%;height:100%}
.fcol .fbars i{width:44%;max-width:22px;border-radius:6px 6px 2px 2px;transition:.3s}
.fcol .fbars i.inc{background:linear-gradient(180deg,#22c55e,#047857)}
.fcol .fbars i.exp{background:linear-gradient(180deg,#f87171,#dc2626)}
.fcol .fl{font-size:9.5px;color:var(--muted);font-weight:700}
.netline{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 11px;border-radius:11px;
  background:rgba(255,255,255,.5);border:1px solid var(--line);font-weight:800;font-size:12.5px}
.netline .nv{font-size:16px}
.netline.pos{border-color:rgba(21,153,87,.35)}.netline.pos .nv{color:var(--green)}
.netline.neg{border-color:rgba(220,38,38,.35)}.netline.neg .nv{color:var(--red)}
.dark .pillar .pkpi,.dark .pillar .netline,.dark .pillar .hbar .hb{background:rgba(255,255,255,.07)}
.dark .donut .hole{background:#16242f}
.dark .hub-badge{background:rgba(34,184,207,.14);border-color:rgba(34,184,207,.28)}
.topbar .pname{background:linear-gradient(135deg,#0e7490,#0891b2);color:#fff;padding:3px 10px;border-radius:9px;
  font-size:12.5px;font-weight:800;box-shadow:0 6px 14px -6px rgba(14,116,144,.6)}
/* ===== مبدّل الأصل (هيدر) + بطاقات نوع الأصل + التهيئة الأولى ===== */
.topbar .asw{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.6);border:1px solid var(--line);
  border-radius:12px;padding:4px 9px;cursor:pointer;font:inherit;color:var(--ink);transition:.18s;max-width:min(300px,46vw)}
.topbar .asw:hover{background:#fff;border-color:rgba(14,116,144,.4);transform:translateY(-1px)}
.asw-ic{width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto}
.asw-tx{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;min-width:0}
.asw-tx b{font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.asw-tx small{font-size:9.5px;color:var(--muted);font-weight:700}
.swlist{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.swrow{display:flex;align-items:center;gap:10px;width:100%;text-align:start;font:inherit;cursor:pointer;
  background:rgba(255,255,255,.5);border:1px solid var(--line);border-radius:12px;padding:9px 11px;transition:.15s;color:var(--ink)}
.swrow:hover{background:#fff;border-color:rgba(14,116,144,.4)}
.swrow.on{border-color:var(--brand);box-shadow:0 0 0 2px rgba(14,116,144,.14)}
.swic{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto}
.swtx{display:flex;flex-direction:column;min-width:0;flex:1}
.swtx b{font-size:13.5px}
.swtx small{font-size:10.5px;color:var(--muted);font-weight:600}
.dom-chip{display:inline-flex;align-items:center;gap:5px;color:#fff;font-size:10.5px;font-weight:800;
  padding:3px 9px;border-radius:99px;margin-inline-end:6px;vertical-align:middle}
.ic-fleet{background:linear-gradient(135deg,#6d28d9,#a78bfa);box-shadow:0 8px 18px -8px rgba(109,40,217,.75)}
.ic-ind{background:linear-gradient(135deg,#b45309,#f59e0b);box-shadow:0 8px 18px -8px rgba(180,83,9,.75)}
.ic-gen{background:linear-gradient(135deg,#334155,#94a3b8);box-shadow:0 8px 18px -8px rgba(51,65,85,.75)}
.onb-hero{text-align:center;margin-bottom:14px}
.onb-logo img{width:52px;height:52px;border-radius:15px;display:inline-block}
.onb-hero h1{font-size:20px;margin:10px 0 6px}
.onb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:6px 0 4px}
.onb-card{display:flex;flex-direction:column;align-items:flex-start;gap:5px;text-align:start;cursor:pointer;font:inherit;
  background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:14px;padding:13px;transition:.18s;color:var(--ink)}
.onb-card:hover{transform:translateY(-2px);border-color:rgba(14,116,144,.45);background:#fff;
  box-shadow:0 14px 30px -16px rgba(2,44,66,.35)}
.onb-ic{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0e7490,#0891b2);color:#fff}
.onb-card b{font-size:13.5px}
.onb-card .muted{font-size:11px;line-height:1.5}
.onb-go{font-size:11px;font-weight:800;color:var(--brand);margin-top:2px}
.onb-wrap{border-inline-start:3px solid var(--brand)}
.onb-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:8px}
.onb-step{display:flex;align-items:center;gap:9px;text-align:start;font:inherit;font-weight:700;font-size:12.5px;
  cursor:pointer;background:rgba(255,255,255,.5);border:1px solid var(--line);border-radius:11px;padding:9px 11px;transition:.16s;color:var(--ink)}
.onb-step:hover{background:#fff;border-color:rgba(14,116,144,.4)}
.onb-step .n{width:22px;height:22px;border-radius:99px;background:linear-gradient(135deg,#0e7490,#0891b2);color:#fff;
  font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.cmpcard{position:relative}
.cmpdom{position:absolute;top:10px;inset-inline-end:10px;width:26px;height:26px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;color:#fff}
.dark .topbar .asw,.dark .swrow,.dark .onb-card,.dark .onb-step{background:rgba(255,255,255,.07)}
.dark .topbar .asw:hover,.dark .swrow:hover,.dark .onb-card:hover,.dark .onb-step:hover{background:rgba(255,255,255,.12)}
@media(max-width:1080px){.hub{grid-template-columns:1fr}}
.kpi{cursor:pointer}
.kpi .khead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2px}
.kpi .kico{font-size:19px;opacity:.9}
.trend{font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;white-space:nowrap}
.trend.up{background:var(--greenbg);color:var(--green)}
.trend.down{background:var(--redbg);color:var(--red)}
.trend.flat{background:rgba(226,232,240,.8);color:var(--muted)}
.donut-wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}
.legend{display:flex;flex-direction:column;gap:4px;min-width:150px;flex:1}
.legend .li{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;cursor:pointer;
  padding:4px 9px;border-radius:9px;transition:.15s;justify-content:space-between}
.legend .li:hover{background:rgba(255,255,255,.65)}
.legend .li b{font-size:13.5px}
.legend .lft{display:flex;align-items:center;gap:8px}
.legend .dot{width:10px;height:10px;border-radius:99px;box-shadow:0 0 0 2px rgba(255,255,255,.6)}
.hbar-row{display:grid;grid-template-columns:118px 1fr 64px;gap:8px;align-items:center;margin-bottom:9px;
  font-size:12.5px;font-weight:700}
.hbar-row.click{cursor:pointer}
.mini-bar{border-radius:8px;color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;
  padding-inline:7px;height:100%;min-width:2px;transition:width .5s;white-space:nowrap}
.pdot{display:inline-block;width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.pmrow{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:11px;
  background:rgba(255,255,255,.5);border:1px solid var(--line);margin-bottom:7px}
.pmrow.overdue{background:var(--redbg);border-color:rgba(254,202,202,.9)}
.alrow{cursor:pointer;border-radius:9px;padding:7px 8px;transition:.13s}
.alrow:hover{background:rgba(255,255,255,.6)}
.qa{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.mchart{display:flex;gap:10px;align-items:flex-end;height:172px}
.mcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;cursor:pointer}
.mcol:hover .mbar{filter:brightness(1.12);transform:translateY(-2px)}
.mbar{width:70%;max-width:44px;display:flex;flex-direction:column;border-radius:9px;overflow:hidden;
  box-shadow:0 4px 10px -4px rgba(2,44,66,.35);transition:.2s}
.mval{font-size:10.5px;font-weight:800;color:var(--ink)}
.mx{font-size:10px;font-weight:700;color:var(--muted)}
.pgrid{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;margin:6px 0}
.phwrap{position:relative;display:inline-block}
.pthumb{width:88px;height:88px;object-fit:cover;border-radius:11px;border:1px solid var(--line);
  cursor:zoom-in;box-shadow:0 4px 12px -4px rgba(2,44,66,.25);transition:.15s;background:#fff}
.pthumb:hover{transform:translateY(-2px);box-shadow:0 8px 18px -6px rgba(2,44,66,.35)}
.phdel{position:absolute;top:-7px;inset-inline-end:-7px;width:22px;height:22px;border-radius:99px;border:none;
  background:var(--red);color:#fff;font-size:11px;font-weight:800;cursor:pointer;box-shadow:0 4px 10px -2px rgba(220,38,38,.5)}
.phtag{position:absolute;bottom:4px;inset-inline-start:4px;background:rgba(19,36,48,.75);color:#fff;
  font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:99px}
.sigbox{width:100%;max-width:560px;height:150px;border:1.5px dashed rgba(2,44,66,.3);border-radius:12px;
  background:rgba(255,255,255,.85);touch-action:none;cursor:crosshair;display:block}
.sigimg{max-width:280px;background:#fff;border:1px solid var(--line);border-radius:11px;
  box-shadow:0 4px 12px -4px rgba(2,44,66,.2)}
/* ===== MODERN SPLIT-SCREEN AUTH STYLES ===== */
.auth-wrapper{min-height:100vh;display:flex;background:#f1f5f9;position:relative;overflow-x:hidden}
.auth-form-side{
  flex:1 1 48%;display:flex;align-items:center;justify-content:center;
  padding:36px 24px;
  background:radial-gradient(circle at 10% 20%,rgba(14,116,144,.07) 0%,transparent 60%),
             radial-gradient(circle at 90% 80%,rgba(8,145,178,.06) 0%,transparent 60%),
             #f8fafc;
  position:relative;z-index:2;
}
.auth-card{
  width:100%;max-width:440px;background:#ffffff;border-radius:26px;
  padding:38px 32px 30px;
  box-shadow:0 22px 50px -12px rgba(15,23,42,.1),0 1px 3px 0 rgba(0,0,0,.04),0 0 0 1px rgba(226,232,240,.8);
  animation:authPop .35s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column;
}
@keyframes authPop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.auth-header{text-align:center;margin-bottom:20px}
.auth-title{font-family:var(--font-display);font-size:25px;font-weight:800;color:#0f172a;margin-bottom:6px;letter-spacing:-.3px}
.auth-sub{font-size:13px;color:#64748b;font-weight:400;line-height:1.5}
.btn-google{
  width:100%;display:flex;align-items:center;justify-content:center;gap:12px;
  padding:10px 16px;background:#ffffff;border:1.5px solid #e2e8f0;border-radius:13px;
  color:#1e293b;font-size:13.5px;font-weight:600;font-family:var(--font-greta);
  cursor:pointer;transition:all .18s ease;box-shadow:0 1px 3px rgba(0,0,0,.03);
}
.btn-google:hover{background:#f8fafc;border-color:#cbd5e1;transform:translateY(-1px);box-shadow:0 4px 12px -2px rgba(15,23,42,.08)}
.btn-google:active{transform:translateY(0)}
.auth-divider{display:flex;align-items:center;margin:18px 0;color:#94a3b8;font-size:12px;font-weight:600}
.auth-divider::before,.auth-divider::after{content:"";flex:1;height:1px;background:#e2e8f0}
.auth-divider span{padding:0 14px;font-family:var(--font-greta)}
.auth-form{display:flex;flex-direction:column;gap:14px}
.form-group{display:flex;flex-direction:column;gap:6px}
.label-row{display:flex;justify-content:space-between;align-items:center}
.form-group label{font-size:12px;font-weight:600;color:#334155;margin:0}
.forgot-link{font-size:11.5px;color:#0e7490;text-decoration:none;font-weight:600;transition:color .15s}
.forgot-link:hover{color:#0891b2;text-decoration:underline}
.input-icon-wrap{position:relative;display:flex;align-items:center}
.input-icon-wrap input{
  width:100%;padding:10px 38px 10px 14px;background:#ffffff;
  border:1.5px solid #cbd5e1;border-radius:12px;font-size:13.5px;color:#0f172a;
  transition:all .18s ease;font-family:var(--font-greta);font-weight:500;
}
html[dir="ltr"] .input-icon-wrap input{padding:10px 14px 10px 38px}
.input-icon-wrap input:focus{border-color:#0e7490;box-shadow:0 0 0 3.5px rgba(14,116,144,.15);background:#fff}
.input-icon-wrap .input-icon{
  position:absolute;inset-inline-end:12px;display:flex;align-items:center;
  color:#94a3b8;pointer-events:none;
}
.password-wrap input{padding-inline-start:54px}
.btn-toggle-pw{
  position:absolute;inset-inline-start:8px;background:none;border:none;
  color:#0e7490;font-size:11.5px;font-weight:700;font-family:var(--font-greta);
  cursor:pointer;padding:4px 6px;border-radius:6px;transition:background .15s;
}
.btn-toggle-pw:hover{background:rgba(14,116,144,.08)}
.btn-login{
  width:100%;margin-top:6px;padding:11px 18px;border:none;border-radius:13px;
  background:linear-gradient(135deg,#0e7490 0%,#0891b2 100%);
  color:#ffffff;font-size:14px;font-weight:700;font-family:var(--font-greta);
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 10px 22px -6px rgba(14,116,144,.45);transition:all .18s ease;
}

/* ══════════════════════════════════════════════════════════════════
   أملاكي — طبقة الهوية البصرية v2  (AMLAKI VISUAL LAYER v2)
   تعديل مظهر فقط: لا تغيير في HTML أو JavaScript أو أسماء الفئات.
   Appearance-only layer. No markup, script or class-name changes.
   ══════════════════════════════════════════════════════════════════ */

/* ── 1. الألوان والمقاسات ───────────────────────────────────────── */
:root{
  /* حبر وسطوح */
  --ink:#10232d;--muted:#617c8b;
  --brand:#0d6e80;--brand-2:#0f92a8;--dark:#0a5563;
  --brand-soft:rgba(13,110,128,.09);
  --sand:#a9702f;                       /* لون مساند دافئ للتنبيهات الزمنية */
  --line:#dde5ea;                       /* خط شعرة بدل حافة الزجاج */
  --line-soft:#eaf0f3;
  --glass-hi:#ffffff;--glass-lo:#fbfcfd;/* بطاقات صلبة وواضحة بدل الزجاج */
  --s2:#f4f8f9;                         /* سطح داخلي (خانات، أشرطة، صفوف) */
  --s3:#edf3f5;
  --slab-1:#0c2632;--slab-2:#0a1b24;    /* عمود التنقّل الداكن */

  --red:#c94141;--redbg:#fdeceb;
  --green:#12855f;--greenbg:#e4f5ee;
  --amber:#b4761a;--amberbg:#fbf0dd;
  --blue:#2b64d9;--bluebg:#e7eefc;
  --purple:#6d4bd8;--purplebg:#eeeafc;

  --shadow:0 1px 2px rgba(10,35,45,.05),0 10px 26px -18px rgba(10,35,45,.35);
  --shadow-lift:0 2px 4px rgba(10,35,45,.06),0 20px 40px -24px rgba(10,35,45,.45);
  --r:15px;
}
:root.dark{
  --ink:#e7eff3;--muted:#91a8b5;
  --brand:#33bfd4;--brand-2:#4ad2e6;--dark:#1a93a8;
  --brand-soft:rgba(51,191,212,.14);
  --sand:#d9a459;
  --line:rgba(255,255,255,.10);
  --line-soft:rgba(255,255,255,.06);
  --glass-hi:#122430;--glass-lo:#0f1f2a;
  --s2:rgba(255,255,255,.05);
  --s3:rgba(255,255,255,.08);
  --red:#f07272;--redbg:rgba(153,27,27,.32);
  --green:#3ed39a;--greenbg:rgba(6,95,70,.34);
  --amber:#f0b64a;--amberbg:rgba(120,53,15,.36);
  --blue:#6d9bf5;--bluebg:rgba(30,58,138,.4);
  --purple:#a892f8;--purplebg:rgba(76,29,149,.4);
  --shadow:0 1px 2px rgba(0,0,0,.45),0 16px 36px -26px rgba(0,0,0,.9);
  --shadow-lift:0 2px 6px rgba(0,0,0,.5),0 26px 50px -28px rgba(0,0,0,1);
}

/* ── 2. الخلفية والطباعة ────────────────────────────────────────── */
body{background:#e9eef1;font-size:14.5px;line-height:1.55;letter-spacing:normal}
body::before{
  background:linear-gradient(180deg,#f5f8f9 0%,#eaeff2 55%,#e6ecef 100%);
  filter:none;
}
/* شبكة مخطط هندسية خفيفة — إشارة إلى عالم المباني والصيانة */
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(rgba(10,45,60,.045) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(10,45,60,.045) 1px,transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(120% 90% at 50% 0%,#000 30%,transparent 78%);
          mask-image:radial-gradient(120% 90% at 50% 0%,#000 30%,transparent 78%);
}
.dark body{background:#081319}
.dark body::before{background:linear-gradient(180deg,#0c1c25 0%,#091620 55%,#081319 100%)}
.dark body::after{background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
                                   linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px)}
/* العربية لا تقبل التباعد بين الحروف ولا الحروف الكبيرة — إزالتهما ترفع الوضوح فوراً */

  letter-spacing:normal;text-transform:none;
}
h1,h2,h3,.topbar .ttl,.stat .num,.brand-t{letter-spacing:-.3px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(90,120,138,.3);border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(90,120,138,.5);border:3px solid transparent;background-clip:content-box}

/* ── 3. عمود التنقّل: كتلة داكنة صلبة (العنصر البصري الأبرز) ──── */
.side{
  background:linear-gradient(196deg,var(--slab-1) 0%,var(--slab-2) 58%,#0b2029 100%);
  border:none;box-shadow:0 0 0 1px rgba(0,0,0,.35),18px 0 42px -34px rgba(4,20,28,.9);
  backdrop-filter:none;-webkit-backdrop-filter:none;
}
.brand{border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:6px}
.brand .logo{box-shadow:0 8px 20px -8px rgba(15,146,168,.7)}
.side .brand-t{color:#f2f8fa}
.side .brand-t small{color:#7d99a7;font-weight:600}
.side .slabel{color:#6d8b9a;font-size:10.5px;font-weight:700;padding:10px 12px 4px}
.side .sidediv{background:rgba(255,255,255,.08);box-shadow:none}
.side .nbtn{color:#a7c0cb;font-weight:600;font-size:13.5px;border-radius:11px}
.side .nbtn:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.06);color:#eaf4f7}
.side .nbtn .ic{opacity:.92;filter:none}
.side .nbtn.active{
  background:linear-gradient(135deg,#0f8296,#12a6bd);color:#fff;font-weight:700;
  box-shadow:0 12px 26px -14px rgba(18,166,189,.95);
}
.side .nbtn.active .ic{opacity:1}
/* حذف لمعة التمرير المتحركة — ضجيج بصري بلا معنى */
.nbtn::before{display:none!important}
.side .nbtn:hover{transform:none}
body[dir="rtl"] .side .nbtn:hover{transform:none}
.side .nbtn:hover .ic{transform:none}
.navglide{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.08);left:10px;right:10px}
.dark .navglide{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.08)}
.side .ucard{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1);border-radius:12px}
.side .ucard .nm{color:#eef6f8}
.side .ucard .rl{color:#89a5b2}
.side .ucard .av{box-shadow:0 6px 16px -8px rgba(0,0,0,.8)}
.side .sideacts button.btn.ghost{
  background:rgba(255,255,255,.07);color:#cfe2e9;border:1px solid rgba(255,255,255,.1);box-shadow:none;
}
.side .sideacts button.btn.ghost:hover{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.2)}
.side .cmpchip{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1);color:#e3eef2}
.side .cmpchip small{color:#8aa6b3}
.side select{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12);color:#e7f1f5}
.side select option{background:#12242f;color:#e7f1f5}

/* ── 4. الشريط العلوي ──────────────────────────────────────────── */
.topbar{
  background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 1px 2px rgba(10,35,45,.05),0 12px 28px -24px rgba(10,35,45,.5);
  backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);
}
.dark .topbar{background:rgba(16,32,42,.86);border-color:rgba(255,255,255,.08)}
.topbar .ttl{font-size:17px;font-weight:800}
.topbar .pname{
  background:var(--brand-soft);color:var(--brand);box-shadow:none;
  border:1px solid rgba(13,110,128,.16);font-size:11.5px;padding:3px 9px;border-radius:8px;
}
.dark .topbar .pname{border-color:rgba(51,191,212,.25)}
.topbar .meta{font-weight:600}
.topbar .asw{background:var(--s2);border-color:var(--line);border-radius:11px}
.topbar .asw:hover{background:var(--s3);border-color:rgba(13,110,128,.35);transform:none}
.bell{background:var(--s2);border-color:var(--line);border-radius:10px}
.bell:hover{background:var(--s3);transform:none}
.bellb{box-shadow:none;font-weight:700;padding:1px 5px}
footer{color:#93a7b3;font-size:11.5px;padding-top:22px}

/* ── 5. البطاقات والمؤشرات ─────────────────────────────────────── */
.card,.stat,.pillar,.mkt-provider,.mkt-rfq,.mkt-kpi,.login-card{
  background:var(--glass-hi);border:1px solid var(--line);box-shadow:var(--shadow);
  backdrop-filter:none;-webkit-backdrop-filter:none;
}
.card{border-radius:var(--r)}
.card h2{
  font-size:15.5px;font-weight:800;padding-bottom:11px;margin-bottom:13px;
  border-bottom:1px solid var(--line-soft);
}
.stat{border-radius:13px;position:relative;overflow:hidden;transition:box-shadow .2s,transform .2s}
.stat::before{
  content:"";position:absolute;top:0;bottom:0;inset-inline-start:0;width:3px;background:var(--brand);
}
.stat.warn::before{background:var(--red)}
.stat.ok::before{background:var(--green)}
.stat:hover{transform:none;box-shadow:var(--shadow-lift)}
.stat.kpi:hover{transform:translateY(-2px)}
.stat .num{font-size:27px;font-weight:800;letter-spacing:-1px}
.stat .lbl{font-size:11.5px;font-weight:600;color:var(--muted);margin-top:4px}
.kpi .kico{opacity:.55}
.trend{font-weight:700;border-radius:7px;padding:2px 8px}
.trend.flat{background:var(--s2);color:var(--muted)}
.pillar:hover,.mkt-provider:hover{transform:none;box-shadow:var(--shadow-lift)}
.mkt-kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.pkpi,.netline,.pmrow,.taskrow,.ckrow,.mkt-bid,.swrow,.onb-card,.onb-step,.mkt-role-card,.cmpcard{
  background:var(--s2);border-color:var(--line);
}
.pkpi{border-radius:10px}
.hbar .hb,.legend .li:hover{background:var(--s3)}
.hbar .hb i{border-radius:7px}
.donut .hole{background:var(--glass-hi)}
.hub-badge{background:var(--brand-soft);border-color:rgba(13,110,128,.18);font-weight:700}
.swrow:hover,.onb-card:hover,.onb-step:hover,.cmpcard:hover,.mkt-role-card:hover{
  background:var(--s3);border-color:rgba(13,110,128,.35);
}
.onb-card:hover,.mkt-role-card:hover,.cmpcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.alrow:hover{background:var(--s2)}
.mkt-tag,.mkt-role-pts{background:var(--brand-soft);border-color:rgba(13,110,128,.18)}

/* ── 6. الجداول ────────────────────────────────────────────────── */
table{font-size:13.5px}
th{
  background:var(--s2);color:var(--muted);font-size:11.5px;font-weight:700;
  padding:10px 11px;border-bottom:1px solid var(--line);
}
.dark th,.dark table th{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.1)}
td{padding:11px;border-bottom:1px solid var(--line-soft)}
tr:hover td{background:var(--s2)}
.tbl-wrap{border-radius:12px;border:1px solid var(--line-soft)}
.dark .tbl-wrap{border-color:rgba(255,255,255,.07)}
.overdue td{background:var(--redbg)!important}

/* ── 7. الحالات والأزرار والحقول ───────────────────────────────── */
.badge{
  border:none;box-shadow:none;border-radius:7px;padding:3px 9px;font-weight:700;font-size:11px;
}
.b-urgent{background:var(--red);color:#fff;box-shadow:none}
.b-down{background:var(--red);color:#fff}
.b-normal{background:var(--s3);color:var(--muted)}
.b-low{background:var(--s3);color:var(--muted)}   /* كانت حمراء كالعاجل — تصحيح دلالي */
.mkt-pill{border-color:transparent}
.chip{background:var(--glass-hi);border-color:var(--line);color:var(--muted);font-weight:600}
.chip:hover{background:var(--s3);color:var(--ink);border-color:rgba(13,110,128,.3)}
.chip.on{background:var(--brand);color:#fff;box-shadow:0 8px 18px -12px rgba(13,110,128,.9)}
button.btn{
  border-radius:10px;font-weight:700;
  background:linear-gradient(180deg,var(--brand-2),var(--brand));
  box-shadow:0 1px 1px rgba(10,35,45,.12),0 10px 20px -14px rgba(13,110,128,.95);
}
button.btn:hover{transform:translateY(-1px);box-shadow:0 2px 3px rgba(10,35,45,.14),0 14px 26px -14px rgba(13,110,128,1);filter:none}
button.btn.ghost{background:var(--glass-hi);border:1px solid var(--line);color:var(--ink);box-shadow:none}
button.btn.ghost:hover{background:var(--s3);border-color:rgba(13,110,128,.4);color:var(--brand)}
button.btn.danger{background:var(--glass-hi);border-color:rgba(201,65,65,.35);color:var(--red)}
button.btn.sm{border-radius:8px;padding:5px 10px}
.dark button.btn.ghost{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12)}
input,select,textarea{
  border:1px solid #cdd9df;border-radius:10px;background:var(--glass-hi);
  padding:9px 12px;font-size:13.5px;backdrop-filter:none;-webkit-backdrop-filter:none;
}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px var(--brand-soft);border-color:var(--brand)}
textarea{min-height:82px;line-height:1.7}
input[type=checkbox]{transform:scale(1.1)}
label{font-size:11.5px;font-weight:700;color:var(--muted);margin:10px 0 5px}
.searchbar{max-width:340px}

/* ── 8. النوافذ والتنبيهات ─────────────────────────────────────── */
.modal-bg{background:rgba(8,26,35,.55);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.modal{
  background:var(--glass-hi);border:1px solid var(--line);border-radius:18px;padding:24px;
  box-shadow:0 40px 90px -34px rgba(4,26,36,.6);
  backdrop-filter:none;-webkit-backdrop-filter:none;
}
.dark .modal{background:#122430;border-color:rgba(255,255,255,.1)}
.modal h3{font-size:18px;font-weight:800}
.fsec{
  border-top:1px solid var(--line-soft);color:var(--brand);font-weight:700;
  display:flex;align-items:center;gap:7px;
}
.fsec::before{content:"";width:5px;height:5px;border-radius:2px;background:var(--brand);flex:0 0 auto}
.fsec:first-of-type::before{display:inline-block}
.toast{
  background:#0f232e;border:1px solid rgba(255,255,255,.12);border-radius:12px;
  box-shadow:0 20px 44px -18px rgba(0,0,0,.6);font-weight:600;
}
.toast.ok{background:#0e6b4e}.toast.err{background:#a83232}
.empty,.mkt-empty{font-style:normal;color:var(--muted);font-size:13px;padding:26px}

/* ── 9. الرسوم البيانية ────────────────────────────────────────── */
.bar{height:8px;border-radius:99px;box-shadow:none}
.bar.red,.bar.grn{box-shadow:none}
.mbar{border-radius:8px;box-shadow:none}
.mcol:hover .mbar{transform:translateY(-2px);filter:none;box-shadow:0 10px 20px -12px rgba(10,35,45,.6)}
.mini-bar{border-radius:7px}
.fcol .fbars i{border-radius:5px}
.legend .dot{box-shadow:none;border-radius:3px}

/* ── 10. شاشة الدخول ──────────────────────────────────────────── */
.auth-wrapper{background:#f7fafb}
.auth-form-side{background:linear-gradient(180deg,#fdfefe,#f4f8f9)}
.dark .auth-form-side{background:linear-gradient(180deg,#0c1c25,#081319)}
.auth-card{border-radius:20px;box-shadow:0 1px 3px rgba(10,35,45,.06),0 28px 60px -34px rgba(10,35,45,.5),0 0 0 1px var(--line)}
.auth-title{font-size:26px;letter-spacing:-.4px}
.auth-sub{font-size:13px;line-height:1.7}
.auth-hero-side{background:linear-gradient(200deg,#0a2530 0%,#0c5e6f 52%,#08202a 100%)}
.auth-hero-side::before{
  background:radial-gradient(circle at 78% 18%,rgba(70,214,234,.22) 0%,transparent 52%),
             radial-gradient(circle at 18% 84%,rgba(13,110,128,.4) 0%,transparent 60%);
}
/* شبكة مخطط بدل النقاط — أقرب لمجال إدارة المباني */
.auth-hero-side::after{
  background-image:linear-gradient(rgba(255,255,255,.075) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.075) 1px,transparent 1px);
  background-size:46px 46px;opacity:1;
  -webkit-mask-image:radial-gradient(100% 80% at 70% 20%,#000 20%,transparent 85%);
          mask-image:radial-gradient(100% 80% at 70% 20%,#000 20%,transparent 85%);
}
.hero-headline{font-size:31px;line-height:1.55;text-shadow:none}
.hero-quote-card,.feature-item{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.16);border-radius:14px}
.feature-item:hover{background:rgba(255,255,255,.15)}
.input-icon-wrap input{border-width:1px;border-color:#cdd9df;border-radius:11px;padding-block:11px}
.input-icon-wrap input:focus{box-shadow:0 0 0 3px var(--brand-soft)}
.btn-login{border-radius:12px;background:linear-gradient(180deg,#0f92a8,#0c6675);box-shadow:0 12px 24px -14px rgba(13,110,128,.95)}
.btn-login:hover{filter:none;box-shadow:0 16px 30px -14px rgba(13,110,128,1)}
.btn-google{border-width:1px;border-radius:12px}
.demo-accounts{border-style:solid;border-color:var(--line);background:var(--s2);border-radius:12px}
.demo-chip{border-radius:8px;border-color:var(--line)}
.demo-chip:hover{background:var(--brand);border-color:var(--brand)}

/* ── 12. تباين الوضع الليلي ────────────────────────────────────── */
.dark button.btn{background:linear-gradient(180deg,#178da2,#0f6b7c);color:#f2fbfd;
  box-shadow:0 1px 1px rgba(0,0,0,.4),0 12px 24px -16px rgba(0,0,0,.9)}
.dark button.btn:hover{box-shadow:0 2px 4px rgba(0,0,0,.45),0 16px 30px -16px rgba(0,0,0,1)}
.dark .chip.on{background:#137f93;color:#f2fbfd}
.dark .b-urgent,.dark .b-down{background:#b23a3a;color:#fff}
.dark .stat::before{opacity:.9}
.dark .topbar .asw,.dark .bell{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1)}
.dark .topbar .asw:hover,.dark .bell:hover{background:rgba(255,255,255,.12)}
.dark .demo-accounts{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.1)}
.dark .auth-hero-side{background:linear-gradient(200deg,#07202a 0%,#0a4f5e 52%,#061820 100%)}
.dark footer{color:#6d8794}

/* ── 11. تفاصيل سطح المكتب ─────────────────────────────────────── */
@media(min-width:761px){
  .side{margin:0;border-radius:0;top:0;height:100vh}
  .content{padding:16px 22px 28px}
  .topbar{padding:12px 16px;margin-bottom:16px}
  .card{padding:18px;margin-bottom:16px}
  .stat{padding:16px 16px 14px}
  .stats{gap:14px}
}
@media(min-width:1181px){
  .side{flex:0 0 252px;padding:20px 12px 16px}
  .side .nbtn{min-height:42px}
}
/* الهاتف: شريط سفلي داكن متّسق مع العمود */
@media(max-width:760px){
  .side{border-radius:16px 16px 0 0;box-shadow:0 -12px 34px rgba(4,20,28,.4)}
  .side .nbtn{color:#a7c0cb}
  .content{padding:10px 10px 104px}
  .card h2{padding-bottom:9px;margin-bottom:11px}
  .toast{bottom:96px;left:12px;right:12px;transform:translateY(8px);max-width:none;
    white-space:normal;text-align:center}
  .toast.show{transform:translateY(0)}
}
@media print{
  body::after{display:none!important}
  .card,.stat{border:1px solid #d5dde1!important}
  th{background:#f2f5f6!important}
}

const API_BASE = (window.location.protocol === 'file:') ? 'http://localhost:3000/api' : '/api';

async function api(pathname,opts={}){
  const headers=Object.assign({'Content-Type':'application/json'},AUTH.csrf?{'X-CSRF-Token':AUTH.csrf}: {}, opts.headers||{});

    if(!msg||/Script error/.test(msg))return;
    fetch(API_BASE+'/client-errors',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({msg,url:String(location.pathname||'/').slice(0,100)})}).catch(()=>{});

function normPhone(p){let d=String(p||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('0'))d='966'+d.slice(1);return d;}
function woMsg(w){
  const L=db.lang==='ar';
  const cmp=db.compounds.find(c=>c.id===w.compoundId)||{};
  return (L?' *بلاغ صيانة جديد*\n':' *New Maintenance Report*\n')
   +(L?'الرقم: ':'No.: ')+w.no+'\n'
   +(L?'المجمع: ':'Compound: ')+(cmp.name||'—')+'\n'
   +(L?'الموقع: ':'Location: ')+(w.bname||'—')+'\n'
   +(w.assetName?((L?'الأصل: ':'Asset: ')+w.assetName+'\n'):'')
   +(L?'العطل: ':'Issue: ')+w.title+'\n'
   +(L?'الأولوية: ':'Priority: ')+(PRIO[w.priority]||w.priority)+'\n'
   +(L?'موعد الاستحقاق: ':'Due: ')+fmtD(w.dueDate)+'\n'
   +(L?'الرجاء التوجه لتنفيذ البلاغ في أقرب وقت. شكراً.':'Please attend to this report at your earliest convenience. Thank you.');
}
function openWhatsApp(w){

  const url='https://wa.me/'+ph+'?text='+encodeURIComponent(woMsg(w));

const PH={};let _phSeq=0;
function phReg(d){const k='K'+(++_phSeq);PH[k]=d;return k;}
function lbShow(k){if(!PH[k])return;
  modal(`<img src="${PH[k]}" style="width:100%;max-height:78vh;object-fit:contain;border-radius:12px;background:#fff">`);}
function compressImg(file){return new Promise(res=>{
  const r=new FileReader();
  r.onload=e=>{const img=new Image();
    img.onload=()=>{const max=1000;let w=img.width,h=img.height;
      if(w>max||h>max){const k=Math.min(max/w,max/h);w=Math.round(w*k);h=Math.round(h*k);}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      const webp=cv.toDataURL('image/webp',0.72);
      res(webp.indexOf('image/webp')===5?webp:cv.toDataURL('image/jpeg',0.72));};
    img.onerror=()=>res(null);
    img.src=e.target.result;};
  r.readAsDataURL(file);});}
function pickImages(cb){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.multiple=true;
  inp.onchange=async()=>{const out=[];toast(lb(' جارٍ معالجة الصور…|| Processing photos…'));
    for(const f of inp.files){const d=await compressImg(f);if(d)out.push({d,n:''});}
    if(out.length)cb(out);};
  inp.click();}
function demoImg(txt,c1,c2){const cv=document.createElement('canvas');cv.width=640;cv.height=420;
  const g=cv.getContext('2d');const gr=g.createLinearGradient(0,0,640,420);
  gr.addColorStop(0,c1);gr.addColorStop(1,c2);g.fillStyle=gr;g.fillRect(0,0,640,420);
  g.fillStyle='rgba(255,255,255,.93)';g.font='bold 32px Segoe UI';g.textAlign='center';
  g.fillText(txt,320,218);return cv.toDataURL('image/jpeg',.8);}
function initSig(){
  const cv=$('sigpad');if(!cv||cv._init||typeof cv.getContext!=='function')return;cv._init=true;
  const ctx=cv.getContext('2d');ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#132430';
  let dr=false;
  const pos=e=>{const r=cv.getBoundingClientRect();
    return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height];};
  cv.addEventListener('pointerdown',e=>{dr=true;const p=pos(e);
    ctx.beginPath();ctx.moveTo(p[0],p[1]);
    if(cv.setPointerCapture)try{cv.setPointerCapture(e.pointerId);}catch(x){}e.preventDefault();});
  cv.addEventListener('pointermove',e=>{if(!dr)return;const p=pos(e);ctx.lineTo(p[0],p[1]);ctx.stroke();});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>cv.addEventListener(ev,()=>{dr=false;}));}
function sigClear(){const cv=$('sigpad');if(cv&&typeof cv.getContext==='function')cv.getContext('2d').clearRect(0,0,cv.width,cv.height);}
function sigHasInk(){const cv=$('sigpad');if(!cv)return false;
  try{const d=cv.getContext('2d').getImageData(0,0,cv.width,cv.height).data;
    for(let i=3;i<d.length;i+=4)if(d[i]>0)return true;}catch(e){}
  return false;}
function phTmpHTML(arr,key){return arr.map((p,i)=>
  `<span class="phwrap"><img class="pthumb" loading="lazy" src="${p.d}" onclick="lbShow('${phReg(p.d)}')">
  <button type="button" class="phdel" onclick="phTmpDel('${key}',${i})">${ic('x',12)}</button></span>`).join('')
  ||`<span class="muted">${lb('لا صور بعد||No photos yet')}</span>`;}
function phTmpDel(key,i){const arr=key==='b'?window._woPhB:key==='a'?window._woPhA:window._faPh;
  if(arr){arr.splice(i,1);}
  if(key==='b'||key==='a')renderWoPhGrids();else renderFaPhotos();}
function renderWoPhGrids(){
  if($('wpg_b'))$('wpg_b').innerHTML=phTmpHTML(window._woPhB,'b');

function woAddPhotos(tag){pickImages(imgs=>{

/* ===== PERSIST (HYBRID: LOCAL + SERVER) ===== */
function persist(){
  try{if(db)localStorage.setItem('cmms_data',JSON.stringify(db));}catch(e){}
  clearTimeout(persist._t);persist._t=setTimeout(async()=>{
    try{
      const r=await api('/state',{method:'POST',body:JSON.stringify({baseVer:AUTH.ver,data:db})});
      if(r.status===409){
        const s=await(await api('/state')).json();
        AUTH.ver=s.ver;db=s.data;
        try{localStorage.setItem('cmms_data',JSON.stringify(db));}catch(e){}
        toast(lb(' حدّث مستخدم آخر البيانات — حُمّلت النسخة الأحدث|| Data updated by another user — latest loaded'),'err');
        render();return;
      }
      const j=await r.json();AUTH.ver=j.ver;
    }catch(e){}
  },400);
}

function migrate(d){
  if(!d.ver||d.ver<2){
    d.ver=2;
    ['pms','suppliers','prs','pos'].forEach(k=>{if(!d[k])d[k]=[];});
    if(d.prSeq==null)d.prSeq=0;if(d.poSeq==null)d.poSeq=0;if(d.rnSeq==null)d.rnSeq=0;
    d.users.forEach(u=>{if(u.role==='manager'){u.role=(u.u==='admin')?'admin':'engineer';}});
    [['eng','مهندس العمليات','engineer'],['sitemgr','مدير الموقع','sitemgr'],
     ['store','مسؤول المخزون','store'],['proc','مسؤول المشتريات','proc']]
     .forEach(a=>{if(!d.users.some(x=>x.u===a[0]))d.users.push({id:uid('U'),u:a[0],p:'1234',defaultPw:true,name:a[1],role:a[2]});});
  }
  if(d.ver<3){
    d.ver=3;
    ['projects','employees','shifts','notifs'].forEach(k=>{if(!d[k])d[k]=[];});
    if(d.prjSeq==null)d.prjSeq=0;
    d.wos.forEach(w=>{if(w.projectId==null)w.projectId='';});
    d.pos.forEach(po=>{if(po.projectId==null)po.projectId='';});
  }
  if(d.ver<4){
    d.ver=4;
    ['units','tenants','contracts'].forEach(k=>{if(!d[k])d[k]=[];});
    if(d.ctSeq==null)d.ctSeq=0;
    d.buildings.forEach(b=>{if(!b.type)b.type='villa';});
    d.wos.forEach(w=>{if(w.unitId==null)w.unitId='';if(w.unitCode==null)w.unitCode='';if(w.tenantName==null)w.tenantName='';});
  }
  if(d.ver<5){
    d.ver=5;
    d.assets.forEach(a=>{if(!a.photos)a.photos=[];});
    d.wos.forEach(w=>{if(!w.photos)w.photos=[];if(w.sig==null)w.sig='';});
  }
  if(d.ver<6){
    d.ver=6;
    if(!d.compounds)d.compounds=[];
    if(!d.compounds.length)
      d.compounds.push({id:uid('C'),name:'مجمع الخير السكني - حي الروضة',loc:'',notes:'',createdAt:Date.now()});
    const def=d.compounds[0].id;
    d.buildings.forEach(b=>{if(!b.compoundId)b.compoundId=def;});
    d.assets.forEach(a=>{if(!a.compoundId){
      const b=d.buildings.find(x=>x.id===a.building);
      a.compoundId=b?b.compoundId:def;}});
    d.wos.forEach(w=>{if(!w.compoundId){
      const a=d.assets.find(x=>x.id===w.assetId);
      const b=a?d.buildings.find(x=>x.id===a.building):null;
      w.compoundId=b?b.compoundId:def;}});
    d.pms.forEach(p=>{if(!p.compoundId){
      const a=d.assets.find(x=>x.id===p.assetId);
      p.compoundId=a?a.compoundId:def;}});
    d.projects.forEach(p=>{if(!p.compoundId)p.compoundId=def;});
    d.contracts.forEach(c=>{if(!c.compoundId)c.compoundId=def;});
    d.employees.forEach(e=>{if(!e.compoundId)e.compoundId=def;});
    d.users.forEach(u=>{
      if(u.phone==null)u.phone='';
      if(!u.cmpIds)u.cmpIds=(u.role==='admin')?[]:[def];
      if(u.activeCmp==null)u.activeCmp='';
    });
  }
  /* ===== v7: عزل كامل لكل أصل — المخزون والمشتريات والموردون والحركات والمستخدمون ===== */
  if(d.ver<7){
    d.ver=7;
    ['compounds','buildings','units','tenants','contracts','assets','wos','inv','moves','pms','suppliers',
     'prs','pos','projects','employees','shifts','notifs'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[];});
    const defC=(d.compounds[0]||{}).id||'';
    /* خريطة مقدّم الطلب → أصله — تُبنى قبل فصل الحسابات وإلا تكرّرت الأسماء واختلط الإسناد */
    const userCmp={};
    (d.users||[]).forEach(u=>{
      if(u.role==='admin'||userCmp[u.name])return;
      const ids=(u.cmpIds||[]).filter(id=>d.compounds.some(c=>c.id===id));
      if(ids.length===1)userCmp[u.name]=ids[0];
      else if(ids.length>1)userCmp[u.name]=ids.includes(u.activeCmp)?u.activeCmp:ids[0];
    });
    /* (1) المستخدمون: حساب مستقل لكل أصل — المدير يملك كل الأصول ويبدّل من الهيدر */
    const taken=new Set((d.users||[]).map(u=>String(u.u||'').toLowerCase()));
    const splitRows=[],extraUsers=[];
    (d.users||[]).forEach(u=>{
      if(u.role==='admin')return;
      const ids=[...new Set((u.cmpIds||[]).filter(id=>d.compounds.some(c=>c.id===id)))];
      if(ids.length<=1){
        u.cmpIds=ids.length?ids:(defC?[defC]:[]);
        if(!u.cmpIds.includes(u.activeCmp))u.activeCmp=u.cmpIds[0]||'';
        return;
      }
      const first=ids[0];
      u.cmpIds=[first];u.activeCmp=first;
      ids.slice(1).forEach(cid=>{
        const base=String(u.u||'user');
        let n=2,un=base+'-'+n;
        while(taken.has(un.toLowerCase())){n++;un=base+'-'+n;}
        taken.add(un.toLowerCase());
        const cName=(d.compounds.find(c=>c.id===cid)||{}).name||'';
        extraUsers.push(Object.assign({},u,{id:uid('U'),u:un,cmpIds:[cid],activeCmp:cid}));
        splitRows.push({name:u.name,user:un,cmp:cName});
      });
    });
    extraUsers.forEach(u=>d.users.push(u));
    if(splitRows.length)d.splitReport=splitRows;
    /* (2) استنتاج الأصل من السجلات المرتبطة، ثم الأصل الأساسي لما تبقّى */
    const invById={},invByName={};
    d.inv.forEach(i=>{invById[i.id]=i;if(!invByName[i.name])invByName[i.name]=i;});
    d.pos.forEach(po=>{                                    /* أمر شراء ← طلب الشراء / المشروع */
      if(po.compoundId)return;
      const pr=d.prs.find(p=>p.id===po.prId),pj=d.projects.find(p=>p.id===po.projectId);
      po.compoundId=(pr&&pr.compoundId)||(pj&&pj.compoundId)||'';});
    d.prs.forEach(pr=>{                                    /* طلب شراء ← مقدّم الطلب / أصنافه */
      if(pr.compoundId)return;
      let c=userCmp[pr.by]||'';
      if(!c)(pr.items||[]).some(it=>{const iv=(it.invId&&invById[it.invId])||invByName[it.desc];
        if(iv&&iv.compoundId){c=iv.compoundId;return true;}return false;});
      pr.compoundId=c;});
    const woByNo={},poByInvNo={};                           /* حركة مخزون ← مرجع أمر شغل / فاتورة */
    d.wos.forEach(w=>{woByNo[w.no]=w;});
    d.pos.forEach(po=>{if(po.invoice&&po.invoice.no)poByInvNo[po.invoice.no]=po;});
    d.moves.forEach(mv=>{
      if(mv.compoundId)return;
      const wo=woByNo[mv.ref],po=poByInvNo[mv.ref];
      mv.compoundId=(wo&&wo.compoundId)||(po&&po.compoundId)||'';});
    d.inv.forEach(it=>{                                     /* صنف ← حركاته */
      if(it.compoundId)return;
      const hit=d.moves.find(m=>(m.invId===it.id||m.item===it.name)&&m.compoundId);
      it.compoundId=hit?hit.compoundId:'';});
    d.moves.forEach(mv=>{                                   /* حركة ← صنفها */
      if(mv.compoundId)return;
      const it=(mv.invId&&invById[mv.invId])||invByName[mv.item];
      mv.compoundId=(it&&it.compoundId)||'';});
    d.suppliers.forEach(s=>{                                /* مورد ← أوامر الشراء المسجّل بها */
      const po=d.pos.find(p=>p.supplier===s.name&&p.compoundId);
      s.compoundId=(po&&po.compoundId)||'';});
    ['inv','prs','pos','moves','suppliers','notifs'].forEach(k=>{
      d[k].forEach(r=>{if(!r.compoundId)r.compoundId=defC;});});
  }
  /* ---- v8: السوق — منصة الملاك والمقدّمين (providers + rfqs) ---- */
  if(d.ver<8){
    d.ver=8;
    if(!Array.isArray(d.providers))d.providers=[];
    if(!Array.isArray(d.rfqs))d.rfqs=[];
    if(d.rfqSeq==null)d.rfqSeq=0;
  }
  /* ---- v9: تصحيح تصنيف الأصول القديمة (مصنع / أسطول) من الاسم ---- */
  if(d.ver<9){
    d.ver=9;
    const FACTORY=/(مصنع|منشأة صناعية|منشأه صناعية|معمل|ورشة|مشغل|صناعي|صناعية|إنتاج|انتاج|مصفاة|تعبئة|خط إنتاج)/;
    const FLEET=/(أسطول|سيارات|سيارة|مركبات|مركبة|شاحن|شاحنات|نقل|مقطورات|كرينات|أوناش)/;
    d.compounds.forEach(c=>{
      const nm=String(c.name||'');
      const hasRE=(d.buildings||[]).some(b=>b.compoundId===c.id)||
        (d.units||[]).some(u=>{const b=(d.buildings||[]).find(x=>x.id===u.buildingId);return b&&b.compoundId===c.id;});
      if(!c.kind){
        c.kind=FACTORY.test(nm)?'factory':FLEET.test(nm)?'vehicles':'property';
      }else if((c.kind==='property'||c.kind==='residentialBuilding')&&!hasRE){
        if(FACTORY.test(nm))c.kind='factory';
        else if(FLEET.test(nm))c.kind='vehicles';
      }
    });
  }
  /* ---- v10: قوالب الصيانة الوقائية القابلة لإعادة الاستخدام (مع الإصدارات) ---- */
  if(d.ver<10){
    d.ver=10;
    if(!Array.isArray(d.pmTemplates))d.pmTemplates=[];
  }
  /* ---- v11: سجل التدقيق (append-only) + حقول الأصل الإضافية ---- */
  if(d.ver<11){
    d.ver=11;
    if(!Array.isArray(d.audit))d.audit=[];
  }
  /* ---- v12: طبقة المؤسسة (Organization) فوق المواقع ---- */
  if(d.ver<12){
    d.ver=12;
    if(!Array.isArray(d.orgs))d.orgs=[];
    (d.compounds||[]).forEach(c=>{if(c.orgId==null)c.orgId='';});
  }
  /* ---- شبكة أمان تُنفَّذ دائماً (حتى مع أحدث ver) لضمان بيانات قابلة للاستخدام ---- */
  ['compounds','buildings','units','tenants','contracts','assets','wos','inv','moves','pms',
   'suppliers','prs','pos','projects','employees','shifts','notifs','fuelLogs','utilityLogs','certs','providers','rfqs','pmTemplates','audit','orgs']
   .forEach(k=>{if(!Array.isArray(d[k]))d[k]=[];});
  ['seq','prSeq','poSeq','rnSeq','prjSeq','ctSeq','rfqSeq'].forEach(k=>{if(d[k]==null)d[k]=0;});
  if(typeof d.lang!=='string')d.lang='ar';
  if(!d.compounds.length)
    d.compounds.push({id:uid('C'),name:'مجمع الخير السكني - حي الروضة',loc:'',notes:'',createdAt:Date.now()});
  /* العقارات القديمة بلا مالك تُنسب لأول مدير (خصوصية الحسابات) */
  const firstAdm=(d.users.find(u=>u.role==='admin')||{}).id||'';
  d.compounds.forEach(c=>{if(!c.ownerId)c.ownerId=firstAdm;if(!c.kind)c.kind='property';});
  if(!Array.isArray(d.categories))d.categories=[];
  ['سيارات','معدات'].forEach(x=>{if(!d.categories.includes(x))d.categories.push(x);});
  const defC=d.compounds[0].id;
  d.users.forEach(u=>{
    if(u.phone==null)u.phone='';
    if(u.email==null)u.email='';
    if(!Array.isArray(u.cmpIds))u.cmpIds=(u.role==='admin')?[]:[defC];
    if(u.role!=='admin'&&!['owner','contractor','supplier'].includes(u.role)&&!u.cmpIds.some(x=>d.compounds.some(c=>c.id===x)))
      u.cmpIds=d.compounds.map(c=>c.id);
    if(u.activeCmp==null)u.activeCmp='';
  });
  d.units.forEach(u=>{
    if(u.st==='vacant')u.st='auto';
    if(u.parentId==null)u.parentId='';
    if(u.subdivided==null)u.subdivided=false;
    if(u.rooms==null)u.rooms=0;
    if(u.baths==null)u.baths=0;
    if(u.rent==null)u.rent=0;
  });
  return d;
}

/* ===== BOOT (SERVER) ===== */
async function boot(){
  try{
    const r=await api('/state');
    if(r.status===401){AUTH.csrf='';AUTH.mustChange=false;db=freshDb();db=migrate(db);return;}
    const j=await r.json();
    if(j.data){
      db=j.data;AUTH.ver=j.ver;
      if(j.marketplace){ me = { id:j.userId, role:j.role, name:(j.data.users[0]||{}).name||'' }; await marketBootstrap(); return; }
      db=migrate(db);
      me=db.users.find(x=>x.id===j.userId)||null;
      if(me){const L=myCmps();if(!L.length)me=null;else if(!me.activeCmp||!L.some(c=>c.id===me.activeCmp))me.activeCmp=L[0].id;}
    } else {db=freshDb();db=migrate(db);}
  }catch(e){db=freshDb();db=migrate(db);}
}

/* التحقق من كلمة المرور محلياً (وضع عدم الاتصال): يدعم المشفّرة pbkdf2$ والنص القديم */
async function verifyLocalPw(pw, stored){
  if(typeof stored !== 'string' || stored.indexOf('pbkdf2$') !== 0)
    return String(stored) === String(pw);
  try{
    if(!window.crypto || !crypto.subtle) return false;
    const parts = stored.split('$');
    const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0)).buffer;
    const mat = await crypto.subtle.importKey('raw', new TextEncoder().encode(String(pw)), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:b64(parts[2]), iterations:Number(parts[1])}, mat, 256);
    const got = btoa(String.fromCharCode.apply(null, new Uint8Array(bits)));
    return got === parts[3];
  }catch(e){ return false; }
}
async function doLogin(e){
  e.preventDefault();
  const rawU = ($('lu').value||'').trim();
  const u = rawU.includes('@') ? rawU.split('@')[0].toLowerCase() : rawU.toLowerCase();
  const p = $('lp').value;
  let serverOk = false;

  try{
    const r = await fetch(API_BASE + '/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ u: rawU, p })
    });
    if(r.ok){
      const j = await r.json();
      AUTH.csrf = j.csrf || ''; AUTH.ver = j.ver; AUTH.mustChange = !!j.mustChange;
      const s = await(await api('/state')).json();
      db = s.data; AUTH.ver = s.ver;
      if(s.marketplace){ me = { id:j.userId, role:j.role, name:(s.data.users[0]||{}).name||'' }; await marketBootstrap(); render(); return; }
      db = migrate(db);
      me = db.users.find(x => x.id === j.userId) || null;
      serverOk = true;
    } else if(r.status === 401){
      return toast(lb(' اسم المستخدم أو كلمة المرور غير صحيحة|| Wrong username or password'), 'err');
    }
  }catch(netErr){/* server unreachable — fall back to local mode silently */}
    if(!serverOk){
    if(!db){ db = loadLocalDb(); db = migrate(db); }
    const rl = rawU.toLowerCase();
    let localUser = null;
    for(const x of (db.users||[])){
      const xu = String(x.u||'').toLowerCase();
      if(!(xu === rl || xu === u || (x.email && String(x.email).toLowerCase() === rl)))continue;
      if(await verifyLocalPw(p, x.p)){ localUser = x; break; }
    }
    if(!localUser){
      return toast(lb(' اسم المستخدم أو كلمة المرور غير صحيحة|| Wrong username or password'), 'err');
    }
    me = localUser;
    AUTH.csrf = '';
    if(isMarketRole()){ await marketBootstrap(); render(); return; }
  }

  if(!me){ AUTH.csrf = ''; return toast(lb(' حساب غير موجود|| Account not found'), 'err'); }
  if(isMarketRole()){ await marketBootstrap(); render(); return; }
  TAB = 'dash'; FILT = { assets: '', wos: '', inv: '', woStatus: 'all', procTab: 'pr', units: '' };
  const L = myCmps();
  if(!L.length){
    toast(lb(' لا توجد مجمعات مسندة لحسابك — راجع مدير النظام|| No compounds assigned — contact admin'), 'err');
    me = null; AUTH.csrf = ''; return;
  }
  /* ابدأ دائماً من شاشة العقارات، حتى لو كان للمستخدم عقار واحد فقط. */
  if(!me.activeCmp || !L.some(c=>c.id===me.activeCmp)) me.activeCmp = L[0].id;
  PICK = true;
  persist(); pmGen(); genSysNotifs(); render();
}
function genSysNotifs(){
  const act=activeCmp();
  db.wos.filter(w=>w.status!=='closed'&&w.priority==='urgent'&&w.compoundId===act&&(isTech()?w.assigneeId===me.id:true))
    .forEach(w=>notify('',lb('طارئ مفتوح: ||Open urgent: ')+w.title,'wos','urg-'+w.no));
  if(canAppr())db.wos.filter(w=>w.status==='planned'&&w.compoundId===act)
    .forEach(w=>notify('',lb('أمر مخطّط بانتظار الاعتماد: ||Planned WO awaiting approval: ')+w.no+' — '+w.title,'wos','plan-'+w.no));
  if(canAppr())db.wos.filter(w=>w.compoundId===act&&w.status==='closed'&&w.review==='pending')
    .forEach(w=>notify('',lb('أمر بانتظار المراجعة: ||WO awaiting review: ')+w.no+' — '+w.title,'wos','rev-'+w.no));
  db.wos.filter(w=>w.compoundId===act&&w.status!=='closed'&&w.status!=='planned'&&w.dueDate&&daysUntil(w.dueDate)<0)
    .forEach(w=>notify('',lb('أمر متأخر: ||WO overdue: ')+w.no+' ('+(-daysUntil(w.dueDate))+' '+lb('يوم||d')+')','wos','over-'+w.no));
  db.pms.filter(p=>p.compoundId===act).forEach(p=>{
    const d=daysUntil(nextDueOf(p));
    if(d<=0)notify('',lb('صيانة دورية متأخرة: ||Overdue PM: ')+p.name,'pm','pm-'+p.id+'-late');
    else if(d<=3)notify('',lb('صيانة قريبة: ||PM soon: ')+p.name+' ('+fmtD(nextDueOf(p))+')','pm','pm-'+p.id+'-soon');
  });
  db.inv.filter(it=>it.qty<=it.minQty&&it.compoundId===act).forEach(it=>
    notify('',lb('مخزون تحت الحد: ||Low stock: ')+it.name+' ('+it.qty+' '+it.unit+')','inv','low-'+it.id));
  if(canAppr())db.prs.filter(pr=>pr.status==='pending'&&pr.compoundId===act).forEach(pr=>
    notify('',lb('طلب شراء بانتظار الموافقة: ||PR awaiting approval: ')+pr.title+' ('+pr.no+')','proc','pr-'+pr.no));
  if(canAppr()){
    db.contracts.filter(c=>c.compoundId===act).forEach(c=>{const dd=daysUntil(c.end);
      if(dd<=30)notify('',(dd<0?lb('عقد منتهٍ: ||Expired contract: '):lb('عقد ينتهي قريباً: ||Contract expiring: '))+c.vendor+' ('+fmtD(c.end)+')','contracts','ctre-'+c.id+'-'+c.end);});
    db.tenants.forEach(x=>{const u=db.units.find(y=>y.id===x.unitId);
      const b=u?db.buildings.find(y=>y.id===u.buildingId):null;
      if(!b||b.compoundId!==act)return;
      const dd=daysUntil(x.leaseEnd);
      if(dd<=45)notify('',(dd<0?lb('عقد إيجار منتهٍ: ||Expired lease: '):lb('إيجار ينتهي قريباً: ||Lease expiring: '))+x.name+' ('+fmtD(x.leaseEnd)+')','units','lea-'+x.id+'-'+x.leaseEnd);});
  }
  /* تنبيهات انتهاء وثائق المركبات وشهادات الامتثال */
  db.assets.filter(a=>a.compoundId===act).forEach(a=>{
    [['insExp',lb('تأمين مركبة||Vehicle insurance')],['regExp',lb('استمارة مركبة||Vehicle registration')]].forEach(kv=>{
      const d=a[kv[0]];if(!d)return;const dd=daysUntil(d);
      if(dd<=45)notify('',(dd<0?lb('منتهٍ: ||Expired: '):lb('ينتهي قريباً: ||Expiring soon: '))+kv[1]+' — '+a.name+' ('+fmtD(d)+')','assets','veh-'+a.id+'-'+kv[0]+'-'+d);});});
  (db.certs||[]).filter(c=>c.compoundId===act).forEach(c=>{
    if(!c.expires)return;const dd=daysUntil(c.expires);
    if(dd<=45)notify('',(dd<0?lb('شهادة منتهية: ||Expired certificate: '):lb('شهادة تنتهي قريباً: ||Certificate expiring: '))+(CERTTL()[c.type||'other'])+' ('+fmtD(c.expires)+')','certs','cert-'+c.id+'-'+c.expires);});
  persist();
}

function KINDL(){return {property:lb('عقار||Property'),residentialBuilding:lb('مبنى سكني||Residential'),
  vehicles:lb('أسطول مركبات||Vehicle fleet'),factory:lb('مصنع / منشأة صناعية||Factory / Industrial'),
  other:lb('أملاك أخرى||Other assets')};}
function PTYPEL(){return {residential:lb('سكني||Residential'),commercial:lb('تجاري||Commercial'),admin:lb('إداري||Administrative'),mixed:lb('مختلط||Mixed'),complex:lb('مجمع||Complex')};}
/* ===== نطاق الأصل (Domain) — يحدد القائمة واللوحة والحقول ===== */
function domainOf(id){
  const c=(db&&db.compounds)?db.compounds.find(x=>x.id===(id||activeCmp())):null;
  const k=(c&&c.kind)||'property';
  if(k==='vehicles')return 'fleet';
  if(k==='factory')return 'industrial';
  if(k==='other')return 'generic';
  return 'realestate';
}
function domainMeta(d){
  const M={
    realestate:{k:'realestate',t:lb('إدارة العقارات||Real estate'),s:lb('وحدات ومستأجرون وعقود إيجار||Units · tenants · leases'),
      ic:'bldg',cls:'ic-bldg',col:'#0e7490'},
    fleet:{k:'fleet',t:lb('إدارة الأسطول||Fleet'),s:lb('مركبات · عدّاد · وقود · تأمين||Vehicles · odometer · fuel · insurance'),
      ic:'truck',cls:'ic-fleet',col:'#7c3aed'},
    industrial:{k:'industrial',t:lb('إدارة المنشأة الصناعية||Industrial'),s:lb('آلات ومعدات · مرافق · امتثال||Machinery · utilities · compliance'),
      ic:'factory',cls:'ic-ind',col:'#b45309'},
    generic:{k:'generic',t:lb('إدارة الأملاك الأخرى||Other assets'),s:lb('أصول ومعدات متنوعة||Miscellaneous assets'),
      ic:'layers',cls:'ic-gen',col:'#475569'}
  };
  return M[d]||M.realestate;
}
function domainNow(){return domainMeta(domainOf());}

}
