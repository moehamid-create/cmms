/* ===== PREVENTIVE MAINTENANCE ===== */
function intervalDays(p){const n=Math.max(1,+p.freqVal||1);return p.freqUnit==='days'?n:p.freqUnit==='weeks'?n*7:n*30;}
function nextDueOf(p){return p.nextDue||(p.lastDone?addDays(p.lastDone,intervalDays(p)):todayISO());}
/* المتبقي من العداد حتى الاستحقاق (null = لا يوجد محفّز عدّاد لهذه الخطة) */
function meterDueIn(p){
  if(!(p.mEvery>0))return null;
  const a=db.assets.find(x=>x.id===p.assetId);
  if(!a||a.meter==null||a.meter==='')return null;
  return ((p.lastMeter||0)+p.mEvery)-Number(a.meter);
}
function pmGen(){
  let created=0;
  db.pms.forEach(p=>{
    const md=meterDueIn(p);
    const timeDue=daysUntil(nextDueOf(p))<=0;
    const meterDue=(md!=null&&md<=0);
    if(timeDue||meterDue){
      const hasOpen=db.wos.some(w=>w.pmId===p.id&&w.status!=='closed');
      if(!hasOpen){
        db.seq++;const y=new Date().getFullYear();
        const ast=db.assets.find(a=>a.id===p.assetId)||{};
        if(meterDue&&ast&&ast.meter!=null&&ast.meter!=='')p.lastMeter=Number(ast.meter);
        db.wos.unshift({no:'WO-'+y+'-'+String(db.seq).padStart(4,'0'),type:'pm',pmId:p.id,compoundId:p.compoundId||activeCmp(),
          title:(db.lang==='ar'?'[صيانة دورية] ':'[PM] ')+p.name+(meterDue?' ':''),
          desc:p.tasks||'',assetId:p.assetId||'',assetName:ast?ast.name:'',
          bname:ast?bName(ast.building):'',
          priority:p.priority||'normal',status:(db.pmApproval!==false)?'planned':'open',approval:(db.pmApproval!==false)?'pending':'approved',auto:true,createdAt:Date.now(),startedAt:null,closedAt:null,projectId:'',
          unitId:'',unitCode:'',tenantName:'',
          dueDate:timeDue?nextDueOf(p):todayISO(),assigneeId:p.assigneeId||'',assigneeName:p.assigneeName||'',
          cost:0,closeNotes:'',parts:[],photos:[],sig:'',
          estMins:p.estMins||0,skills:p.skills||'',tools:p.tools||'',permits:p.permits||'',safety:p.safety||'',
          tplId:p.tplId||'',tplVersion:p.tplVersion||0,
          reqParts:(p.parts||[]).map(x=>({name:x.name,qty:x.qty})),
          reportedBy:lb('الجدولة التلقائية||Auto-scheduler'),
          checklist:(p.tasks||'').split('\n').map(s=>s.trim()).filter(Boolean).map(t=>({t,done:false,v:''}))});
        created++;
      }
    }
  });
  if(created)persist();
  return created;
}

function areaSystems(b){
  const n=(b&&b.name)||'', s=[];
  if(/مسبح|pool/i.test(n))s.push('pool_pump','water_treatment','jacuzzi');
  if(/جيم|gym|رياض/i.test(n))s.push('gym','hvac_split');
  if(/سبا|spa|ساونا|sauna/i.test(n))s.push('jacuzzi','hvac_split');
  if(/خدمات|service|مضخ|pump|كهرب|power/i.test(n))s.push('water_pump','generator','electrical');
  if(/باركن|park|garage|مواقف/i.test(n))s.push('lighting_out','fire_ext');
  if(/لوبي|lobby|مدخل|entrance|استقبال/i.test(n))s.push('hvac_central','lighting_in','fire_ext');
  if(/حديق|garden|ري|irrig|خارج|external/i.test(n))s.push('landscape','lighting_out');
  return [...new Set(s)];
}

function pmSmartGen(){
  const act=activeCmp();
  const blds=db.buildings.filter(b=>b.compoundId===act);
  if(!blds.length)return toast(lb('أضف مبانٍ أو مناطق أولاً||Add buildings or areas first'),'err');
  PMGEN={step:1,sel:{},sys:{},custom:[],aiState:'',aiNote:'',result:null};
  blds.forEach(b=>{PMGEN.sel[b.id]=true;});
  pmSyncSystems();
  pmGenRender();
}
function pmGroups(){
  const act=activeCmp();
  const sel=db.buildings.filter(b=>b.compoundId===act&&PMGEN.sel[b.id]);
  const groups=[],byType={};
  sel.forEach(b=>{
    const t=b.type||'area';
    if(t==='area')groups.push({key:'B:'+b.id,type:'area',name:b.name,buildingIds:[b.id]});
    else{(byType[t]=byType[t]||{key:'T:'+t,type:t,name:BTYPES[t]||t,buildingIds:[]}).buildingIds.push(b.id);}
  });
  Object.keys(byType).forEach(t=>groups.push(byType[t]));
  return groups;
}
function pmGroupDefaults(g){
  const o={};
  if(g.type==='area'){
    const b=db.buildings.find(x=>x.id===g.buildingIds[0])||{};
    areaSystems(b).forEach(k=>{if(PM_LIB[k])o[k]=PM_LIB[k].defQty;});
    ['lighting_out','civil','pest'].forEach(k=>{if(PM_LIB[k]&&o[k]==null)o[k]=1;});
  }else{
    (PM_BTYPE_SYS[g.type]||[]).forEach(k=>{if(PM_LIB[k])o[k]=PM_LIB[k].defQty;});
  }
  return o;
}
function pmSyncSystems(){
  PMGEN.sys=PMGEN.sys||{};
  pmGroups().forEach(g=>{if(!PMGEN.sys[g.key])PMGEN.sys[g.key]=pmGroupDefaults(g);});
}
function pmGenRender(){
  const bg=document.querySelector('.modal-bg'),m=document.querySelector('.modal');

function pmCustomDel(i){PMGEN.custom.splice(i,1);PMGEN.result=null;pmGenRender();}
function pmGenBuild(){
  const out=[];
  pmGroups().forEach(g=>{
    const sys=PMGEN.sys[g.key]||{};
    const keys=Object.keys(sys).filter(k=>sys[k]>0&&PM_LIB[k]);
    g.buildingIds.forEach(bid=>{
      const b=db.buildings.find(x=>x.id===bid)||{};
      keys.forEach(k=>{
        const L=PM_LIB[k],qty=Math.max(1,sys[k]|0);
        for(let i=1;i<=qty;i++)out.push({inc:true,sysKey:k,buildingId:bid,buildingName:b.name,buildingType:b.type,
          name:lb(L.asset.name)+(qty>1?' '+i:''),cat:L.asset.cat,
          plans:L.plans.map(p=>({inc:true,name:lb(p.name),fv:p.fv,fu:p.fu,tasks:p.tasks.map(lb).join('\n')}))});
      });
    });
  });
  const allB=pmGroups().reduce((s,g)=>s.concat(g.buildingIds),[]);
  (PMGEN.custom||[]).forEach(c=>{
    allB.forEach(bid=>{
      const b=db.buildings.find(x=>x.id===bid)||{},qty=Math.max(1,+c.qty||1);
      for(let i=1;i<=qty;i++)out.push({inc:true,sysKey:'custom',buildingId:bid,buildingName:b.name,buildingType:b.type,
        name:c.name+(qty>1?' '+i:''),cat:c.cat||'أخرى',
        plans:[{inc:true,name:c.name,fv:+c.fv||1,fu:c.fu||'months',tasks:c.tasks||''}]});
    });
  });
  return out;
}
function pmInc(i,on){if(PMGEN.result[i])PMGEN.result[i].inc=!!on;pmGenRender();}
function pmPlanFreq(i,pi,v){const p=PMGEN.result[i]&&PMGEN.result[i].plans[pi];if(p)p.fv=Math.max(1,parseInt(v,10)||1);pmGenRender();}
function pmPlanUnit(i,pi,v){const p=PMGEN.result[i]&&PMGEN.result[i].plans[pi];if(p)p.fu=v;pmGenRender();}
function pmPlanTasks(i,pi,v){const p=PMGEN.result[i]&&PMGEN.result[i].plans[pi];if(p)p.tasks=v;}
function normFu(u){u=String(u||'').toLowerCase();return ['days','weeks','months'].includes(u)?u:'months';}
function arrTasks(t){return Array.isArray(t)?t.map(s=>String(s).slice(0,200)).join('\n'):'';}
function pmGenAIPayload(){
  const groups=pmGroups(),systems=[];
  groups.forEach(g=>{
    const sys=PMGEN.sys[g.key]||{};
    Object.keys(sys).filter(k=>sys[k]>0&&PM_LIB[k]).forEach(k=>{
      const L=PM_LIB[k];
      systems.push({system:k,label:L.label.split('||')[0],asset:L.asset.name.split('||')[0],
        category:L.asset.cat,buildings:g.buildingIds.length,qty:sys[k]});
    });
  });
  const nb=groups.reduce((s,g)=>s+g.buildingIds.length,0);
  (PMGEN.custom||[]).forEach(c=>systems.push({system:'custom',label:c.name,asset:c.name,category:c.cat||'other',buildings:nb,qty:c.qty||1}));
  return {lang:db.lang,compoundName:cmpName(activeCmp()),systems,
    buildingTypes:groups.map(g=>({type:g.type,name:g.name,buildings:g.buildingIds.length}))};
}
function pmGenApplyAI(j){
  const map={};
  (j.plans||[]).forEach(p=>{if(p&&p.system)(map[String(p.system)]=map[String(p.system)]||[]).push(p);});
  (PMGEN.result||[]).forEach(a=>{
    const arr=map[a.sysKey];if(!arr||!arr.length)return;
    const p=arr[0];
    if(!a.plans.length)a.plans.push({inc:true,name:String(p.name||a.name).slice(0,120),fv:Math.max(1,+p.freqVal||1),fu:normFu(p.freqUnit),tasks:arrTasks(p.tasks)});
    else{const t=a.plans[0];
      if(p.name)t.name=String(p.name).slice(0,120);
      t.fv=Math.max(1,+p.freqVal||t.fv||1);t.fu=normFu(p.freqUnit)||t.fu;
      if(Array.isArray(p.tasks)&&p.tasks.length)t.tasks=p.tasks.map(s=>String(s).slice(0,200)).join('\n');}
    for(let i=1;i<arr.length;i++){const q=arr[i];
      a.plans.push({inc:true,name:String(q.name||lb('خطة إضافية||Extra plan')).slice(0,120),fv:Math.max(1,+q.freqVal||1),fu:normFu(q.freqUnit),tasks:arrTasks(q.tasks)});}
  });
}
async function pmGenAI(){
  PMGEN.aiState='loading';pmGenRender();
  try{
    const r=await api('/ai/pm-suggest',{method:'POST',body:JSON.stringify(pmGenAIPayload())});
    const j=await r.json();
    if(!j||!j.ok){PMGEN.aiState='off';PMGEN.aiNote=(j&&j.reason)||'';pmGenRender();
      toast(lb('الذكاء الاصطناعي غير مهيأ — استُخدمت المكتبة المحلية||AI not configured — using the local library'),'err');return;}
    pmGenApplyAI(j);PMGEN.aiState='done';PMGEN.aiNote=j.model||'AI';pmGenRender();
    toast(lb('حسّن الذكاء الاصطناعي الجدول||AI refined the schedule'),'ok');
  }catch(e){PMGEN.aiState='off';pmGenRender();toast(lb('تعذّر الاتصال بالذكاء الاصطناعي||AI request failed'),'err');}
}

/* ===== PM TEMPLATES — قوالب قابلة لإعادة الاستخدام مع إصدارات ===== */
function tplName(id){const t=(db.pmTemplates||[]).find(x=>x.id===id);return t?t.name:lb('قالب محذوف||deleted template');}
function tplMatches(t,a){
  if(!t.category&&!t.model)return false;
  if(t.category&&a.category!==t.category)return false;
  if(t.model&&String(a.model||'').toLowerCase().indexOf(String(t.model).toLowerCase())<0)return false;
  return true;
}
function tplAssets(t){return db.assets.filter(a=>a.compoundId===activeCmp()&&tplMatches(t,a));}
function tplPlans(t){return (db.pms||[]).filter(p=>p.compoundId===activeCmp()&&p.tplId===t.id);}
function parsePartsTxt(txt){
  return String(txt||'').split('\n').map(s=>s.trim()).filter(Boolean).map(l=>{
    const m=l.match(/^(.*?)[\sx×*]+(\d+(?:\.\d+)?)\s*$/);
    return m?{name:m[1].trim(),qty:Math.max(1,+m[2]||1)}:{name:l,qty:1};
  });
}
function partsTxt(parts){return (parts||[]).map(p=>p.name+' × '+p.qty).join('\n');}
function tplApply(tid){
  const t=db.pmTemplates.find(x=>x.id===tid);if(!t)return null;
  const act=activeCmp();let created=0,updated=0;const assets=tplAssets(t);
  assets.forEach(a=>{
    const p=db.pms.find(x=>x.compoundId===act&&x.assetId===a.id&&x.tplId===tid);
    if(!p){
      db.pms.push({id:uid('P'),name:t.name,assetId:a.id,compoundId:act,freqVal:t.freqVal,freqUnit:t.freqUnit,
        mEvery:t.mEvery||0,lastDone:todayISO(),assigneeId:'',assigneeName:'',tasks:t.tasks||'',
        priority:t.priority||'normal',estMins:t.estMins||0,skills:t.skills||'',tools:t.tools||'',
        permits:t.permits||'',safety:t.safety||'',parts:(t.parts||[]).map(x=>({name:x.name,qty:x.qty})),
        tplId:tid,tplVersion:t.version||1,src:'tpl'});
      created++;
    }else if((p.tplVersion||0)!==(t.version||1)){
      p.name=t.name;p.freqVal=t.freqVal;p.freqUnit=t.freqUnit;p.mEvery=t.mEvery||0;p.tasks=t.tasks||'';
      p.priority=t.priority||'normal';p.estMins=t.estMins||0;p.skills=t.skills||'';p.tools=t.tools||'';
      p.permits=t.permits||'';p.safety=t.safety||'';p.parts=(t.parts||[]).map(x=>({name:x.name,qty:x.qty}));
      p.tplVersion=t.version||1;delete p.nextDue;updated++;
    }
  });
  return {created,updated,assets:assets.length};
}
function tplApplyOne(tid){
  const t=db.pmTemplates.find(x=>x.id===tid);if(!t)return;
  if(t.active===false)return toast(lb('القالب موقوف — فعّله أولاً||Template is inactive — enable it first'),'err');
  const r=tplApply(tid);
  if(!r||!r.assets)return toast(lb('لا أصول مطابقة (تحقق من التصنيف/الطراز)||No matching assets (check category/model)'),'err');
  auditLog('apply','tpl',t.name,'+'+r.created+' / ~'+r.updated);
  persist();paintTab();toast(lb('طُبّق القالب: '+r.created+' جديد، '+r.updated+' محدّث||Applied: '+r.created+' new, '+r.updated+' updated'),'ok');
}
function tplApplyAll(){

}

function saveTemplate(tid){
  const name=$('ft_n').value.trim();if(!name)return toast(lb('الاسم مطلوب||Name required'),'err');
  const category=$('ft_c').value,model=$('ft_m').value.trim();
  if(!category&&!model)return toast(lb('حدّد التصنيف أو الطراز على الأقل||Set at least a category or model'),'err');
  const base={name,category,model,freqVal:Math.max(1,+$('ft_fv').value||1),freqUnit:$('ft_fu').value,
    mEvery:+$('ft_me').value||0,priority:$('ft_p').value,estMins:+$('ft_e').value||0,
    skills:$('ft_sk').value.trim(),tools:$('ft_tl').value.trim(),permits:$('ft_pm').value.trim(),safety:$('ft_sf').value.trim(),
    tasks:$('ft_t').value,parts:parsePartsTxt($('ft_pt').value),
    evidence:{photo:$('ft_ev_ph').checked,reading:$('ft_ev_rd').checked,sig:$('ft_ev_sg').checked},
    active:$('ft_ac').checked,compoundId:activeCmp(),updatedAt:Date.now(),updatedBy:me?me.name:''};
  if(tid){
    const t=db.pmTemplates.find(x=>x.id===tid);if(!t)return toast(lb('القالب غير موجود||Template not found'),'err');
    const snap={version:t.version||1,at:t.updatedAt||t.createdAt,by:t.updatedBy||''};
    ['name','category','model','freqVal','freqUnit','mEvery','priority','estMins','skills','tools','permits','safety','tasks','parts','evidence','active']
      .forEach(k=>snap[k]=JSON.parse(JSON.stringify(t[k]!=null?t[k]:'')));
    t.history=t.history||[];t.history.unshift(snap);if(t.history.length>20)t.history.length=20;
    Object.assign(t,base,{version:(t.version||1)+1});
  }else{
    db.pmTemplates.push(Object.assign({id:uid('T'),version:1,history:[],createdAt:Date.now()},base));
  }
  const saved=db.pmTemplates.find(t=>t.name===name&&t.compoundId===base.compoundId);
  auditLog(tid?'update':'create','tpl',name,tid?('v'+((saved||{}).version||1)):'v1');
  persist();closeModal();paintTab();toast(lb('حُفظ القالب||Template saved'),'ok');
}

/* ===== AMLAKI MODULE HUB — محفظة العقارات · الصيانة والمقاولون · المتتبع المالي ===== */
function moneyK(n){
  n=Number(n||0);
  const a=Math.abs(n);
  if(a>=1e6)return (n/1e6).toFixed(a%1e6?1:0)+'M';
  if(a>=1e3)return Math.round(n/1e3)+'K';
  return String(Math.round(n));
}
function hubKpi(v,k,cls){return `<div class="pkpi ${cls||''}"><div class="v">${v}</div><div class="k">${k}</div></div>`;}
function hubBar(label,val,max,color,onclick,valTxt){
  const pct=max>0?Math.max(2,Math.round(val/max*100)):0;
  return `<div class="hbar ${onclick?'click':''}" ${onclick?`onclick="${onclick}"`:''} title="${esc(label)}">
    <span>${esc(label)}</span><span class="hb"><i style="width:${pct}%;background:${color}"></i></span>
    <span class="hv">${valTxt!=null?valTxt:val}</span></div>`;
}
function hubDonut(segs,center,sub){
  const tot=segs.reduce((s,x)=>s+Math.max(0,+x.v||0),0);
  let a=0;
  const stops=segs.filter(s=>+s.v>0).map(s=>{const d=(+s.v/(tot||1))*360;
    const r=`${s.c} ${a.toFixed(2)}deg ${(a+d).toFixed(2)}deg`;a+=d;return r;}).join(',');
  return `<div class="donut" style="background:conic-gradient(${stops||'rgba(148,163,184,.3) 0deg 360deg'})">
    <div class="hole"><b>${center}</b><small>${sub||''}</small></div></div>`;
}
function hubUnitsAgg(){
  const units=cmpUnits();
  const rented=units.filter(u=>u.tenantId).length;
  const maint=units.filter(u=>!u.tenantId&&u.st==='maint').length;
  const reserved=units.filter(u=>!u.tenantId&&u.st==='reserved').length;
  return {units,rented,maint,reserved,vacant:Math.max(0,units.length-rented-maint-reserved)};
}

function hubFinance(){
  const act=activeCmp();
  const isRE=domainOf()==='realestate';
  const tenants=isRE?cmpTenants():[];
  const income=isRE?tenants.reduce((s,t)=>s+Number(t.rent||0),0):0;
  const wos=db.wos.filter(w=>w.compoundId===act);
  const labor=wos.filter(w=>w.status==='closed'&&!w.projectId).reduce((s,w)=>s+Number(w.cost||0),0);
  const pos=posQ();
  const invs=pos.filter(po=>po.invApproved&&po.invoice&&!po.projectId);
  const purch=invs.reduce((s,po)=>s+Number(po.invoice.total||0),0);
  const projExp=db.projects.filter(p=>p.compoundId===act).reduce((s,p)=>s+projCosts(p).total,0);
  const ctrs=db.contracts.filter(c=>c.compoundId===act&&daysUntil(c.end)>=0);
  const ctrVal=ctrs.reduce((s,c)=>s+Number(c.cost||0),0);
  const totalExp=labor+purch+projExp+ctrVal;
  const net=income-totalExp;
  const empty=!income&&!totalExp&&!invs.length;
  const months=[];const now=new Date();
  for(let k=5;k>=0;k--){const d=new Date(now.getFullYear(),now.getMonth()-k,1);
    months.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));}
  const expM={},incM={};months.forEach(m=>{expM[m]=0;incM[m]=0;});

      ${hubKpi(moneyK(totalExp)+' <small>'+lb('ر.س||SAR')+'</small>',lb('إجمالي المصروفات||Total expenses'),totalExp?'warn':'')}
      ${hubKpi((net<0?'-':'')+moneyK(Math.abs(net))+' <small>'+lb('ر.س||SAR')+'</small>',lb('الصافي||Net'),net<0?'warn':'ok')}

    <div class="netline ${(isRE?net>=0:false)?'pos':'neg'}"><span>${isRE?lb('صافي الدخل المتوقع (سنوي)||Expected net income (year)'):lb('إجمالي تكلفة التشغيل (سنوي)||Total cost of ownership (year)')}</span>

        ${hubKpi(ok,lb('جاهزة||Ready'),'ok')}
        ${hubKpi(down,lb('خارج الخدمة||Out of service'),down?'warn':'')}
        ${hubKpi(maint,lb('تحت الصيانة||Under maintenance'),maint?'warn':'')}
        ${hubKpi(moneyK(totalKm)+' <small>'+lb('كم||km')+'</small>',lb('إجمالي العدّاد||Total odometer'))}

        ${hubKpi(downtime?moneyK(downtime)+' <small>'+lb('ساعة||h')+'</small>':'—',lb('زمن التوقف||Downtime'))}

   .forEach(p=>alerts.push({ic:'',h:`${lb('صيانة دورية متأخرة:||Overdue PM:')} <b>${esc(p.name)}</b>`,tab:'pm'}));

   .forEach(p=>alerts.push({ic:'',h:`${lb('صيانة قريبة:||PM soon:')} <b>${esc(p.name)}</b> (${fmtD(nextDueOf(p))})`,tab:'pm'}));

/* ===== تفاعل القائمة الجانبية مع الماوس: مؤشر منزلق + تبديل بالمرور ===== */
function initNavGlider(){
  const side=document.querySelector('.side');
  if(!side)return;
  let gl=document.getElementById('navglide');
  if(!gl||!side.contains(gl)){
    gl=document.createElement('span');
    gl.id='navglide';gl.className='navglide';
    side.insertBefore(gl,side.firstChild);
  }
  const btns=[...side.querySelectorAll('.nbtn')];
  if(!btns.length)return;
  const place=el=>{
    if(!el){gl.style.opacity='0';return;}
    gl.style.height=el.offsetHeight+'px';
    gl.style.transform='translateY('+el.offsetTop+'px)';
    gl.style.opacity='1';
  };
  btns.forEach(b=>{
    b.addEventListener('mouseenter',()=>{
      place(b);
      /* التبديل بالمرور بعد مهلة قصيرة (280ms) حتى لا يتبدّل التبويب عشوائياً */
      clearTimeout(window._navDwell);
      const t=b.dataset.tab;
      if(t&&t!==TAB)window._navDwell=setTimeout(()=>{if(t&&t!==TAB)goTab(t);},280);
    });
    b.addEventListener('mouseleave',()=>clearTimeout(window._navDwell));
  });
  if(!side._navBound){
    side._navBound=true;
    side.addEventListener('mouseleave',()=>{
      clearTimeout(window._navDwell);
      place(side.querySelector('.nbtn.active'));
    });
  }
  place(side.querySelector('.nbtn.active')||btns[0]);
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();return;}
  /* التنقل بين عناصر القائمة بأسهم الكيبورد (يعمل عندما يكون التركيز على أحد الأزرار فقط — لا يسرق الأسهم من الحقول) */
  if(e.key!=='ArrowDown'&&e.key!=='ArrowUp'&&e.key!=='Home'&&e.key!=='End')return;
  const btns=[...document.querySelectorAll('.side .nbtn')];
  if(!btns.length)return;
  const i=btns.indexOf(document.activeElement);
  if(i<0)return;
  e.preventDefault();
  let n=i;
  if(e.key==='ArrowDown')n=(i+1)%btns.length;
  else if(e.key==='ArrowUp')n=(i-1+btns.length)%btns.length;
  else if(e.key==='Home')n=0;else n=btns.length-1;
  btns[n].focus();
});

/* ===== BULK IMPORT (CSV) + DATA QUALITY ===== */
function parseCsvText(text){
  const s=String(text||'').replace(/^\uFEFF/,'');
  const rows=[];let row=[],cell='',q=false,i=0;
  while(i<s.length){
    const ch=s[i];
    if(q){
      if(ch==='"'){ if(s[i+1]==='"'){cell+='"';i+=2;continue;} q=false;i++;continue; }
      cell+=ch;i++;continue;
    }
    if(ch==='"'){q=true;i++;continue;}
    if(ch===','){row.push(cell);cell='';i++;continue;}
    if(ch==='\r'){i++;continue;}
    if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell='';i++;continue;}
    cell+=ch;i++;
  }
  row.push(cell);rows.push(row);
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function csvNorm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ');}
const ASSET_IMPORT_HEADERS=[
  ['name','الاسم||name'],['category','التصنيف||category'],['building','المبنى||building'],
  ['floor','الطابق||floor'],['zone','المنطقة||zone'],['room','الغرفة||room'],
  ['manufacturer','المصنع||manufacturer'],['model','الطراز||model'],['serial','السيريال||serial'],
  ['installdate','تاريخ التركيب||installed'],['warrantyend','انتهاء الضمان||warranty'],
  ['status','الحالة||status'],['critical','الأهمية||critical'],['provider','المزوّد||provider'],
  ['team','الفريق||team'],['meter','العداد||meter'],['meterUnit','وحدة العداد||meterunit'],['notes','ملاحظات||notes']
];
function normAssetStatus(s){s=csvNorm(s);return ({ok:'ok',operational:'ok','يعمل':'ok',down:'down','متوقف':'down',maint:'maint','under maintenance':'maint','تحت الصيانة':'maint',decommissioned:'decommissioned','خارج الخدمة':'decommissioned'})[s]||'ok';}
function normCritical(s){s=csvNorm(s);return ({normal:'normal','عادية':'normal',high:'high','عالية':'high',critical:'critical','حرجة':'critical'})[s]||'normal';}
function assetImportRows(text){
  const grid=parseCsvText(text);
  if(!grid.length)return {rows:[],error:'EMPTY'};
  const header=grid[0].map(csvNorm),idx={};
  header.forEach((h,i)=>{if(!(h in idx))idx[h]=i;});
  const keyIdx={};
  ASSET_IMPORT_HEADERS.forEach(([k,label])=>{
    const hit=label.split('||').map(csvNorm).find(a=>a in idx);
    if(hit!=null)keyIdx[k]=idx[hit];
  });
  if(keyIdx.name==null)return {rows:[],error:'NO_NAME'};
  const act=activeCmp();
  const val=(r,k)=>{const i=keyIdx[k];return i==null?'':String(r[i]??'').trim();};
  const seenSn=new Set(),seenNk=new Set();
  const rows=grid.slice(1).map((r,n)=>{
    const name=val(r,'name'),serial=val(r,'serial'),buildingName=val(r,'building');
    const b=db.buildings.find(x=>x.compoundId===act&&csvNorm(x.name)===csvNorm(buildingName));
    const errors=[];
    if(!name)errors.push(lb('الاسم مطلوب||name required'));
    if(buildingName&&!b)errors.push(lb('المبنى غير موجود||unknown building'));
    const snKey=csvNorm(serial),nk=csvNorm(name)+'@'+(b?b.id:'');
    const dupBatch=!!((snKey&&seenSn.has(snKey))||seenNk.has(nk));
    if(snKey)seenSn.add(snKey);seenNk.add(nk);
    const dupSerial=!!(serial&&db.assets.some(a=>a.compoundId===act&&a.serial&&csvNorm(a.serial)===snKey));
    const dupName=db.assets.some(a=>a.compoundId===act&&csvNorm(a.name)===csvNorm(name)&&a.building===(b?b.id:''));
    const dup=dupSerial||dupName||dupBatch;
    return {n:n+2,raw:r,name,buildingId:b?b.id:'',buildingName,
      values:{category:val(r,'category'),floor:val(r,'floor'),zone:val(r,'zone'),room:val(r,'room'),
        manufacturer:val(r,'manufacturer'),model:val(r,'model'),serial,installdate:val(r,'installdate'),
        warrantyend:val(r,'warrantyend'),status:normAssetStatus(val(r,'status')),critical:normCritical(val(r,'critical')),
        provider:val(r,'provider'),team:val(r,'team'),
        meter:val(r,'meter')===''?null:+val(r,'meter'),meterUnit:val(r,'meterUnit'),notes:val(r,'notes')},
      status:errors.length?'error':dup?'dup':'new',errors,dupBatch};
  });
  return {rows,error:''};
}

      meter:r.values.meter,meterUnit:r.values.meterUnit,notes:r.values.notes,compoundId:act};
    if(r.status==='dup'){
      if(!upd){skipped++;return;}
      const ex=db.assets.find(a=>a.compoundId===act&&((r.values.serial&&csvNorm(a.serial)===csvNorm(r.values.serial))||(csvNorm(a.name)===csvNorm(r.name)&&a.building===r.buildingId)));

function assetIssues(){

function saveUnit(idStr){
  const c=$('fun_c').value.trim();if(!c)return toast(lb(' الكود مطلوب|| Code required'),'err');
  const kind=$('fun_k').value;
  const bid=$('fun_b').value;
  if(kind!=='land'&&!bid)return toast(lb(' المبنى مطلوب لهذا النوع|| Building is required for this type'),'err');
  let parentId='';
  if(kind==='subunit'){
    parentId=$('fun_p').value;
    if(!parentId)return toast(lb(' اختر الفيلا الأم للوحدة الفرعية|| Select the parent villa for the sub-unit'),'err');
    const pv=db.units.find(x=>x.id===parentId);
    if(!pv||pv.kind!=='villa')return toast(lb(' الوحدة الأم يجب أن تكون فيلا|| Parent must be a villa unit'),'err');
  }
  const ex=idStr?db.units.find(x=>x.id===idStr):null;
  const subd=(kind==='villa')?($('fun_subd')?$('fun_subd').checked:false):false;
  if(ex&&ex.kind==='villa'&&ex.subdivided&&!subd){

function saveTenant(idStr){
  const n=$('ftn_n').value.trim();if(!n)return toast(lb(' الاسم مطلوب|| Name required'),'err');
  const unitId=$('ftn_u').value;
  const coTenant=$('ftn_co')?$('ftn_co').checked:false;
  if(unitId){
    const nu=db.units.find(u=>u.id===unitId);
    if(!nu)return toast(lb(' الوحدة غير موجودة|| Unit not found'),'err');
    if(nu.st==='maint')return toast(lb(' الوحدة تحت الصيانة — لا يمكن التأجير|| Unit is under maintenance — leasing blocked'),'err');
    if(nu.kind==='villa'&&nu.subdivided)return toast(lb(' الفيلا مجزأة — اختر وحدة فرعية محددة|| Villa is subdivided — select a specific sub-unit'),'err');
    const occId=nu.tenantId;
    if(occId&&occId!==idStr){
      const prev=db.tenants.find(x=>x.id===occId);
      const pn=prev?prev.name:'؟';
      if(!coTenant)return toast(lb(' الوحدة مؤجرة لـ "'+pn+'" — أخلها أولاً أو فعّل خيار السكن المشترك|| Unit is rented to "'+pn+'" — vacate it first or enable shared housing'),'err');
    }
    if(nu.st==='reserved'&&nu.tenantId!==idStr&&!coTenant){
      if(!confirm(lb(' الوحدة محجوزة — تأكيد تجاوز الحجز والإسناد؟|| Unit is reserved — override and assign?')))return;
    }
  }
  let t;
  if(idStr)t=db.tenants.find(x=>x.id===idStr);
  else{t={id:uid('T')};db.tenants.push(t);}
  db.units.forEach(u=>{if(u.tenantId===t.id&&u.id!==unitId)u.tenantId='';});
  if(unitId){const nu=db.units.find(u=>u.id===unitId);
    if(nu){if(!coTenant&&nu.tenantId&&nu.tenantId!==t.id){const prev=db.tenants.find(x=>x.id===nu.tenantId);if(prev)prev.unitId='';}
      nu.tenantId=t.id;}}
  t.unitId=unitId;
  Object.assign(t,{name:n,phone:$('ftn_p').value.trim(),email:$('ftn_e').value.trim(),idNo:$('ftn_i').value.trim(),
    coTenant:!!coTenant,
    leaseStart:$('ftn_ls').value||todayISO(),leaseEnd:$('ftn_le').value||'',rent:+$('ftn_r').value||0,
    notes:$('ftn_no').value.trim()});
  persist();closeModal();paintTab();toast(lb(' تم الحفظ|| Saved'),'ok');
}

  if(d<=30)return['b-maint',lb('تنتهي قريباً||Expiring Soon')];
  return['b-ok',lb('سارية||Active')];}

function doCloseWO(i){

    const it=invQ().find(x=>x.id===r.querySelector('.pr_i').value);

  (window._woPhA||[]).forEach(p=>phs.push({id:uid('PH'),tag:'after',d:p.d,n:p.n||'',at:Date.now()}));
  if(phs.length)w.photos=phs;
  if(sigHasInk())w.sig=$('sigpad').toDataURL('image/png');
  w.closeNotes=notes;w.cost=+$('wc_c').value||0;
  w.status='closed';w.closedAt=Date.now();if(!w.startedAt)w.startedAt=w.closedAt;
  if(w.type==='pm'&&w.pmId){
    const p=db.pms.find(x=>x.id===w.pmId);
    if(p){p.lastDone=todayISO();p.nextDue=addDays(todayISO(),intervalDays(p));
      const wa=db.assets.find(a=>a.id===w.assetId);
      if(wa&&wa.meter!=null&&wa.meter!=='')p.lastMeter=Number(wa.meter);}
  }
  /* إجراء تصحيحي تلقائي عند الحاجة */
  const fu=$('wc_fu')?$('wc_fu').checked:false;
  const fud=$('wc_fud')?$('wc_fud').value.trim():'';
  if(fu&&fud){
    db.seq++;const y=new Date().getFullYear();
    const nw={no:'WO-'+y+'-'+String(db.seq).padStart(4,'0'),type:'fault',compoundId:w.compoundId,
      title:lb('إجراء تصحيحي: ')+fud.slice(0,100),desc:lb('أمر تصحيحي ناتج عن ')+w.no+' — '+fud,
      assetId:w.assetId||'',assetName:w.assetName||'',bname:w.bname||'',priority:'high',status:'open',
      assigneeId:w.assigneeId||'',assigneeName:w.assigneeName||'',dueDate:addDays(todayISO(),3),
      projectId:'',unitId:w.unitId||'',unitCode:w.unitCode||'',tenantName:w.tenantName||'',
      cost:0,closeNotes:'',parts:[],photos:[],sig:'',reportedBy:me?me.name:'',fromWo:w.no,source:'corrective',
      createdAt:Date.now(),startedAt:null,closedAt:null,checklist:[]};
    db.wos.unshift(nw);w.followUpNo=nw.no;
    auditLog('create','wo',nw.no,lb('إجراء تصحيحي من ')+w.no);
  }
  /* المراجعة: يعتمد المشرف الإغلاق مباشرة، وإلا يبقى بانتظار المراجعة */
  w.review=canAppr()?'reviewed':'pending';
  if(w.review==='reviewed'){w.reviewedBy=me?me.name:'';w.reviewedAt=Date.now();}
  auditLog('close','wo',w.no,notes.slice(0,80));
  notify('',lb('اكتمل أمر: ||Work order completed: ')+w.no,'wos','done-'+w.no);
  persist();closeModal();paintTab();toast(lb(' أُغلق الأمر|| Closed'),'ok');
}

  <div class="card"><h2>${lb('آخر الحركات||Recent Movements')}</h2><div class="tbl-wrap"><table>

function saveItem(id){
  const n=$('fi_n').value.trim();if(!n)return toast(lb(' الاسم مطلوب|| Name required'),'err');

}
function delItem(id){if(!confirm(lb('حذف الصنف؟||Delete item?')))return;
  const mine=invQ().some(it=>it.id===id);
  if(!mine)return toast(lb(' الصنف تابع لأصل آخر|| Item belongs to another asset'),'err');
  db.inv=db.inv.filter(it=>it.id!==id);persist();paintTab();}
function moveForm(type,itemId){
  const t=type==='in';
  modal(`<h3>${t?' '+lb('حركة وارد||Stock In'):' '+lb('صرف||Issue Out')}</h3>
  <label>${lb('الصنف||Item')}</label><select id="fm_i">${invQ().map(it=>`<option value="${it.id}" ${itemId===it.id?'selected':''}>${esc(it.name)} (${it.qty})</option>`).join('')}</select>

    <div><label>${lb('الكمية||Quantity')}</label><input type="number" id="fm_q" value="1" min="1"></div>

function doMove(type){
  const it=invQ().find(x=>x.id===$('fm_i').value);if(!it)return;
  const q=+$('fm_q').value||0;if(q<=0)return toast(lb(' أدخل كمية|| Enter quantity'),'err');
  if(type==='out'){if(q>it.qty)return toast(lb(' الكمية أكبر من المتوفر|| Not enough stock'),'err');it.qty-=q;}
  else it.qty+=q;
  db.moves.unshift({date:todayISO(),item:it.name,invId:it.id,type,qty:q,ref:$('fm_r').value.trim(),by:me.name,compoundId:it.compoundId});
  persist();closeModal();paintTab();toast(lb(' سُجلت الحركة|| Recorded'),'ok');

function vProc(){
  const tab=FILT.procTab;
  const chip=k=>`<button class="chip ${tab===k?'on':''}" onclick="FILT.procTab='${k}';paintTab()">${
    {pr:lb('طلبات الشراء||Purchase Requests'),po:lb('أوامر الشراء||Purchase Orders'),sup:lb('الموردون||Suppliers')}[k]}</button>`;
  return `<div class="toolbar">
    ${canProc()&&tab==='pr'?`<button class="btn" onclick="prForm()">＋ ${lb('طلب شراء جديد||New Request')}</button>`:''}

  </div>
  <div class="chips">${chip('pr')}${chip('po')}${chip('sup')}</div><div id="procbody"></div>`;
}
function paintProc(){
  const tab=FILT.procTab,b=$('procbody');if(!b)return;
  if(tab==='pr')b.innerHTML=vPrList();
  else if(tab==='po')b.innerHTML=vPoList();
  else b.innerHTML=vSup();
}
function vPrList(){
  const mine=prsQ();
  let rows='';
  [...mine].sort((a,b)=>b.date.localeCompare(a.date)).forEach(pr=>{
    const i=db.prs.indexOf(pr);
    const tot=pr.items.reduce((s,it)=>s+it.qty*it.price,0);
    let acts=`<button class="btn sm ghost" onclick="prView(${i})">${ic('view',13)}</button>`;
    if(pr.status==='pending'){
      if(canAppr())acts+=`<button class="btn sm" style="background:linear-gradient(135deg,#159957,#22c55e)" onclick="prApprove(${i})"> ${lb('اعتماد||Approve')}</button>
      <button class="btn sm danger" onclick="prReject(${i})">${ic('x',12)}</button>`;
      if(isAdmin())acts+=`<button class="btn sm ghost" onclick="prForm(${i})">${ic('edit',13)}</button><button class="btn sm danger" onclick="prDel(${i})">${ic('del',13)}</button>`;
    }
    if(pr.status==='approved'&&canProc())
      acts+=`<button class="btn sm" onclick="poFromPr(${i})"> ${lb('أمر شراء||PO')}</button>`;
    rows+=`<tr><td>${pr.no}</td><td><b>${esc(pr.title)}</b><br><span class="muted">${lb('طلب||by')} ${esc(pr.by)} · ${fmtD(pr.date)}</span></td>
    <td>${money(tot)}</td><td>${pr.poNo?`<span class="muted">${pr.poNo}</span>`:''}</td>

  return `<div class="card"><h2>${lb('طلبات الشراء||Purchase Requests')} (${mine.length})</h2><div class="tbl-wrap"><table>
  <tr><th>${lb('الرقم||No.')}</th><th>${lb('الطلب||Request')}</th><th>${lb('الإجمالي التقديري||Est. Total')}</th><th>${lb('أمر الشراء||PO')}</th><th>${lb('الحالة||Status')}</th><th></th></tr>
  ${rows||`<tr><td colspan="6"><div class="empty">${lb('لا طلبات||None yet')}</div></td></tr>`}</table></div></div>`;
}
function prForm(i){
  const pr=i!=null?db.prs[i]:{items:[]};
  const invOpts=v=>`<option value="">—</option>`+invQ().map(it=>`<option value="${it.id}" ${v===it.id?'selected':''}>${esc(it.name)}</option>`).join('');
  window._invOptsFn=invOpts;
  modal(`<h3>${i!=null?lb('تعديل طلب شراء||Edit Request'):lb('طلب شراء جديد||New Purchase Request')}</h3>

  <div id="itrows"></div>
  <button class="btn ghost sm" onclick="addItRow()">＋ ${lb('إضافة صنف||Add Item')}</button>
  <label>${lb('ملاحظات||Notes')}</label><textarea id="fpr_n" rows="2">${esc(pr.notes||'')}</textarea>
  <div class="ma"><button class="btn ghost" onclick="closeModal()">${lb('إلغاء||Cancel')}</button>

function addItRow(it){
  it=it||{};

  $('itrows').insertAdjacentHTML('beforeend',
   `<div class="itrow"><input class="it_d" placeholder="${lb('وصف الصنف||Item description')}" value="${esc(it.desc||'')}">

   <input type="number" class="it_q" min="1" value="${it.qty||1}" title="${lb('الكمية||Qty')}">

function savePr(iStr){
  const isNew=(iStr==null||iStr==='null'||iStr==='');
  const t=$('fpr_t').value.trim();if(!t)return toast(lb(' العنوان مطلوب|| Title required'),'err');
  const items=[...document.querySelectorAll('#itrows .itrow')].map(r=>({
    desc:r.querySelector('.it_d').value.trim(),
    invId:r.querySelector('.it_i').value||'',
    qty:+r.querySelector('.it_q').value||1,
    price:+r.querySelector('.it_p').value||0
  })).filter(it=>it.desc);
  if(!items.length)return toast(lb(' أضف صنفاً واحداً على الأقل|| Add at least one item'),'err');
  if(isNew){db.prSeq++;const y=new Date().getFullYear();
    const no='PR-'+y+'-'+String(db.prSeq).padStart(4,'0');
    db.prs.push({no,title:t,by:me.name,date:todayISO(),status:'pending',approver:'',approverDate:'',
      compoundId:activeCmp(),notes:$('fpr_n').value.trim(),poNo:'',items:items.map(it=>Object.assign({q:[]},it))});
    if(canAppr())notify('',lb('طلب شراء جديد بانتظار الموافقة: ||New PR awaiting approval: ')+t,'proc','pr-'+no);
  }else{const pr=db.prs[iStr];pr.title=t;pr.notes=$('fpr_n').value.trim();
    pr.items=items.map((it,j)=>Object.assign({q:(pr.items[j]&&pr.items[j].q)||[]},it));}
  persist();closeModal();paintTab();toast(lb(' حُفظ الطلب|| Saved'),'ok');
}
/* طلب تعويض تلقائي: يفتح طلب شراء جاهز بالأصناف تحت الحد (الكمية المقترحة ترفع الرصيد لضعف الحد) */
function prFromLow(){
  const low=invQ().filter(it=>Number(it.qty)<=Number(it.minQty));
  if(!low.length)return toast(lb(' لا توجد أصناف تحت الحد|| Nothing below minimum'),'ok');
  prForm();
  $('fpr_t').value=lb('تعويض مخزون تحت الحد||Restock below-minimum items');
  low.forEach(it=>addItRow({desc:it.name,invId:it.id,
    qty:Math.max(1,Math.ceil(Number(it.minQty||1)*2-Number(it.qty||0))),price:Number(it.unitCost||0)}));
  toast(lb(' أُضيفت الأصناف الناقصة — راجع الكميات ثم احفظ|| Low items added — review quantities then save'),'ok');
}
function prApprove(i){const pr=db.prs[i];pr.status='approved';pr.approver=me.name;pr.approverDate=todayISO();
  persist();paintTab();toast(lb(' اعتُمد الطلب — جاهز لأمر الشراء|| Approved — ready for PO'),'ok');}
function prReject(i){const pr=db.prs[i];pr.status='rejected';pr.approver=me.name;pr.approverDate=todayISO();
  persist();paintTab();}
function prDel(i){if(!confirm(lb('حذف الطلب؟||Delete request?')))return;db.prs.splice(i,1);persist();paintTab();}
function prView(i){
  const pr=db.prs[i];
  let body='';
  pr.items.forEach((it,j)=>{
    const inv=it.invId?db.inv.find(x=>x.id===it.invId):null;
    const qmin=it.q&&it.q.length?Math.min(...it.q.map(x=>x.p)):null;
    body+=`<tr><td><b>${esc(it.desc)}</b>${inv?`<br><span class="muted"> ${esc(inv.name)}</span>`:''}
    ${(it.q&&it.q.length)?`<div class="qline"> ${lb('العروض||Quotes')}: ${it.q.map(x=>`${esc(x.s)}: ${x.p}${x.p===qmin?' ':''}`).join(' | ')}
      ${(canProc()&&pr.status==='pending')?`<button class="btn sm ghost" onclick="quoteForm(${i},${j})">＋</button>`:''}</div>`:
      ((canProc()&&pr.status==='pending')?`<div class="qline"><button class="btn sm ghost" onclick="quoteForm(${i},${j})">＋ ${lb('عرض سعر||Add Quote')}</button></div>`:'')}
    </td>
    <td>${it.qty}</td><td>${money(it.price)}</td><td>${money(it.qty*it.price)}</td></tr>`;
  });
  const tot=pr.items.reduce((s,it)=>s+it.qty*it.price,0);
  const canQ=canProc()&&pr.status==='pending'&&pr.items.some(it=>it.q&&it.q.length);
  modal(`<h3>${pr.no} — ${esc(pr.title)}</h3>
  <p class="muted">${lb('طلبه||by')} ${esc(pr.by)} · ${fmtD(pr.date)} ·
  <span class="badge ${PRSTAT[pr.status][1]}">${PRSTAT[pr.status][0]}</span>
  ${pr.approver?` · ${lb('اعتمده||approved by')} ${esc(pr.approver)}`:''}</p>
  <table><tr><th>${lb('الصنف||Item')}</th><th>${lb('الكمية||Qty')}</th><th>${lb('السعر||Price')}</th><th>${lb('الإجمالي||Total')}</th></tr>
  ${body}<tr><td colspan="3" style="text-align:end"><b>${lb('الإجمالي||Total')}</b></td><td><b>${money(tot)}</b></td></tr></table>
  ${pr.notes?`<label>${lb('ملاحظات||Notes')}</label><p>${esc(pr.notes)}</p>`:''}
  ${canQ?`<button class="btn ghost sm" onclick="qApplyMinAll(${i})"> ${lb('اعتماد الأرخص لكل الأصناف||Apply Cheapest Everywhere')}</button>`:''}
  <div class="ma"><button class="btn ghost" onclick="closeModal()">${lb('رجوع||Back')}</button></div>`);
}
function quoteForm(pi,ii){
  const it=db.prs[pi].items[ii];
  modal(`<h3>${lb('عرض سعر لـ||Quote for')}: ${esc(it.desc)}</h3>
  <label>${lb('اسم المورد||Supplier')}</label><input id="fq_s" list="supdl">
  <datalist id="supdl">${supQ().map(s=>`<option value="${esc(s.name)}">`).join('')}</datalist>
  <label>${lb('السعر للوحدة||Unit Price')}</label><input type="number" step="any" id="fq_p">
  <div class="ma"><button class="btn ghost" onclick="prView(${pi})">${lb('رجوع||Back')}</button>
  <button class="btn" onclick="saveQuote(${pi},${ii})">${lb('إضافة||Add')}</button></div>`);
}
function saveQuote(pi,ii){
  const s=$('fq_s').value.trim(),p=+$('fq_p').value||0;
  if(!s||p<=0)return toast(lb(' أكمل اسم المورد والسعر|| Fill supplier and price'),'err');
  const it=db.prs[pi].items[ii];
  if(!it.q)it.q=[];
  it.q.push({s,p});
  persist();prView(pi);

function poExpected(po){return po.lines.reduce((s,l)=>s+(l.rq||0)*l.price,0);}
function poMatch(po){
  const reasons=[],exp=poExpected(po),inv=po.invoice;
  if(!po.lines.some(l=>l.rq>0))reasons.push(lb('لا يوجد استلام مسجل||No receipt recorded'));
  po.lines.forEach(l=>{if(l.rq>l.qty)reasons.push(lb('مستلم أكثر من المطلوب: ||Over-received: ')+l.desc)});
  const diff=Math.abs((inv.total||0)-exp);
  const tol=Math.max(2,exp*0.01);
  if(diff>tol)reasons.push(lb('قيمة الفاتورة لا تطابق قيمة المستلم||Invoice mismatches received value')+' ('+money(inv.total)+' ≠ '+money(exp)+')');
  return {ok:!reasons.length,reasons,exp};
}

  const po=db.pos[i];

  const m=poMatch(po);
  if(!m.ok){
    modal(`<h3> ${lb('المطابقة لم تنجح||Match Failed')}</h3>

    <button class="btn ghost" onclick="closeModal()">${lb('إغلاق||Close')}</button></div>`);
    return;

  po.lines.forEach(l=>{

  });
  po.status='closed';po.invApproved=true;
  persist();closeModal();paintTab();
  toast(lb(' مطابقة ناجحة — دخل المستلم المخزون|| Matched — stock updated'),'ok');
}

function projCosts(p){
  let labor=0,purch=0,manual=0;
  db.wos.forEach(w=>{if(w.projectId===p.id&&w.status==='closed')labor+=Number(w.cost||0);});
  db.pos.forEach(po=>{if(po.projectId===p.id&&po.compoundId===p.compoundId&&po.invApproved&&po.invoice)purch+=Number(po.invoice.total||0);});
  (p.expenses||[]).forEach(e=>manual+=Number(e.amt||0));
  return {labor,purch,manual,total:labor+purch+manual};
}
function projProgress(p){
  if(p.tasks&&p.tasks.length)return Math.round(p.tasks.filter(t=>t.done).length/p.tasks.length*100);
  return p.status==='done'?100:0;
}

function perfByTech(list){
  const tg={};
  (list||db.wos).filter(w=>w.status==='closed').forEach(w=>{
    const k=w.assigneeName||lb('غير مسند||Unassigned');
    tg[k]=tg[k]||{c:0,hrs:0,cost:0};
    tg[k].c++;
    if(w.closedAt)tg[k].hrs+=(w.closedAt-(w.startedAt||w.createdAt))/3600000;
    tg[k].cost+=Number(w.cost||0);
  });
  return Object.entries(tg).sort((a,b)=>b[1].c-a[1].c);
}

/* ===== REPORTS ===== */
function csvExport(fname,headers,rows){
  try{
    const line=a=>a.map(c=>{c=String(c??'');return /[",\n;]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(',');
    const txt='\uFEFF'+[line(headers)].concat(rows.map(line)).join('\r\n');
    const blob=new Blob([txt],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download=fname.replace(/[^\w\u0600-\u06FF-]+/g,'_')+'-'+Date.now()+'.csv';
    document.body.appendChild(a);a.click();a.remove();
    toast(lb(' تم تنزيل ملف Excel|| Excel downloaded'),'ok');
  }catch(e){alert(e.message);}
}

function maintPerf(scope,act){
  const closed=scope.filter(w=>w.status==='closed');
  const pm=scope.filter(w=>w.type==='pm');
  const corr=scope.filter(w=>w.type!=='pm');
  const sumCost=a=>a.reduce((s,w)=>s+Number(w.cost||0),0);
  const isOnTime=w=>!!(w.dueDate&&w.closedAt&&w.closedAt<=new Date(w.dueDate+'T23:59:59').getTime());
  const dueClosed=closed.filter(w=>w.dueDate);
  const onTime=dueClosed.filter(isOnTime).length;
  const overdue=scope.filter(w=>w.status!=='closed'&&w.status!=='planned'&&w.dueDate&&daysUntil(w.dueDate)<0).length;
  const deferred=scope.filter(w=>w.status==='wait').length;
  const planned=scope.filter(w=>w.status==='planned').length;
  const byAsset={};
  scope.filter(w=>w.type!=='pm'&&w.assetId).forEach(w=>{byAsset[w.assetId]=(byAsset[w.assetId]||0)+1;});
  const repeats=Object.entries(byAsset).filter(kv=>kv[1]>=2).sort((a,b)=>b[1]-a[1]).slice(0,8)
    .map(kv=>({name:(db.assets.find(a=>a.id===kv[0])||{}).name||kv[0],n:kv[1]}));
  const partsSpend=(db.moves||[]).filter(m=>m.compoundId===act&&m.type==='out')
    .reduce((s,m)=>{const it=db.inv.find(i=>i.id===m.invId);return s+(Number(m.qty)||0)*(it?Number(it.unitCost||0):0);},0);
  const tg={};
  closed.forEach(w=>{const k=w.assigneeName||lb('غير مسند||Unassigned');tg[k]=tg[k]||{c:0,ot:0,d:0,cost:0};
    tg[k].c++;tg[k].cost+=Number(w.cost||0);if(w.dueDate){tg[k].d++;if(isOnTime(w))tg[k].ot++;}});
  const techQ=Object.entries(tg).sort((a,b)=>b[1].c-a[1].c).slice(0,12)
    .map(kv=>({name:kv[0],c:kv[1].c,onTimePct:kv[1].d?Math.round(kv[1].ot/kv[1].d*100):null,cost:kv[1].cost}));
  return {pmN:pm.length,pmCost:sumCost(pm),corrN:corr.length,corrCost:sumCost(corr),closedN:closed.length,
    onTimePct:dueClosed.length?Math.round(onTime/dueClosed.length*100):null,overdue,deferred,planned,repeats,partsSpend,techQ};
}

/* استهلاك تقديري لكل مركبة: (أقصى عدّاد − أدنى عدّاد) ÷ اللترات المسجّلة */
function fuelEff(list){
  const per={};
  list.forEach(f=>{if(!f.assetId)return;
    const o=per[f.assetId]=per[f.assetId]||{liters:0,cost:0,odos:[]};
    o.liters+=Number(f.liters||0);o.cost+=Number(f.cost||0);
    if(f.odo!=null&&f.odo!=='')o.odos.push(Number(f.odo));});
  return Object.entries(per).map(kv=>{
    const o=kv[1],os=o.odos.slice().sort((a,b)=>a-b);
    const dist=os.length>1?os[os.length-1]-os[0]:0;
    return {id:kv[0],name:assetLabel(kv[0]),liters:o.liters,cost:o.cost,dist,
      kmpl:(o.liters>0&&dist>0)?dist/o.liters:null};}).sort((a,b)=>b.cost-a.cost);
}

function CERTTL(){return {safety:lb('سلامة وصحة مهنية||Occupational safety'),civil:lb('دفاع مدني||Civil defence'),

function certState(c){
  const d=daysUntil(c.expires);
  if(!c.expires)return [lb('بلا تاريخ||No date'),'b-normal'];
  if(d<0)return [lb('منتهية||Expired'),'b-low'];
  if(d<=45)return [lb('تنتهي قريباً||Expiring'),'b-maint'];
  return [lb('سارية||Valid'),'b-ok'];
}

function saveUser(id){
  const n=$('fu_n').value.trim(),un=$('fu_u').value.trim(),p=$('fu_p').value;
  const email=$('fu_e').value.trim().toLowerCase();
  if(!n||!un||(!id&&!p))return toast(lb(' أكمل الحقول|| Fill all fields'),'err');
  if(email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return toast(lb(' البريد الإلكتروني غير صحيح|| Invalid email'),'err');
  if(db.users.some(x=>x.u.toLowerCase()===un.toLowerCase()&&x.id!==id))return toast(lb(' اسم الدخول مستخدم|| Username taken'),'err');
  if(email&&db.users.some(x=>String(x.email||'').toLowerCase()===email&&x.id!==id))return toast(lb(' البريد مستخدم لحساب آخر|| Email already used'),'err');
  const role=(id&&id===me.id)?'admin':$('fu_r').value; /* المدير يبقى مديراً — لا يستطيع سحب صلاحيته من نفسه */
  /* أصل واحد فقط لكل مستخدم (المدير يملك كل الأصول ويبدّل من الهيدر) */
  const oneCmp=$('fu_cmp')?$('fu_cmp').value:'';
  const cmpIds=role==='admin'?[]:(oneCmp?[oneCmp]:[]);
  if(role!=='admin'&&!cmpIds.length)return toast(lb(' اختر أصلاً لهذا المستخدم|| Pick an asset for this user'),'err');
  const phone=$('fu_ph').value.trim();
  if(id){const x=db.users.find(y=>y.id===id);
    const upd={name:n,u:un,email,role,phone,cmpIds,activeCmp:(x.activeCmp&&(cmpIds.includes(x.activeCmp)||role==='admin'))?x.activeCmp:''};
    if(p){upd.p=p;upd.defaultPw=(p==='1234');} /* فارغة = إبقاء القديمة؛ الجديدة الافتراضية تُعلَّم للتغيير */
    Object.assign(x,upd);
    if(id===me.id)AUTH.mustChange=false;}
  else db.users.push({id:uid('U'),name:n,u:un,p,email,role,phone,cmpIds,activeCmp:'',defaultPw:(p==='1234')});
  persist();closeModal();paintTab();toast(lb(' تم||Saved'),'ok');
}
function delUser(id){if(!confirm(lb('حذف المستخدم؟||Delete user?')))return;

/* ---------- دليل المقدّمين (للمالك) ---------- */
let MKT_DIR_FILT={q:'',type:'',spec:''};

    </select>
  </div>
  <div class="mkt-grid">${list.map(p=>{
    const icn=p.type==='supplier'?'box':'tool';
    const col=p.type==='supplier'?'linear-gradient(135deg,#6d28d9,#a78bfa)':'linear-gradient(135deg,#0e7490,#0891b2)';
    return `<div class="mkt-provider">
      <div class="ph"><span class="av" style="background:${col}">${ic(icn,20)}</span>
        <div><div class="nm">${esc(p.bizName||p.contactName)}</div><div class="sm">${ptypeL(p.type)}${p.city?' · '+esc(p.city):''}</div></div></div>
      <div class="mkt-tags">
        ${p.type==='contractor'?`<span class="mkt-tag">${specL(p.specialty)}</span>`:''}
        ${(p.productLines||[]).map(l=>`<span class="mkt-tag">${prodL(l)}</span>`).join('')}
        ${p.coverage?`<span class="mkt-tag">${esc(p.coverage)}</span>`:''}
      </div>
      <div class="mkt-tags">
        <span class="mkt-pill b-ok" style="color:var(--green)">${lb('معتمد||Verified')} · ${ratingStr(p.rating)}</span>
        ${p.crNo||p.tradeLicense?`<span class="mkt-pill" style="color:var(--muted)">${p.crNo?lb('س.ت: ||CR: ')+esc(p.crNo):lb('رخصة: ||License: ')+esc(p.tradeLicense)}</span>`:''}
      </div>

function mktRfqRow(r,ownerView){
  const bids=(r.bids||[]).sort((a,b)=>a.amount-b.amount);
  const bidLines = ownerView || r.bids ? bids.map(b=>`<div class="mkt-bid ${b.id===r.awardedBidId?'won':''}">
      <div><b class="amt">${money(b.amount)}</b><br><span class="muted">${esc(b.providerName)} · ${b.note?esc(b.note):''}</span></div>
      <div style="text-align:end">
        ${b.id===r.awardedBidId?'<span class="badge b-ok">'+lb('مرسى||Awarded')+'</span>':(ownerView&&r.status==='open'?`<button class="btn sm" onclick="mktAward('${r.id}','${b.id}')">${lb('ترسية||Award')}</button>`:'')}
      </div></div>`).join('') : '';
  const badgeMap={open:['b-open',lb('مفتوح||Open')],awarded:['b-prog',lb('مرسى||Awarded')],closed:['b-done',lb('مغلق||Closed')]};
  const st=badgeMap[r.status]||badgeMap.open;
  const astTxt=[r.compoundName,r.assetName].filter(Boolean).join(' · ');
  return `<div class="mkt-rfq">
    <div class="top"><div><div class="ttl">${esc(r.no)} — ${esc(r.title)}</div>
      <div class="meta"><span class="badge ${st[0]}">${st[1]}</span>
      <span class="mkt-pill" style="color:var(--brand)">${rfqTypeL(r.type)}</span>
      ${astTxt?`<span>${esc(astTxt)}</span>`:''}
      ${r.targetDate?`<span>${lb('المطلوب:||Due: ')}${fmtD(r.targetDate)}</span>`:''}
      ${r.visibility==='direct'?`<span class="badge b-wait">${lb('توجيه مباشر||Direct')}</span>`:''}</div></div>
      ${r.jobStatus?`<div>${jobBadge(r.jobStatus)}</div>`:''}</div>
    ${r.desc?`<div class="muted">${esc(r.desc)}</div>`:''}
    ${ownerView&&r.status==='open'&&bids.length?`<div><div class="muted" style="margin:6px 0 2px;font-weight:800">${lb('العروض المستلمة||Received bids')} (${bids.length})</div>${bidLines}</div>`:''}
    ${ownerView&&r.status==='open'&&!bids.length?`<div class="muted" style="margin-top:6px">${lb('لا عروض بعد||No bids yet')}</div>`:''}
    ${ownerView&&r.status==='open'?`<div class="ma" style="justify-content:flex-start"><button class="btn sm danger" onclick="mktClose('${r.id}')">${lb('إغلاق||Close')}</button></div>`:''}
  </div>`;
}

/* ---------- إشراف المدير/المهندس على السوق ---------- */
function vMarket(){
  if(!isAdmin()&&!isEng())return '';
  const provs=db.providers||[];
  const pending=provs.filter(p=>!p.verified||p.status==='pending');
  const active=provs.filter(p=>p.verified&&p.status!=='suspended');
  const suspended=provs.filter(p=>p.status==='suspended');
  const rfqs=db.rfqs||[];
  return `<div class="stats">
    <div class="stat ok"><div class="num">${active.length}</div><div class="lbl">${lb('مقدّمون معتمدون||Verified providers')}</div></div>
    <div class="stat warn"><div class="num">${pending.length}</div><div class="lbl">${lb('بانتظار الاعتماد||Pending approval')}</div></div>
    <div class="stat"><div class="num">${suspended.length}</div><div class="lbl">${lb('موقوفون||Suspended')}</div></div>
    <div class="stat"><div class="num">${rfqs.length}</div><div class="lbl">${lb('طلبات السوق||Market requests')}</div></div>
  </div>
  <div class="card"><h2>${lb('مقدّمو الخدمة بانتظار الاعتماد||Providers pending approval')} (${pending.length})</h2>
    <div class="mkt-grid">${pending.map(p=>providerCard(p,true)).join('')||`<div class="mkt-empty">${lb('لا طلبات اعتماد||None pending')}</div>`}</div></div>
  <div class="card"><h2>${lb('جميع المقدّمين||All providers')} (${provs.length})</h2>
    <div class="mkt-grid">${provs.map(p=>providerCard(p,false)).join('')||`<div class="mkt-empty">${lb('لا مقدّمين بعد||No providers yet')}</div>`}</div></div>
  <div class="card"><h2>${lb('طلبات السوق||Market RFQs')} (${rfqs.length})</h2>
    ${rfqs.map(r=>mktRfqRow(r,true)).join('')||`<div class="mkt-empty">${lb('لا طلبات بعد||No requests yet')}</div>`}</div>`;
}
function providerCard(p,withActions){
  const col=p.type==='supplier'?'linear-gradient(135deg,#6d28d9,#a78bfa)':'linear-gradient(135deg,#0e7490,#0891b2)';
  return `<div class="mkt-provider">
    <div class="ph"><span class="av" style="background:${col}">${ic(p.type==='supplier'?'box':'tool',20)}</span>
      <div><div class="nm">${esc(p.bizName||p.contactName)}</div><div class="sm">${ptypeL(p.type)} · ${esc(p.contactName||'')}${p.city?' · '+esc(p.city):''}</div></div></div>
    <div class="mkt-tags">
      ${p.type==='contractor'?`<span class="mkt-tag">${specL(p.specialty)}</span>`:''}
      ${(p.productLines||[]).map(l=>`<span class="mkt-tag">${prodL(l)}</span>`).join('')}
    </div>
    <div><span class="badge ${p.status==='active'?'b-ok':p.status==='pending'?'b-wait':'b-low'}">${p.status==='active'?lb('معتمد||Approved'):p.status==='pending'?lb('قيد المراجعة||Pending'):lb('موقوف||Suspended')}</span></div>
    ${withActions?`<div class="ma" style="justify-content:flex-start"><button class="btn sm" onclick="mktVerify('${p.id}','approve')">${lb('اعتماد||Approve')}</button>
    <button class="btn sm danger" onclick="mktVerify('${p.id}','suspend')">${lb('رفض / تعليق||Reject / Suspend')}</button></div>`:''}
  </div>`;
}
async function mktVerify(pid,action){
  const r=await api('/market/providers/'+pid+'/verify',{method:'POST',body:JSON.stringify({action})});
  if(!r.ok)return toast(lb(' تعذر التحديث|| Update failed'),'err');
  const s=await(await api('/state')).json(); db=s.data; AUTH.ver=s.ver; db=migrate(db); paintTab();
  toast(lb(' تم التحديث|| Updated'),'ok');
}

async function signupSubmit(role){
  const body={role, name:$('su_name').value.trim(), email:$('su_email').value.trim(), phone:$('su_phone').value.trim(), password:$('su_pw').value};
  if(!body.name||!body.email||body.phone.replace(/\D/g,'').length<9||!body.password||body.password.length<6)
    return toast(lb(' أكمل الحقول الأساسية بشكل صحيح|| Complete the basic fields correctly'),'err');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(body.email))return toast(lb(' البريد الإلكتروني غير صحيح|| Invalid email'),'err');
  if(role==='owner'){ body.company=$('su_company').value.trim(); }
  else if(role==='contractor'){
    body.bizName=$('su_biz').value.trim(); body.specialty=$('su_spec').value; body.crNo=$('su_cr').value.trim(); body.city=$('su_city').value.trim();
    body.portfolio=($('su_port').value||'').split('\n').map(l=>{const i=l.indexOf('=');return i>=0?{name:l.slice(0,i).trim(),url:l.slice(i+1).trim()}:{name:l.trim()};}).filter(x=>x.name);
    if(!body.bizName)return toast(lb(' اسم المنشأة مطلوب|| Business name required'),'err');
  } else {
    body.bizName=$('su_biz').value.trim(); body.city=$('su_city').value.trim(); body.deliveryScope=$('su_deliv').value.trim();
    body.tradeLicense=$('su_tl').value.trim(); body.catalogUrl=$('su_cat').value.trim();
    body.productLines=[...document.querySelectorAll('#su_pl .chip.on')].map(c=>c.getAttribute('data-k'));
    if(!body.bizName)return toast(lb(' اسم الشركة مطلوب|| Company name required'),'err');
    if(!body.productLines.length)return toast(lb(' اختر خط منتجات واحداً على الأقل|| Select at least one product line'),'err');
  }
  let r; try{ r=await fetch(API_BASE+'/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); }catch(e){ return toast(lb(' تعذر الاتصال بالخادم|| Cannot reach server'),'err'); }
  const j=await r.json().catch(()=>({}));
  if(!r.ok){ const msg=j.error==='EMAIL_TAKEN'?lb(' البريد مستخدم لحساب آخر|| Email already used'):lb(' تعذر إنشاء الحساب|| Account creation failed'); return toast(msg,'err'); }
  toast(lb(' تم إنشاء حسابك — سجّل الدخول الآن|| Account created — sign in now'),'ok');
  $('app').innerHTML=loginHtml();
}

/* ===== BOOT ===== */
boot().then(()=>{initLangMaps();render();});
</script>
</body>
</html>
