function moveForm(type,itemId){
  const t=type==='in';
  modal(`<h3>${t?'📥 '+lb('حركة وارد||Stock In'):'📤 '+lb('صرف||Issue Out')}</h3>
  <label>${lb('الصنف||Item')}</label><select id="fm_i">${db.inv.map(it=>`<option value="${it.id}" ${itemId===it.id?'selected':''}>${esc(it.name)} (${it.qty})</option>`).join('')}</select>
  <div class="fg">
    <div><label>${lb('الكمية||Quantity')}</label><input type="number" id="fm_q" value="1" min="1"></div>
    <div><label>${lb('المرجع/السبب||Reference')}</label><input id="fm_r"></div>
  </div>
  <div class="ma"><button class="btn ghost" onclick="closeModal()">${lb('إلغاء||Cancel')}</button>
  <button class="btn" onclick="doMove('${type}')">${lb('تأكيد||Confirm')}</button></div>`);
}
function doMove(type){
  const it=db.inv.find(x=>x.id===$('fm_i').value);if(!it)return;
  const q=+$('fm_q').value||0;if(q<=0)return toast(lb('⚠ أدخل كمية||⚠ Enter quantity'),'err');
  if(type==='out'){if(q>it.qty)return toast(lb('⚠ الكمية أكبر من المتوفر||⚠ Not enough stock'),'err');it.qty-=q;}
  else it.qty+=q;
  db.moves.unshift({date:todayISO(),item:it.name,type,qty:q,ref:$('fm_r').value.trim(),by:me.name});
  persist();closeModal();paintTab();toast(lb('✔ سُجلت الحركة||✔ Recorded'),'ok');
}

/* ===== PROCUREMENT ===== */
function vProc(){
  const tab=FILT.procTab;
  const chip=k=>`<button class="chip ${tab===k?'on':''}" onclick="FILT.procTab='${k}';paintTab()">${
    {pr:lb('طلبات الشراء||Purchase Requests'),po:lb('أوامر الشراء||Purchase Orders'),sup:lb('الموردون||Suppliers')}[k]}</button>`;
  return `<div class="toolbar">
    ${canProc()&&tab==='pr'?`<button class="btn" onclick="prForm()">＋ ${lb('طلب شراء جديد||New Request')}</button>`:''}
    ${canProc()&&tab==='sup'?`<button class="btn" onclick="supForm()">＋ ${lb('مورد جديد||New Supplier')}</button>`:''}
  </div>
  <div class="chips">${chip('pr')}${chip('po')}${chip('sup')}</div><div id="procbody"></div>`;
}
function paintProc(){
  const tab=FILT.procTab,b=$('procbody');if(!b)return;
  if(tab==='pr')b.innerHTML=vPrList();
  else if(tab==='po')b.innerHTML=vPoList();
  else b.innerHTML=vSup();
}
function vPrList(){
  let rows='';
  [...db.prs].sort((a,b)=>b.date.localeCompare(a.date)).forEach(pr=>{
    const i=db.prs.indexOf(pr);
    const tot=pr.items.reduce((s,it)=>s+it.qty*it.price,0);
    let acts=`<button class="btn sm ghost" onclick="prView(${i})">👁</button>`;
    if(pr.status==='pending'){
      if(canAppr())acts+=`<button class="btn sm" style="background:linear-gradient(135deg,#159957,#22c55e)" onclick="prApprove(${i})">✔ ${lb('اعتماد||Approve')}</button>
      <button class="btn sm danger" onclick="prReject(${i})">✕</button>`;
      if(isAdmin())acts+=`<button class="btn sm ghost" onclick="prForm(${i})">✏</button><button class="btn sm danger" onclick="prDel(${i})">🗑</button>`;
    }
    if(pr.status==='approved'&&canProc())
      acts+=`<button class="btn sm" onclick="poFromPr(${i})">🧾 ${lb('أمر شراء||PO')}</button>`;
    rows+=`<tr><td>${pr.no}</td><td><b>${esc(pr.title)}</b><br><span class="muted">${lb('طلب||by')} ${esc(pr.by)} · ${fmtD(pr.date)}</span></td>
    <td>${money(tot)}</td><td>${pr.poNo?`<span class="muted">${pr.poNo}</span>`:''}</td>
    <td><span class="badge ${PRSTAT[pr.status][1]}">${PRSTAT[pr.status][0]}</span></td>
    <td nowrap>${acts}</td></tr>`;
  });
  return `<div class="card"><h2>${lb('طلبات الشراء||Purchase Requests')} (${db.prs.length})</h2><div class="tbl-wrap"><table>
  <tr><th>${lb('الرقم||No.')}</th><th>${lb('الطلب||Request')}</th><th>${lb('الإجمالي التقديري||Est. Total')}</th><th>${lb('أمر الشراء||PO')}</th><th>${lb('الحالة||Status')}</th><th></th></tr>
  ${rows||`<tr><td colspan="6"><div class="empty">${lb('لا طلبات||None yet')}</div></td></tr>`}</table></div></div>`;
}
function prForm(i){
  const pr=i!=null?db.prs[i]:{items:[]};
  const invOpts=v=>`<option value="">—</option>`+db.inv.map(it=>`<option value="${it.id}" ${v===it.id?'selected':''}>${esc(it.name)}</option>`).join('');
  window._invOptsFn=invOpts;
  modal(`<h3>${i!=null?lb('تعديل طلب شراء||Edit Request'):lb('طلب شراء جديد||New Purchase Request')}</h3>
  <label>${lb('وصف مختصر للطلب *||Title *')}</label><input id="fpr_t" value="${esc(pr.title||'')}">
  <label>${lb('الأصناف المطلوبة||Requested Items')}</label>
  <div id="itrows"></div>
  <button class="btn ghost sm" onclick="addItRow()">＋ ${lb('إضافة صنف||Add Item')}</button>
  <label>${lb('ملاحظات||Notes')}</label><textarea id="fpr_n" rows="2">${esc(pr.notes||'')}</textarea>
  <div class="ma"><button class="btn ghost" onclick="closeModal()">${lb('إلغاء||Cancel')}</button>
  <button class="btn" onclick="savePr(${i??'null'})">${lb('حفظ||Save')}</button></div>`);
  (pr.items&&pr.items.length?pr.items:[{}]).forEach(it=>addItRow(it));
}
function addItRow(it){
  it=it||{};
  const selOpts=window._invOptsFn?window._invOptsFn(it.invId):'';
  $('itrows').insertAdjacentHTML('beforeend',
   `<div class="itrow"><input class="it_d" placeholder="${lb('وصف الصنف||Item description')}" value="${esc(it.desc||'')}">
   <select class="it_i">${selOpts}</select>
   <input type="number" class="it_q" min="1" value="${it.qty||1}" title="${lb('الكمية||Qty')}">
   <input type="number" step="any" class="it_p" min="0" value="${it.price??''}" placeholder="${lb('سعر||Price')}">
   <button class="btn sm danger" onclick="this.parentNode.remove()">✕</button></div>`);
}
function savePr(iStr){
  const isNew=(iStr==null||iStr==='null'||iStr==='');
  const t=$('fpr_t').value.trim();if(!t)return toast(lb('⚠ العنوان مطلوب||⚠ Title required'),'err');
  const items=[...document.querySelectorAll('#itrows .itrow')].map(r=>({
    desc:r.querySelector('.it_d').value.trim(),
    invId:r.querySelector('.it_i').value||'',
    qty:+r.querySelector('.it_q').value||1,
    price:+r.querySelector('.it_p').value||0
  })).filter(it=>it.desc);
  if(!items.length)return toast(lb('⚠ أضف صنفاً واحداً على الأقل||⚠ Add at least one item'),'err');
  if(isNew){db.prSeq++;const y=new Date().getFullYear();
    const no='PR-'+y+'-'+String(db.prSeq).padStart(4,'0');
    db.prs.push({no,title:t,by:me.name,date:todayISO(),status:'pending',approver:'',approverDate:'',
      notes:$('fpr_n').value.trim(),poNo:'',items:items.map(it=>Object.assign({q:[]},it))});
    if(canAppr())notify('🛒',lb('طلب شراء جديد بانتظار الموافقة: ||New PR awaiting approval: ')+t,'proc','pr-'+no);
  }else{const pr=db.prs[iStr];pr.title=t;pr.notes=$('fpr_n').value.trim();
    pr.items=items.map((it,j)=>Object.assign({q:(pr.items[j]&&pr.items[j].q)||[]},it));}
  persist();closeModal();paintTab();toast(lb('✔ حُفظ الطلب||✔ Saved'),'ok');
}
function prApprove(i){const pr=db.prs[i];pr.status='approved';pr.approver=me.name;pr.approverDate=todayISO();
  persist();paintTab();toast(lb('✔ اعتُمد الطلب — جاهز لأمر الشراء||✔ Approved — ready for PO'),'ok');}
function prReject(i){const pr=db.prs[i];pr.status='rejected';pr.approver=me.name;pr.approverDate=todayISO();
  persist();paintTab();}
function prDel(i){if(!confirm(lb('حذف الطلب؟||Delete request?')))return;db.prs.splice(i,1);persist();paintTab();}
function prView(i){
  const pr=db.prs[i];
  let body='';
  pr.items.forEach((it,j)=>{
    const inv=it.invId?db.inv.find(x=>x.id===it.invId):null;
    const qmin=it.q&&it.q.length?Math.min(...it.q.map(x=>x.p)):null;
    body+=`<tr><td><b>${esc(it.desc)}</b>${inv?`<br><span class="muted">📦 ${esc(inv.name)}</span>`:''}
    ${(it.q&&it.q.length)?`<div class="qline">🏷 ${lb('العروض||Quotes')}: ${it.q.map(x=>`${esc(x.s)}: ${x.p}${x.p===qmin?' ⭐':''}`).join(' | ')}
      ${(canProc()&&pr.status==='pending')?`<button class="btn sm ghost" onclick="quoteForm(${i},${j})">＋</button>`:''}</div>`:
      ((canProc()&&pr.status==='pending')?`<div class="qline"><button class="btn sm ghost" onclick="quoteForm(${i},${j})">＋ ${lb('عرض سعر||Add Quote')}</button></div>`:'')}
    </td>
    <td>${it.qty}</td><td>${money(it.price)}</td><td>${money(it.qty*it.price)}</td></tr>`;
  });
  const tot=pr.items.reduce((s,it)=>s+it.qty*it.price,0);
  const canQ=canProc()&&pr.status==='pending'&&pr.items.some(it=>it.q&&it.q.length);
  modal(`<h3>${pr.no} — ${esc(pr.title)}</h3>
  <p class="muted">${lb('طلبه||by')} ${esc(pr.by)} · ${fmtD(pr.date)} ·
  <span class="badge ${PRSTAT[pr.status][1]}">${PRSTAT[pr.status][0]}</span>
  ${pr.approver?` · ${lb('اعتمده||approved by')} ${esc(pr.approver)}`:''}</p>
  <table><tr><th>${lb('الصنف||Item')}</th><th>${lb('الكمية||Qty')}</th><th>${lb('السعر||Price')}</th><th>${lb('الإجمالي||Total')}</th></tr>
  ${body}<tr><td colspan="3" style="text-align:end"><b>${lb('الإجمالي||Total')}</b></td><td><b>${money(tot)}</b></td></tr></table>
  ${pr.notes?`<label>${lb('ملاحظات||Notes')}</label><p>${esc(pr.notes)}</p>`:''}
  ${canQ?`<button class="btn ghost sm" onclick="qApplyMinAll(${i})">⚡ ${lb('اعتماد الأرخص لكل الأصناف||Apply Cheapest Everywhere')}</button>`:''}
  <div class="ma"><button class="btn ghost" onclick="closeModal()">${lb('رجوع||Back')}</button></div>`);
}
function quoteForm(pi,ii){
  const it=db.prs[pi].items[ii];
  modal(`<h3>${lb('عرض سعر لـ||Quote for')}: ${esc(it.desc)}</h3>
  <label>${lb('اسم المورد||Supplier')}</label><input id="fq_s" list="supdl">
  <datalist id="supdl">${db.suppliers.map(s=>`<option value="${esc(s.name)}">`).join('')}</datalist>
  <label>${lb('السعر للوحدة||Unit Price')}</label><input type="number" step="any" id="fq_p">
  <div class="ma"><button class="btn ghost" onclick="prView(${pi})">${lb('رجوع||Back')}</button>
  <button class="btn" onclick="saveQuote(${pi},${ii})">${lb('إضافة||Add')}</button></div>`);
}
function saveQuote(pi,ii){
  const s=$('fq_s').value.trim(),p=+$('fq_p').value||0;
  if(!s||p<=0)return toast(lb('⚠ أكمل اسم المورد والسعر||⚠ Fill supplier and price'),'err');
  const it=db.prs[pi].items[ii];
  if(!it.q)it.q=[];
  it.q.push({s,p});
  persist();prView(pi);
}
function qApplyMinAll(pi){
  let c=0;
  db.prs[pi].items.forEach(it=>{
    if(it.q&&it.q.length){it.price=Math.min(...it.q.map(x=>x.p));c++;}
  });
  persist();prView(pi);toast(c+' ✔','ok');
}
function vPoList(){
  let rows='';
  [...db.pos].sort((a,b)=>b.date.localeCompare(a.date)).forEach(po=>{
    const i=db.pos.indexOf(po);
    const tot=po.lines.reduce((s,l)=>s+l.qty*l.price,0);
    const recv=po.lines.reduce((s,l)=>s+(l.rq||0),0);
    let acts=`<button class="btn sm ghost" onclick="poView(${i})">👁</button>`;
    if(canInv()&&po.status==='ordered')
      acts+=`<button class="btn sm" onclick="poReceiveForm(${i})">📥 ${lb('استلام||Receive')}</button>`;
    if(canProc()&&po.status==='received')
      acts+=`<button class="btn sm" onclick="poInvoiceForm(${i})">🧾 ${lb('فاتورة||Invoice')}</button>`;
    if(canAppr()&&po.status==='received'&&po.invoice&&!po.invApproved)
      acts+=`<button class="btn sm" style="background:linear-gradient(135deg,#159957,#22c55e)" onclick="poApproveInvoice(${i})">✔ ${lb('مطابقة واعتماد||Match Approve')}</button>`;
    if(isAdmin()&&po.status!=='closed')acts+=`<button class="btn sm danger" onclick="poDel(${i})">🗑</button>`;
    rows+=`<tr><td>${po.no}</td><td><b>${esc(po.supplier)}</b><br><span class="muted">${fmtD(po.date)}${po.prId&&db.prs.find(p=>p.id===po.prId)?' · '+db.prs.find(p=>p.id===po.prId).no:''}</span></td>
    <td>${money(tot)}</td><td>${recv?recv+' / '+po.lines.reduce((s,l)=>s+l.qty,0):'—'}</td>
    <td>${po.rn?`<span class="muted">${po.rn}</span><br>`:''}<span class="badge ${POSTAT[po.status][1]}">${POSTAT[po.status][0]}</span></td>
    <td nowrap>${acts}</td></tr>`;
  });
  return `<div class="card"><h2>${lb('أوامر الشراء||Purchase Orders')} (${db.pos.length})</h2><div class="tbl-wrap"><table>
  <tr><th>${lb('الرقم||No.')}</th><th>${lb('المورد||Supplier')}</th><th>${lb('القيمة||Total')}</th><th>${lb('مستلم||Received')}</th><th>${lb('الحالة||Status')}</th><th></th></tr>
  ${rows||`<tr><td colspan="6"><div class="empty">${lb('لا أوامر شراء||None yet')}</div></td></tr>`}</table></div></div>`;
}
function poFromPr(pi){
  const pr=db.prs[pi];
  window._poTmp=pr;
  modal(`<h3>🧾 ${lb('أمر شراء من||PO from')} ${pr.no}</h3>
  <label>${lb('المورد||Supplier *')}</label>
  <select id="fpo_s">${db.suppliers.map(s=>`<option>${esc(s.name)}</option>`).join('')||('<option value="">'+lb('⚠ لا يوجد موردون — أضف مورداً أولاً من تبويب الموردين||⚠ No suppliers — add one from Suppliers tab')+'</option>')}</select>
  <label>${lb('الأصناف (قابلة للتعديل)||Lines (editable)')}</label>
  <div id="polines"></div>
  <div class="ma"><button class="btn ghost" onclick="closeModal()">${lb('إلغاء||Cancel')}</button>
  <button class="btn" onclick="poCreate(${pi})">${lb('إصدار أمر الشراء||Issue PO')}</button></div>`);
  pr.items.forEach(it=>{
    $('polines').insertAdjacentHTML('beforeend',
    `<div class="itrow"><input class="pl_d" value="${esc(it.desc)}" readonly>
    <span class="muted">${it.invId?'📦':''}</span>
    <input type="number" class="pl_q" value="${it.qty}" min="1">
    <input type="number" step="any" class="pl_p" value="${it.price}" min="0">
    <span></span></div>`);
  });
}
function poCreate(pi){
  const s=$('fpo_s').value.trim();if(!s)return toast(lb('⚠ اختر المورد||⚠ Pick supplier'),'err');
  const pr=window._poTmp;
  const lines=[...document.querySelectorAll('#polines .itrow')].map((r,j)=>({
    desc:r.querySelector('.pl_d').value,invId:pr.items[j]?pr.items[j].invId:'',
    qty:+r.querySelector('.pl_q').value||1,price:+r.querySelector('.pl_p').value||0,rq:0}));
  db.poSeq++;const y=new Date().getFullYear();
  const no='PO-'+y+'-'+String(db.poSeq).padStart(4,'0');
  db.pos.push({no,supplier:s,date:todayISO(),status:'ordered',rn:'',prId:pr.id,
    invoice:null,invApproved:false,notes:'',lines,projectId:''});
  pr.status='ordered';pr.poNo=no;
  persist();closeModal();paintTab();toast(lb('✔ صدر أمر الشراء||✔ PO issued')+': '+no,'ok');
}
function poView(i){
  const po=db.pos[i];
  const tot=po.lines.reduce((s,l)=>s+l.qty*l.price,0);
  const pj=po.projectId?db.projects.find(p=>p.id===po.projectId):null;
  modal(`<h3>${po.no} — ${esc(po.supplier)}</h3>
  <p class="muted">${fmtD(po.date)} · <span class="badge ${POSTAT[po.status][1]}">${POSTAT[po.status][0]}</span>
  ${po.rn?' · '+lb('سند استلام||Receipt')+': '+po.rn:''}
  ${po.invoice?' · '+lb('فاتورة||Invoice')+': '+esc(po.invoice.no)+' ('+money(po.invoice.total)+')':''}
  ${pj?' · 🧱 '+esc(pj.name):''}</p>
  <table><tr><th>${lb('الصنف||Line')}</th><th>${lb('مطلوب||Ordered')}</th><th>${lb('مستلم||Received')}</th><th>${lb('السعر||Price')}</th></tr>
  ${po.lines.map(l=>`<tr><td>${esc(l.desc)}</td><td>${l.qty}</td><td>${l.rq||0}</td><td>${money(l.price)}</td></tr>`).join('')}
  <tr><td colspan="3" style="text-align:end"><b>${lb('إجمالي الأمر||PO Total')}</b></td><td><b>${money(tot)}</b></td></tr></table>
  <div class="ma"><button class="btn ghost" onclick="closeModal()">${lb('إغلاق||Close')}</button></div>`);
}
function poReceiveForm(i){
  const po=db.pos[i];
  modal(`<h3>📥 ${lb('سند استلام||Goods Receipt')} ${po.no}</h3>
  <p class="muted">${lb('أدخل الكميات المستلمة فعلاً من||Enter actually received quantities from')} ${esc(po.supplier)}</p>
  ${po.lines.map((l,j)=>`<div class="partrow"><span>${esc(l.desc)} <span class="muted">(${lb('مطلوب||ord.')}: ${l.qty})</span></span>
  <input type="number" min="0" class="rc_q" id="rq_${j}" value="${l.qty}"><span></span></div>`).join('')}
  <div class="ma"><button class="btn ghost" onclick="closeModal()">${lb('إلغاء||Cancel')}</button>
  <button class="btn" onclick="poDoReceive(${i})">${lb('تأكيد الاستلام||Confirm Receipt')}</button></div>`);
}
function poDoReceive(i){
  const po=db.pos[i];let any=0;
  po.lines.forEach((l,j)=>{l.rq=Math.max(0,+($('rq_'+j)||{}).value||0);any+=l.rq;});
  if(!any)return toast(lb('⚠ لا كميات مستلمة||⚠ Nothing received'),'err');
  db.rnSeq++;const y=new Date().getFullYear();
  po.rn='RN-'+y+'-'+String(db.rnSeq).padStart(4,'0');
  po.status='received';
  persist();closeModal();paintTab();toast(lb('✔ سُجل الاستلام — بانتظار الفاتورة||✔ Received — awaiting invoice'),'ok');
}
function poExpected(po){return po.lines.reduce((s,l)=>s+(l.rq||0)*l.price,0);}
function poMatch(po){
  const reasons=[],exp=poExpected(po),inv=po.invoice;
  if(!po.lines.some(l=>l.rq>0))reasons.push(lb('لا يوجد استلام مسجل||No receipt recorded'));
  po.lines.forEach(l=>{if(l.rq>l.qty)reasons.push(lb('مستلم أكثر من المطلوب: ||Over-received: ')+l.desc)});
  const diff=Math.abs((inv.total||0)-exp);
  const tol=Math.max(2,exp*0.01);
  if(diff>tol)reasons.push(lb('قيمة الفاتورة لا تطابق قيمة المستلم||Invoice mismatches received value')+' ('+money(inv.total)+' ≠ '+money(exp)+')');
  return {ok:!reasons.length,reasons,exp};
}
function poInvoiceForm(i){
  const po=db.pos[i];
  const exp=poExpected(po);
  modal(`<h3>🧾 ${lb('تسجيل فاتورة المورد||Supplier Invoice')} ${po.no}</h3>
  <div class="fg">
    <div><label>${lb('رقم الفاتورة *||Invoice No. *')}</label><input id="fin_no"></div>
    <div><label>${lb('تاريخ الفاتورة||Invoice Date')}</label><input type="date" id="fin_d" value="${todayISO()}"></div>
    <div><label>${lb('إجمالي الفاتورة (ريال)||Invoice Total (SAR)')}</label><input type="number" step="any" id="fin_t" value="${exp.toFixed(2)}"></div>
  </div>
  <p class="muted">⚖️ ${lb('القيمة المتوقعة حسب الاستلام: ||Expected from receipt: ')}<b>${money(exp)}</b>
  — ${lb('يجري النظام المطابقة الثلاثية قبل الاعتماد.||3-way match runs before approval.')}</p>
  <div class="ma"><button class="btn ghost" onclick="closeModal()">${lb('إلغاء||Cancel')}</button>
  <button class="btn" onclick="poInvoiceSave(${i})">${lb('حفظ الفاتورة||Save Invoice')}</button></div>`);
}
function poInvoiceSave(i){
  const po=db.pos[i];
  const no=$('fin_no').value.trim();if(!no)return toast(lb('⚠ رقم الفاتورة مطلوب||⚠ Invoice No. required'),'err');
  po.invoice={no,date:$('fin_d').value||todayISO(),total:+$('fin_t').value||0};
  persist();closeModal();paintTab();toast(lb('✔ حُفظت الفاتورة — جاهزة للمطابقة||✔ Invoice saved — ready to match'),'ok');
}
function poApproveInvoice(i){
  const po=db.pos[i];
  if(!po.invoice)return toast(lb('⚠ سجل الفاتورة أولاً||⚠ Enter invoice first'),'err');
  const m=poMatch(po);
  if(!m.ok){
    modal(`<h3>❌ ${lb('المطابقة لم تنجح||Match Failed')}</h3>
    <p class="muted">${lb('صحّح ما يلي ثم أعد المحاولة:||Fix these then retry:')}</p>
    <ul style="padding-inline-start:18px;line-height:2">${m.reasons.map(r=>`<li>⚠️ ${esc(r)}</li>`).join('')}</ul>
    <div class="ma"><button class="btn" onclick="closeModal();poInvoiceForm(${i})">🧾 ${lb('تعديل الفاتورة||Edit Invoice')}</button>
    <button class="btn ghost" onclick="closeModal()">${lb('إغلاق||Close')}</button></div>`);
    return;
  }
  po.lines.forEach(l=>{
    if(l.invId&&l.rq>0){
      const it=db.inv.find(x=>x.id===l.invId);
      if(it){it.qty+=l.rq;
        db.moves.unshift({date:todayISO(),item:it.name,type:'in',qty:l.rq,ref:po.invoice.no,by:me.name});}
    }
  });
  po.status='closed';po.invApproved=true;
  persist();closeModal();paintTab();
  toast(lb('✔ مطابقة ناجحة — دخل المستلم المخزون||✔ Matched — stock updated'),'ok');
}

/* ===== PROJECTS ===== */
function projCosts(p){
  let labor=0,purch=0,manual=0;
  db.wos.forEach(w=>{if(w.projectId===p.id&&w.status==='closed')labor+=Number(w.cost||0);});
  db.pos.forEach(po=>{if(po.projectId===p.id&&po.invApproved&&po.invoice)purch+=Number(po.invoice.total||0);});
  (p.expenses||[]).forEach(e=>manual+=Number(e.amt||0));
  return {labor,purch,manual,total:labor+purch+manual};
}
function projProgress(p){
  if(p.tasks&&p.tasks.length)return Math.round(p.tasks.filter(t=>t.done).length/p.tasks.length*100);
  return p.status==='done'?100:0;
}

function taskToggle(i,j){const p=db.projects[i];p.tasks[j].done=!p.tasks[j].done;persist();prjView(i);}
function taskAdd(i){
  const d=$('ft_d').value.trim();if(!d)return toast(lb('⚠ اكتب المهمة||⚠ Write task'),'err');
  db.projects[i].tasks.push({d,a:$('ft_a').value.trim(),due:$('ft_due').value||'',done:false});
  persist();prjView(i);
}
function taskDel(i,j){db.projects[i].tasks.splice(j,1);persist();prjView(i);}
function poLink(i){
  const pid=$('pj_po').value;if(!pid)return toast(lb('⚠ اختر أمر شراء||⚠ Pick a PO'),'err');
  const po=db.pos.find(x=>x.id===pid);po.projectId=db.projects[i].id;persist();prjView(i);
}
function poUnlink(i,poid){const po=db.pos.find(x=>x.id===poid);if(po)po.projectId='';persist();prjView(i);}
function expAdd(i){
  const amt=+$('fe_a').value||0,de=$('fe_de').value.trim();
  if(!de||amt<=0)return toast(lb('⚠ أدخل الوصف والمبلغ||⚠ Enter description and amount'),'err');
  const p=db.projects[i];
  if(!p.expenses)p.expenses=[];
  p.expenses.push({date:$('fe_d').value||todayISO(),desc:de,amt});
  persist();prjView(i);
}
function expDel(i,j){db.projects[i].expenses.splice(j,1);persist();prjView(i);}
function prjCsv(i){
  const p=db.projects[i],c=projCosts(p);
  const rows=[];
  (p.tasks||[]).forEach(t=>rows.push([lb('مهمة||Task'),t.d,t.a||'',fmtD(t.due),t.done?lb('منجزة||Done'):lb('قائمة||Pending')]));
  (p.expenses||[]).forEach(e=>rows.push([lb('مصروف||Expense'),e.desc,'',fmtD(e.date),Number(e.amt).toFixed(2)]));
  rows.push([lb('الإجمالي||TOTAL'),'', '', '', c.total.toFixed(2)]);
  csvExport('project-'+p.no,[lb('البند||Item'),lb('الوصف||Description'),lb('المسؤول||Assignee'),lb('التاريخ||Date'),lb('القيمة||Value')],rows);
}

/* ===== HR ===== */
function perfByTech(list){
  const tg={};
  (list||db.wos).filter(w=>w.status==='closed').forEach(w=>{
    const k=w.assigneeName||lb('غير مسند||Unassigned');
    tg[k]=tg[k]||{c:0,hrs:0,cost:0};
    tg[k].c++;
    if(w.closedAt)tg[k].hrs+=(w.closedAt-(w.startedAt||w.createdAt))/3600000;
    tg[k].cost+=Number(w.cost||0);
  });
  return Object.entries(tg).sort((a,b)=>b[1].c-a[1].c);
}

      const e=db.employees.find(x=>x.id===s.empId)||{name:'?'};

      ${s.note?' · '+esc(s.note):''}

}

/* ===== REPORTS ===== */
function csvExport(fname,headers,rows){
  try{
    const line=a=>a.map(c=>{c=String(c??'');return /[",\n;]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(',');
    const txt='\uFEFF'+[line(headers)].concat(rows.map(line)).join('\r\n');
    const blob=new Blob([txt],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download=fname.replace(/[^\w\u0600-\u06FF-]+/g,'_')+'-'+Date.now()+'.csv';
    document.body.appendChild(a);a.click();a.remove();
    toast(lb('✔ تم تنزيل ملف Excel||✔ Excel downloaded'),'ok');
  }catch(e){alert(e.message);}
}
function vRep(){
  const act=activeCmp();
  const scope=db.wos.filter(w=>w.compoundId===act);
  const bg={};
  scope.filter(w=>w.status==='closed').forEach(w=>{
    const k=w.bname||lb('غير محدد||Unspecified');
    bg[k]=bg[k]||{c:0,cost:0};bg[k].c++;bg[k].cost+=Number(w.cost||0);
  });
  const bld=Object.entries(bg).sort((a,b)=>b[1].cost-a[1].cost);
  const maxC=bld.length?Math.max(...bld.map(x=>x[1].cost)):1;
  const techs=perfByTech(scope);
  const months=[];
  const now=new Date();
  for(let k=5;k>=0;k--){
    const d=new Date(now.getFullYear(),now.getMonth()-k,1);
    months.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));
  }
  const mLabor={},mPurch={};
  months.forEach(m=>{mLabor[m]=0;mPurch[m]=0;});
  scope.forEach(w=>{if(w.status==='closed'&&w.closedAt){const k=monthKey(w.closedAt);if(k in mLabor)mLabor[k]+=Number(w.cost||0);}});
  db.pos.forEach(po=>{if(po.invApproved&&po.invoice){const k=monthKey(po.invoice.date);if(k in mPurch)mPurch[k]+=Number(po.invoice.total||0);}});
  const maxM=Math.max(1,...months.map(m=>mLabor[m]+mPurch[m]));
  const mName=k=>{const parts=k.split('-');return new Date(+parts[0],+parts[1]-1,1).toLocaleDateString(db.lang==='ar'?'ar-EG':'en-GB',{month:'short',year:'numeric'});};
  return `<div class="toolbar"><button class="btn ghost" onclick="window.print()">🖨 ${lb('طباعة / PDF||Print / PDF')}</button></div>
  <div class="card"><h2>💰 ${lb('تكلفة الصيانة حسب الموقع||Maintenance Cost by Location')}
    <button class="btn sm ghost" onclick="repBldgCsv()">⬇ Excel</button></h2>
  <div class="tbl-wrap"><table><tr><th>${lb('الموقع||Location')}</th><th>${lb('عدد الأعمال||Jobs')}</th><th>${lb('التكلفة||Cost')}</th><th style="width:30%"></th></tr>
  ${bld.length?bld.map(kv=>`<tr><td><b>${esc(kv[0])}</b></td><td>${kv[1].c}</td><td>${money(kv[1].cost)}</td>
  <td><div class="bar" style="width:${Math.round(kv[1].cost/maxC*100)}%"></div></td></tr>`).join(''):
  `<tr><td colspan="4"><div class="empty">${lb('لا بيانات بعد||No data yet')}</div></td></tr>`}</table></div></div>
  <div class="card"><h2>👷 ${lb('أداء الفنيين||Technician Performance')}
    <button class="btn sm ghost" onclick="repTechCsv()">⬇ Excel</button></h2>
  <div class="tbl-wrap"><table><tr><th>${lb('الفني||Technician')}</th><th>${lb('أعمال منجزة||Jobs Done')}</th><th>${lb('متوسط مدة التنفيذ||Avg Time')}</th><th>${lb('تكلفة عمالة||Labor Cost')}</th></tr>
  ${techs.length?techs.map(tv=>`<tr><td><b>${esc(tv[0])}</b></td><td>${tv[1].c}</td>
  <td>${(tv[1].hrs/tv[1].c).toFixed(1)} ${lb('ساعة||hr')}</td><td>${money(tv[1].cost)}</td></tr>`).join(''):
  `<tr><td colspan="4"><div class="empty">${lb('لا بيانات بعد||No data yet')}</div></td></tr>`}</table></div></div>
  <div class="card"><h2>🧱 ${lb('نظرة عامة على المشاريع||Projects Overview')}
    <button class="btn sm ghost" onclick="repProjCsv()">⬇ Excel</button></h2>
  <div class="tbl-wrap"><table><tr><th>${lb('المشروع||Project')}</th><th>${lb('الحالة||Status')}</th><th>${lb('الميزانية||Budget')}</th><th>${lb('المصروف||Spent')}</th><th>${lb('الإنجاز||Progress')}</th></tr>
  ${db.projects.filter(p=>p.compoundId===act).length?db.projects.filter(p=>p.compoundId===act).map(p=>{const c=projCosts(p);
    return `<tr><td><b>${esc(p.name)}</b><br><span class="muted">${p.no}</span></td>
    <td><span class="badge ${PRJSTAT[p.status][1]}">${PRJSTAT[p.status][0]}</span></td>
    <td>${money(p.budget)}</td><td>${money(c.total)}</td><td>${projProgress(p)}%</td></tr>`}).join(''):
  `<tr><td colspan="5"><div class="empty">${lb('لا مشاريع بعد||No projects yet')}</div></td></tr>`}</table></div></div>
  <div class="card"><h2>📅 ${lb('مصروفات آخر 6 أشهر||Expenses — Last 6 Months')}
    <button class="btn sm ghost" onclick="repMonthCsv()">⬇ Excel</button></h2>
  <div class="tbl-wrap"><table><tr><th>${lb('الشهر||Month')}</th><th>${lb('عمالة||Labor')}</th><th>${lb('مشتريات||Purchases')}</th><th>${lb('الإجمالي||Total')}</th><th style="width:25%"></th></tr>
  ${months.map(m=>{const t=mLabor[m]+mPurch[m];
    return `<tr><td>${mName(m)}</td><td>${money(mLabor[m])}</td><td>${money(mPurch[m])}</td><td><b>${money(t)}</b></td>
    <td><div class="bar" style="width:${Math.round(t/maxM*100)}%"></div></td></tr>`}).join('')}</table></div></div>`;
}
function repBldgCsv(){
  const rows=[];const bg={};
  db.wos.filter(w=>w.compoundId===activeCmp()&&w.status==='closed').forEach(w=>{
    const k=w.bname||lb('غير محدد||Unspecified');
    bg[k]=bg[k]||{c:0,cost:0};bg[k].c++;bg[k].cost+=Number(w.cost||0);});
  Object.entries(bg).forEach(kv=>rows.push([kv[0],kv[1].c,kv[1].cost.toFixed(2)]));
  csvExport('cost-by-location',[lb('الموقع||Location'),lb('عدد الأعمال||Jobs'),lb('التكلفة SAR||Cost SAR')],rows);
}
function repTechCsv(){
  const rows=perfByTech(db.wos.filter(w=>w.compoundId===activeCmp())).map(tv=>[tv[0],tv[1].c,(tv[1].hrs/tv[1].c).toFixed(2),tv[1].cost.toFixed(2)]);
  csvExport('technician-performance',[lb('الفني||Technician'),lb('منجز||Done'),lb('متوسط ساعات||Avg Hrs'),lb('التكلفة||Cost')],rows);
}
function repProjCsv(){
  const rows=db.projects.filter(p=>p.compoundId===activeCmp()).map(p=>{const c=projCosts(p);
    return [p.no,p.name,PRJSTAT[p.status][0],Number(p.budget).toFixed(2),c.total.toFixed(2),projProgress(p)+'%'];});
  csvExport('projects',[lb('الرقم||No.'),lb('المشروع||Project'),lb('الحالة||Status'),lb('الميزانية||Budget'),lb('المصروف||Spent'),lb('الإنجاز||Progress')],rows);
}
function repMonthCsv(){
  const months=[];const now=new Date();
  for(let k=5;k>=0;k--){const d=new Date(now.getFullYear(),now.getMonth()-k,1);
    months.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));}
  const scope=db.wos.filter(w=>w.compoundId===activeCmp());
  const rows=months.map(m=>{
    let l=0,p=0;
    scope.forEach(w=>{if(w.status==='closed'&&w.closedAt&&monthKey(w.closedAt)===m)l+=Number(w.cost||0);});
    db.pos.forEach(po=>{if(po.invApproved&&po.invoice&&monthKey(po.invoice.date)===m)p+=Number(po.invoice.total||0);});
    return [m,l.toFixed(2),p.toFixed(2),(l+p).toFixed(2)];});
  csvExport('monthly-expenses',[lb('الشهر||Month'),lb('عمالة||Labor'),lb('مشتريات||Purchases'),lb('الإجمالي||Total')],rows);
}

/* ===== USERS ===== */
function vUsers(){
  if(!isAdmin())return '';
  const act=activeCmp();
  return `<div class="toolbar"><button class="btn" onclick="userForm()">＋ ${lb('مستخدم جديد||New User')}</button></div>
  <div class="card"><h2>${lb('المستخدمون||Users')} (${db.users.length})</h2><div class="tbl-wrap"><table>
  <tr><th>${lb('الاسم||Name')}</th><th>${lb('الدخول||Username')}</th><th>${lb('الدور||Role')}</th><th>${lb('الجوال||Mobile')}</th><th>${lb('المجمعات||Compounds')}</th><th></th></tr>
  ${db.users.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.u)}${u.email?`<br><span class="muted" dir="ltr">${esc(u.email)}</span>`:''}</td>
    <td><span class="badge ${u.role==='admin'?'b-down':u.role==='tech'?'b-open':'b-prog'}">${ROLES[u.role]}</span></td>
    <td>${esc(u.phone||'—')}</td>
    <td>${u.role==='admin'?`<span class="badge b-ok">${lb('الكل||All')}</span>`:(u.cmpIds||[]).map(id=>cmpName(id)).join('، ')||'—'}</td>
    <td nowrap><button class="btn sm ghost" onclick="userForm('${u.id}')">✏</button>
    ${u.id!==me.id?`<button class="btn sm danger" onclick="delUser('${u.id}')">🗑</button>`:`<span class="muted">${lb('أنت||You')}</span>`}</td></tr>`).join('')}
  </table></div></div>
  <p class="muted">📱 ${lb('رقم الجوال مطلوب لإرسال البلاغات عبر واتساب للفنيين.||Mobile number is needed for WhatsApp reports to technicians.')}</p>`;
}
function userForm(id){
  const u=id?db.users.find(x=>x.id===id):{};
  modal(`<h3>${id?lb('تعديل مستخدم||Edit User'):lb('مستخدم جديد||New User')}</h3>
  <div class="fg">
    <div><label>${lb('الاسم الكامل *||Full Name *')}</label><input id="fu_n" value="${esc(u.name||'')}"></div>
    <div><label>${lb('اسم الدخول *||Username *')}</label><input id="fu_u" value="${esc(u.u||'')}"></div>
    <div><label>${lb('البريد الإلكتروني (للدخول أيضاً)||Email (also for login)')}</label><input id="fu_e" type="email" dir="ltr" placeholder="name@company.com" value="${esc(u.email||'')}"></div>
    <div><label>${lb('كلمة المرور *||Password *')}</label><input id="fu_p" value="${esc(u.p||'')}"></div>
    <div><label>${lb('الدور||Role')}</label><select id="fu_r">${Object.keys(ROLES).map(k=>`<option value="${k}" ${u.role===k?'selected':''}>${ROLES[k]}</option>`).join('')}</select></div>
    <div><label>${lb('رقم الجوال (لواتساب)||Mobile (for WhatsApp)')}</label><input id="fu_ph" value="${esc(u.phone||'')}" placeholder="${lb('05xxxxxxxx||05xxxxxxxx')}"></div>
  </div>
  <label>${lb('المجمعات المسموحة لهذا المستخدم||Allowed Compounds')}</label>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
  ${db.compounds.map(c=>`<label style="display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink);font-weight:700">
    <input type="checkbox" class="fu_cmp" value="${c.id}" ${(u.cmpIds||[]).includes(c.id)?'checked':''}> ${esc(c.name)}</label>`).join('')}
  </div>
  <div class="ma"><button class="btn ghost" onclick="closeModal()">${lb('إلغاء||Cancel')}</button>
  <button class="btn" onclick="saveUser('${id||''}')">${lb('حفظ||Save')}</button></div>`);
}
function saveUser(id){
  const n=$('fu_n').value.trim(),un=$('fu_u').value.trim(),p=$('fu_p').value;
  const email=$('fu_e').value.trim().toLowerCase();
  if(!n||!un||!p)return toast(lb('⚠ أكمل الحقول||⚠ Fill all fields'),'err');
  if(email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return toast(lb('⚠ البريد الإلكتروني غير صحيح||⚠ Invalid email'),'err');
  if(db.users.some(x=>x.u.toLowerCase()===un.toLowerCase()&&x.id!==id))return toast(lb('⚠ اسم الدخول مستخدم||⚠ Username taken'),'err');
  if(email&&db.users.some(x=>String(x.email||'').toLowerCase()===email&&x.id!==id))return toast(lb('⚠ البريد مستخدم لحساب آخر||⚠ Email already used'),'err');
  const cmpIds=[...document.querySelectorAll('.fu_cmp:checked')].map(x=>x.value);
  const role=(id&&id===me.id)?'admin':$('fu_r').value; /* المدير يبقى مديراً — لا يستطيع سحب صلاحيته من نفسه */
  if(role!=='admin'&&!cmpIds.length)return toast(lb('⚠ اختر مجمعاً واحداً على الأقل لهذا المستخدم||⚠ Pick at least one compound for this user'),'err');
  const phone=$('fu_ph').value.trim();
  if(id){const x=db.users.find(y=>y.id===id);
    Object.assign(x,{name:n,u:un,p,email,role,phone,cmpIds,activeCmp:(x.activeCmp&&(cmpIds.includes(x.activeCmp)||role==='admin'))?x.activeCmp:''});}
  else db.users.push({id:uid('U'),name:n,u:un,p,email,role,phone,cmpIds,activeCmp:''});
  persist();closeModal();paintTab();toast(lb('✔ تم||Saved'),'ok');
}
function delUser(id){if(!confirm(lb('حذف المستخدم؟||Delete user?')))return;
  db.users=db.users.filter(u=>u.id!==id);persist();paintTab();}

/* ===== BOOT ===== */
boot().then(()=>{initLangMaps();render();});
</script>
