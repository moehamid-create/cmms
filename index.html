<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ══════════════════════════════════════════════════════════════════
   1. THMANYAH TYPOGRAPHY SYSTEM (@font-face)
   ══════════════════════════════════════════════════════════════════ */
@font-face {
  font-family: 'Thmanyah Sans';
  font-weight: 300;
  src: local('Thmanyah Sans Light'), local('ThmanyahSans-Light'),
       url('/fonts/ThmanyahSans-Light.woff2') format('woff2');
  font-display: swap;
}
@font-face {
  font-family: 'Thmanyah Sans';
  font-weight: 400;
  src: local('Thmanyah Sans'), local('Thmanyah Sans Regular'), local('ThmanyahSans-Regular'),
       url('/fonts/ThmanyahSans-Regular.woff2') format('woff2');
  font-display: swap;
}
@font-face {
  font-family: 'Thmanyah Sans';
  font-weight: 500;
  src: local('Thmanyah Sans Medium'), local('ThmanyahSans-Medium'),
       url('/fonts/ThmanyahSans-Medium.woff2') format('woff2');
  font-display: swap;
}
@font-face {
  font-family: 'Thmanyah Sans';
  font-weight: 700;
  src: local('Thmanyah Sans Bold'), local('ThmanyahSans-Bold'),
       url('/fonts/ThmanyahSans-Bold.woff2') format('woff2');
  font-display: swap;
}
@font-face {
  font-family: 'Thmanyah Sans';
  font-weight: 800;
  src: local('Thmanyah Sans Black'), local('ThmanyahSans-Black'), local('Thmanyah Sans Heavy'),
       url('/fonts/ThmanyahSans-Black.woff2') format('woff2');
  font-display: swap;
}
@font-face {
  font-family: 'Thmanyah Serif Display';
  font-weight: 700 800;
  src: local('Thmanyah Serif Display'), local('ThmanyahSerifDisplay-Bold'), local('Thmanyah Serif Bold'),
       url('/fonts/ThmanyahSerifDisplay-Bold.woff2') format('woff2');
  font-display: swap;
}

/* ══════════════════════════════════════════════════════════════════
   2. DESIGN TOKENS — THMANYAH EDITORIAL & ENTERPRISE CMMS PALETTE
   ══════════════════════════════════════════════════════════════════ */
:root {
  /* Both --font-thmanyah and --font-greta map to Thmanyah Sans so existing inline styles inherit it automatically */
  --font-thmanyah: "Thmanyah Sans", "Thmanyah", "IBM Plex Sans Arabic", system-ui, -apple-system, sans-serif;
  --font-greta: var(--font-thmanyah);
  --font-display: "Thmanyah Serif Display", "Thmanyah Sans", "IBM Plex Sans Arabic", sans-serif;

  /* Light Mode — Warm Editorial Paper & Deep Teal/Slate */
  --liquid-bg-base: #f4f3ef;
  --surface-1: #ffffff;
  --surface-2: #f9f8f5;
  --surface-3: #efede7;
  --glass-hi: rgba(255, 255, 255, 0.90);
  --glass-lo: rgba(250, 249, 245, 0.78);
  --glass-border: rgba(15, 23, 42, 0.09);
  --glass-border-subtle: rgba(15, 23, 42, 0.06);
  --line: rgba(15, 23, 42, 0.10);
  --line-soft: rgba(15, 23, 42, 0.06);
  --s2: rgba(15, 23, 42, 0.035);
  --s3: rgba(15, 23, 42, 0.065);

  --ink: #11161b;
  --muted: #57636e;
  --brand: #0b6e69;       /* Thmanyah Deep Emerald-Teal */
  --brand-2: #0e8a83;
  --dark: #074f4b;
  --brand-soft: rgba(11, 110, 105, 0.09);
  --glass-glow: rgba(11, 110, 105, 0.18);
  --sand: #b4761a;

  /* Semantic Status Colors */
  --red: #c81e1e;     --redbg: rgba(254, 226, 226, 0.9);
  --green: #047857;   --greenbg: rgba(209, 250, 229, 0.9);
  --amber: #b45309;   --amberbg: rgba(254, 243, 199, 0.92);
  --blue: #1d4ed8;    --bluebg: rgba(219, 234, 254, 0.9);
  --purple: #6d28d9;  --purplebg: rgba(237, 233, 254, 0.9);

  /* Elevation & Radii */
  --shadow-glass: 0 4px 20px -4px rgba(17, 22, 27, 0.06), 0 1px 3px 0 rgba(17, 22, 27, 0.04);
  --shadow-glass-hover: 0 12px 30px -6px rgba(17, 22, 27, 0.11), 0 4px 10px -2px rgba(17, 22, 27, 0.05);
  --shadow-glass-float: 0 24px 54px -12px rgba(17, 22, 27, 0.18), 0 8px 20px -4px rgba(17, 22, 27, 0.08);
  --shadow: var(--shadow-glass);
  --shadow-lift: var(--shadow-glass-hover);
  --glass-specular: inset 0 1px 0 rgba(255, 255, 255, 0.9);
  --glass-specular-soft: inset 0 1px 0 rgba(255, 255, 255, 0.7);
  --r: 14px;
  --radius-liquid: 16px;
  --radius-pill: 9999px;
}

:root.dark {
  --liquid-bg-base: #0b1015;
  --surface-1: #131b23;
  --surface-2: #18222c;
  --surface-3: #1f2c38;
  --glass-hi: rgba(20, 29, 38, 0.88);
  --glass-lo: rgba(14, 21, 28, 0.76);
  --glass-border: rgba(255, 255, 255, 0.10);
  --glass-border-subtle: rgba(255, 255, 255, 0.06);
  --line: rgba(255, 255, 255, 0.09);
  --line-soft: rgba(255, 255, 255, 0.05);
  --s2: rgba(255, 255, 255, 0.04);
  --s3: rgba(255, 255, 255, 0.08);

  --ink: #f1f5f8;
  --muted: #94a3b3;
  --brand: #2dd4bf;
  --brand-2: #14b8a6;
  --dark: #0d9488;
  --brand-soft: rgba(45, 212, 191, 0.13);
  --glass-glow: rgba(45, 212, 191, 0.22);
  --sand: #fbbf24;

  --red: #f87171;     --redbg: rgba(127, 29, 29, 0.45);
  --green: #34d399;   --greenbg: rgba(6, 78, 59, 0.48);
  --amber: #fbbf24;   --amberbg: rgba(120, 53, 15, 0.48);
  --blue: #60a5fa;    --bluebg: rgba(30, 58, 138, 0.48);
  --purple: #a78bfa;  --purplebg: rgba(76, 29, 149, 0.48);

  --shadow-glass: 0 10px 30px -8px rgba(0, 0, 0, 0.55), 0 2px 8px 0 rgba(0, 0, 0, 0.35);
  --shadow-glass-hover: 0 18px 42px -10px rgba(0, 0, 0, 0.72);
  --shadow-glass-float: 0 28px 68px -12px rgba(0, 0, 0, 0.85);
  --glass-specular: inset 0 1px 0 rgba(255, 255, 255, 0.12);
  --glass-specular-soft: inset 0 1px 0 rgba(255, 255, 255, 0.08);
}

/* ══════════════════════════════════════════════════════════════════
   3. BASE RESET & THMANYAH TYPOGRAPHY RULES
   ══════════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-thmanyah);
  color: var(--ink);
  background: var(--liquid-bg-base);
  font-size: 14.5px;
  line-height: 1.6;
  font-feature-settings: "kern" 1, "liga" 1;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}
.dark body { color-scheme: dark; }

/* Subtle Editorial Grid & Ambient Glow */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(ellipse 55% 45% at 85% 8%, rgba(11, 110, 105, 0.08), transparent 65%),
    radial-gradient(ellipse 45% 40% at 12% 88%, rgba(180, 118, 26, 0.06), transparent 65%);
}
.dark body::before {
  background:
    radial-gradient(ellipse 55% 45% at 85% 8%, rgba(45, 212, 191, 0.09), transparent 65%),
    radial-gradient(ellipse 45% 40% at 12% 88%, rgba(56, 189, 248, 0.06), transparent 65%);
}

h1, h2, h3, .brand-t, .topbar .ttl, .stat .num, .pillar-head .pt, .auth-title, .hero-headline {
  font-family: var(--font-display);
  letter-spacing: -0.015em;
  line-height: 1.3;
}
p, .sub, .auth-sub, .quote-text, .feature-text p, label, input, select, textarea, button, td, th, .stat .lbl {
  font-family: var(--font-thmanyah);
}

/* Custom Scrollbar */
* { scrollbar-width: thin; scrollbar-color: rgba(100, 116, 139, 0.3) transparent; }
::-webkit-scrollbar { width: 7px; height: 7px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.3); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: var(--brand); }

/* ══════════════════════════════════════════════════════════════════
   4. APP SHELL — SIDEBAR & TOPBAR
   ══════════════════════════════════════════════════════════════════ */
.layout { display: flex; min-height: 100vh; align-items: stretch; }

.side {
  position: sticky; top: 14px; height: calc(100vh - 28px);
  flex: 0 0 252px; margin: 14px; padding: 18px 14px 14px;
  border-radius: 18px; display: flex; flex-direction: column; gap: 5px;
  overflow-y: auto; overflow-x: hidden;
  background: var(--surface-1);
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow-glass);
}
.brand {
  display: flex; align-items: center; gap: 11px;
  padding: 2px 6px 14px; margin-bottom: 6px;
  border-bottom: 1px solid var(--line-soft);
}
.brand .logo {
  width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff;
  box-shadow: 0 6px 16px -4px rgba(11, 110, 105, 0.45);
}
.brand .logo img { width: 40px; height: 40px; border-radius: 11px; display: block; }
.brand-t { font-weight: 800; font-size: 15px; color: var(--ink); }
.brand-t small { display: block; font-family: var(--font-thmanyah); font-weight: 500; color: var(--muted); font-size: 11px; margin-top: 1px; }

.sidediv { height: 1px; background: var(--line-soft); margin: 6px 4px; }
.slabel { font-size: 11px; font-weight: 700; color: var(--muted); padding: 8px 10px 3px; }

.nbtn {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 41px;
  padding: 8px 12px; border-radius: 11px; border: 1px solid transparent;
  background: transparent; color: var(--muted); font-weight: 700; font-size: 13.5px;
  cursor: pointer; transition: all 0.16s ease; text-align: start; white-space: nowrap; overflow: hidden;
}
.nbtn .nt { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.nbtn .ic { width: 22px; text-align: center; display: inline-flex; align-items: center; justify-content: center; }
.nbtn .ic svg { width: 19px; height: 19px; }
.nbtn:hover { background: var(--s2); color: var(--ink); }
.nbtn.active {
  background: var(--brand); color: #ffffff !important;
  box-shadow: 0 6px 18px -6px rgba(11, 110, 105, 0.55);
}
.dark .nbtn.active { background: var(--brand); color: #061822 !important; }

.sidefoot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line-soft); }
.ucard {
  display: flex; align-items: center; gap: 10px; padding: 9px 10px;
  border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line-soft);
}
.ucard .av {
  width: 34px; height: 34px; border-radius: 99px; display: grid; place-items: center;
  font-weight: 800; color: #fff; background: var(--brand); flex: 0 0 auto;
}
.ucard .nm { font-weight: 700; font-size: 13px; color: var(--ink); }
.ucard .rl { color: var(--muted); font-size: 11px; font-weight: 500; }
.sideacts { display: flex; gap: 5px; flex-wrap: wrap; }
.sideacts button { flex: 1; }

.content { flex: 1; min-width: 0; max-width: 1600px; display: flex; flex-direction: column; padding: 14px 20px 28px; }

.topbar {
  position: sticky; top: 10px; z-index: 20; margin-bottom: 16px; padding: 11px 18px;
  border-radius: 15px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
  background: var(--glass-hi); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border); box-shadow: var(--shadow-glass);
}
.topbar .ttl { font-weight: 800; font-size: 17px; display: flex; align-items: center; gap: 8px; }
.topbar .pname {
  font-family: var(--font-thmanyah); background: var(--brand-soft); color: var(--brand);
  border: 1px solid rgba(11, 110, 105, 0.22); padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 700;
}
.topbar .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); font-weight: 600; }

.topbar .asw, .bell {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 11px;
  padding: 5px 10px; cursor: pointer; font: inherit; color: var(--ink); transition: all 0.16s ease;
}
.topbar .asw:hover, .bell:hover { border-color: var(--brand); background: var(--surface-1); }
.asw-ic { width: 24px; height: 24px; border-radius: 7px; display: flex; align-items: center; justify-content: center; color: #fff; flex: 0 0 auto; }
.asw-tx { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.2; min-width: 0; }
.asw-tx b { font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
.asw-tx small { font-size: 10px; color: var(--muted); font-weight: 500; }
.bell { position: relative; padding: 6px 10px; }
.bellb {
  position: absolute; top: -5px; inset-inline-end: -5px; background: var(--red); color: #fff;
  border-radius: 99px; font-size: 10px; padding: 1px 5px; font-weight: 800;
}

main { flex: 1; }
footer { text-align: center; color: var(--muted); font-size: 11.5px; padding: 20px 0 6px; }

/* ══════════════════════════════════════════════════════════════════
   5. CARDS, KPIs, MODULE HUB & DATA VISUALIZATION
   ══════════════════════════════════════════════════════════════════ */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat {
  border-radius: var(--r); padding: 15px 16px 13px; position: relative; overflow: hidden;
  background: var(--surface-1); border: 1px solid var(--glass-border); box-shadow: var(--shadow-glass);
  transition: transform 0.18s ease, box-shadow 0.18s ease;
}
.stat::before {
  content: ""; position: absolute; top: 0; bottom: 0; inset-inline-start: 0; width: 4px;
  background: var(--brand);
}
.stat.warn::before { background: var(--red); }
.stat.ok::before { background: var(--green); }
.stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-glass-hover); }
.stat .num { font-size: 27px; font-weight: 800; line-height: 1.15; }
.stat .lbl { font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 4px; }
.stat.warn .num { color: var(--red); }
.stat.ok .num { color: var(--green); }
.kpi { cursor: pointer; }
.kpi .khead { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
.kpi .kico { opacity: 0.7; color: var(--brand); }

.card, .pillar, .mkt-provider, .mkt-rfq, .mkt-kpi, .login-card {
  border-radius: var(--radius-liquid); padding: 18px; margin-bottom: 16px;
  background: var(--surface-1); border: 1px solid var(--glass-border); box-shadow: var(--shadow-glass);
}
.card h2 {
  font-size: 16px; font-weight: 800; padding-bottom: 10px; margin-bottom: 12px;
  border-bottom: 1px solid var(--line-soft);
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
}

.dash-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; }
.dg-12 { grid-column: span 12; } .dg-8 { grid-column: span 8; } .dg-7 { grid-column: span 7; }
.dg-6 { grid-column: span 6; }   .dg-5 { grid-column: span 5; } .dg-4 { grid-column: span 4; }
@media (max-width: 1080px) { .dg-8, .dg-7, .dg-6, .dg-5, .dg-4 { grid-column: span 12; } }

/* Module Hub Pillars */
.hub-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 0 0 10px; }
.hub-head b { font-family: var(--font-display); font-size: 16px; font-weight: 800; }
.hub-badge { font-size: 11px; font-weight: 700; color: var(--brand); background: var(--brand-soft); border: 1px solid rgba(11, 110, 105, 0.22); padding: 3px 10px; border-radius: 99px; }
.hub { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; margin-bottom: 16px; }
.pillar { display: flex; flex-direction: column; gap: 11px; margin-bottom: 0; }
.pillar-head { display: flex; align-items: center; gap: 10px; }
.pillar-ic { width: 38px; height: 38px; border-radius: 11px; display: flex; align-items: center; justify-content: center; color: #fff; flex: 0 0 auto; }
.pillar-head .pt { display: block; font-size: 15px; font-weight: 800; }
.pillar-head .ps { display: block; font-size: 11px; color: var(--muted); font-weight: 500; }
.pillar-head .pgo { margin-inline-start: auto; }
.psub { font-size: 11px; color: var(--muted); font-weight: 700; }
.ic-bldg { background: linear-gradient(135deg, #0b6e69, #0e8a83); }
.ic-tool { background: linear-gradient(135deg, #b45309, #d97706); }
.ic-fin  { background: linear-gradient(135deg, #047857, #10b981); }
.ic-fleet { background: linear-gradient(135deg, #6d28d9, #8b5cf6); }
.ic-ind  { background: linear-gradient(135deg, #b45309, #f59e0b); }
.ic-gen  { background: linear-gradient(135deg, #334155, #64748b); }

.pkpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: 8px; }
.pkpi { background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: 10px; padding: 8px 10px; }
.pkpi .v { font-size: 16px; font-weight: 800; line-height: 1.25; }
.pkpi .v small { font-size: 10px; font-weight: 600; color: var(--muted); }
.pkpi .k { font-size: 10.5px; color: var(--muted); font-weight: 600; margin-top: 2px; }
.pkpi.warn .v { color: var(--red); }
.pkpi.ok .v { color: var(--green); }

.donut-wrap { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; justify-content: center; }
.donut { width: 114px; height: 114px; border-radius: 50%; position: relative; flex: 0 0 auto; }
.donut .hole {
  position: absolute; inset: 15px; border-radius: 50%; background: var(--surface-1);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.donut .hole b { font-size: 19px; font-weight: 800; line-height: 1; }
.donut .hole small { font-size: 10px; color: var(--muted); font-weight: 600; margin-top: 2px; }

.legend { display: flex; flex-direction: column; gap: 4px; min-width: 150px; flex: 1; }
.legend .li { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12.5px; font-weight: 600; cursor: pointer; padding: 4px 8px; border-radius: 8px; }
.legend .li:hover { background: var(--s2); }
.legend .lft { display: flex; align-items: center; gap: 8px; }
.legend .dot { width: 10px; height: 10px; border-radius: 3px; }

.hbar, .hbar-row { display: grid; grid-template-columns: 110px 1fr 66px; gap: 8px; align-items: center; margin-bottom: 8px; font-size: 12.5px; font-weight: 600; }
.hbar > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .hb { height: 18px; border-radius: 6px; background: var(--s3); overflow: hidden; }
.hbar .hb i { display: block; height: 100%; border-radius: 6px; transition: width 0.4s ease; }
.hbar .hv { font-size: 11.5px; color: var(--muted); text-align: end; white-space: nowrap; }
.hbar.click, .hbar-row.click { cursor: pointer; }
.pillar-foot { margin-top: auto; display: flex; gap: 6px; flex-wrap: wrap; padding-top: 4px; }

.fchart, .mchart { display: flex; gap: 8px; align-items: flex-end; height: 120px; }
.fcol, .mcol { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; height: 100%; }
.fcol .fbars { display: flex; gap: 3px; align-items: flex-end; justify-content: center; width: 100%; height: 100%; }
.fcol .fbars i { width: 44%; max-width: 22px; border-radius: 5px 5px 2px 2px; }
.fcol .fbars i.inc { background: var(--green); }
.fcol .fbars i.exp { background: var(--red); }
.fcol .fl, .mx { font-size: 10px; color: var(--muted); font-weight: 600; }

.netline {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  padding: 9px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line);
  font-weight: 700; font-size: 13px;
}
.netline .nv { font-size: 16px; font-weight: 800; }
.netline.pos .nv { color: var(--green); }
.netline.neg .nv { color: var(--red); }

/* ══════════════════════════════════════════════════════════════════
   6. TABLES, FORMS, BUTTONS & BADGES
   ══════════════════════════════════════════════════════════════════ */
.tbl-wrap {
  overflow-x: auto; border-radius: 12px; background: var(--surface-1);
  border: 1px solid var(--line);
}
table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.5px; }
th {
  text-align: start; background: var(--surface-2); color: var(--muted);
  font-size: 11.5px; font-weight: 700; padding: 10px 12px;
  border-bottom: 1px solid var(--line); white-space: nowrap;
}
td { padding: 10px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--s2); }
.overdue td { background: var(--redbg) !important; }

.badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px;
  border-radius: 99px; font-size: 11.5px; font-weight: 700; white-space: nowrap;
  border: 1px solid transparent;
}
.b-open   { background: var(--bluebg);   color: var(--blue); }
