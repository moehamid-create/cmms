[build]
builder = "dockerfile"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = "off"
min_machines_running = 1

[[http_service.checks]]
grace_period = "15s"
interval = "30s"
method = "GET"
path = "/healthz"
timeout = "5s"

[[mounts]]
source = "cmms_data"
destination = "/data"

[env]
DATA_DIR = "/data"
NODE_ENV = "production"
